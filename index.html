<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Refore 協力業者ポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F4; --surface:#FFFFFF; --ink:#18212C; --sub:#5A6574; --line:#D3D9E0;
  --kon:#1F3A5F; --kon-text:#1F3A5F; --kon-ink:#FFFFFF; --kon-soft:#E2E9F2;
  --shu:#C42E26; --caution:#E8B21C; --warn:#8A5F00; --warn-soft:#FBF1D6;
  --ok:#2C7A4B;
  --font:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  --num:"Barlow Condensed","Arial Narrow","BIZ UDPGothic",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11161D; --surface:#19212B; --ink:#E5EAF0; --sub:#9AA5B3; --line:#2B3542;
    --kon:#2F5487; --kon-text:#8FB2E3; --kon-ink:#FFFFFF; --kon-soft:#1E2A3A;
    --shu:#E5584E; --warn:#E8B21C; --warn-soft:#30291A; --ok:#5BB585;
  }
}
:root[data-theme="dark"]{
  --paper:#11161D; --surface:#19212B; --ink:#E5EAF0; --sub:#9AA5B3; --line:#2B3542;
  --kon:#2F5487; --kon-text:#8FB2E3; --kon-ink:#FFFFFF; --kon-soft:#1E2A3A;
  --shu:#E5584E; --warn:#E8B21C; --warn-soft:#30291A; --ok:#5BB585;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
img{max-width:100%;display:block}
a{color:var(--kon-text)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--caution);outline-offset:2px}
h1{font-size:22px;line-height:1.4;margin:0 0 4px}
h2{font-size:16px;line-height:1.5;margin:0 0 12px}

/* デモ表示 */
.demo{background:var(--caution);color:#1d1600;font-size:13px;padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.demo button{background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.25);border-radius:4px;padding:2px 10px;cursor:pointer;font-size:13px;color:#1d1600}

/* ヘッダー */
.top{background:var(--kon);color:var(--kon-ink)}
.top-in{max-width:960px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-decoration:none;color:inherit}
.brand-mark{flex:none;width:34px;height:34px;border:2px solid currentColor;display:grid;place-items:center;font-family:var(--num);font-weight:600;font-size:20px;border-radius:3px}
.brand b{display:block;font-size:15px;line-height:1.3}
.brand small{display:block;font-size:12px;opacity:.8;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .link{background:none;border:1px solid rgba(255,255,255,.45);color:inherit;border-radius:4px;padding:4px 10px;font-size:13px;cursor:pointer;flex:none}
.admin-nav{max-width:960px;margin:0 auto;padding:0 8px;display:flex;gap:4px}
.admin-nav a{padding:8px 12px 10px;text-decoration:none;font-size:14px;color:rgba(255,255,255,.75);border-bottom:3px solid transparent}
.admin-nav a[aria-current="page"]{color:#fff;border-color:var(--caution);font-weight:700}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--caution);color:#1d1600;font-size:12px;font-weight:700;text-align:center;line-height:20px;margin-left:4px}

/* 職人用タブ（スマホは下、PCは上） */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 10px;font-size:11px;text-decoration:none;color:var(--sub)}
.tabbar svg{width:22px;height:22px}
.tabbar a[aria-current="page"]{color:var(--kon-text);font-weight:700}
@media (min-width:720px){
  .tabbar{position:sticky;top:0;bottom:auto;display:flex;justify-content:center;gap:4px;border-top:0;border-bottom:1px solid var(--line);padding-bottom:0}
  .tabbar a{flex-direction:row;gap:6px;font-size:14px;padding:10px 16px;border-bottom:3px solid transparent}
  .tabbar a[aria-current="page"]{border-color:var(--kon-text)}
  .tabbar svg{width:18px;height:18px}
}

.main{max-width:960px;margin:0 auto;padding:20px 16px 110px}
@media (min-width:720px){.main{padding-bottom:48px}}
.lead{color:var(--sub);font-size:14px;margin:0 0 20px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.page-head .lead{margin:0}
.back{display:inline-block;font-size:14px;color:var(--sub);text-decoration:none;margin-bottom:10px;padding:4px 0}
.small{font-size:13px;color:var(--sub)}
.pre{white-space:pre-wrap;word-break:break-word}
.center{text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.end{justify-content:flex-end}
.stack{display:grid;gap:16px;align-content:start}
.cols{display:grid;gap:16px}
@media (min-width:860px){.cols{grid-template-columns:1.25fr 1fr;align-items:start}}

/* 絞り込み */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters select{width:auto;padding:8px 10px;font-size:14px}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--kon)}
.seg{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.seg a{padding:5px 14px;border-radius:999px;border:1px solid var(--line);text-decoration:none;font-size:13px;white-space:nowrap;background:var(--surface);color:var(--ink)}
.seg a[aria-current="true"]{background:var(--kon);border-color:var(--kon);color:var(--kon-ink)}

/* 案件カード：伝票＋判子 */
.list{display:grid;gap:12px}
@media (min-width:720px){.list.grid{grid-template-columns:1fr 1fr}}
.job{position:relative;display:block;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--kon);border-radius:6px;padding:14px 16px;text-decoration:none;color:var(--ink);overflow:hidden}
.job:hover{border-color:var(--kon-text)}
.job h3{font-size:17px;margin:6px 0 8px;line-height:1.45;padding-right:66px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:12px;background:var(--kon-soft);color:var(--ink);padding:1px 8px;border-radius:3px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px;margin:0}
.meta dt{color:var(--sub)}
.meta dd{margin:0}
.price{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.price .num{font-family:var(--num);font-weight:600;font-size:30px;line-height:1;letter-spacing:.01em}
.price small{color:var(--sub);font-size:12px}
.price.big{border:0;padding:0;margin:4px 0 14px}
.price.big .num{font-size:42px}
.job .foot{margin:8px 0 0;font-size:13px;color:var(--sub)}
.count{font-family:var(--num);font-weight:600;font-size:20px;color:var(--ink)}
.stamp{position:absolute;top:12px;right:12px;width:60px;height:60px;border:2px solid var(--stamp,var(--shu));color:var(--stamp,var(--shu));border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.04em;transform:rotate(-12deg);box-shadow:inset 0 0 0 2px var(--surface),inset 0 0 0 3.5px var(--stamp,var(--shu));pointer-events:none}
.stamp.mute{--stamp:var(--sub)}
.stamp.inline{position:static;flex:none}
.stamp.press{animation:press .38s cubic-bezier(.2,.9,.3,1.2)}
@keyframes press{0%{transform:rotate(-12deg) scale(1.9);opacity:0}70%{transform:rotate(-12deg) scale(.94);opacity:1}100%{transform:rotate(-12deg) scale(1)}}

/* パネル・詳細 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.panel > :last-child{margin-bottom:0}
.panel h2 small{font-weight:400;color:var(--sub);font-size:12px;margin-left:6px}
.detail h1{margin:8px 0 6px}
.detail h2{font-size:15px;margin:20px 0 8px;border-left:4px solid var(--caution);padding-left:8px}
.kv{display:grid;grid-template-columns:7.5em 1fr;gap:6px 12px;margin:0;font-size:14px}
.kv dt{color:var(--sub)}
.kv dd{margin:0;white-space:pre-wrap;word-break:break-word}
.note{background:var(--warn-soft);border-left:4px solid var(--caution);padding:10px 12px;font-size:14px;border-radius:0 4px 4px 0;margin:0 0 16px}
.empty{text-align:center;color:var(--sub);padding:36px 16px;border:1px dashed var(--line);border-radius:6px;background:var(--surface)}
.row-item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.row-item:hover{border-color:var(--kon-text)}
.row-main{display:grid;gap:2px;min-width:0}
.applicant{border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.applicant + .applicant{margin-top:10px}
.applicant.dim{opacity:.6}
.msg{background:var(--paper);border-radius:4px;padding:8px 10px;font-size:14px;margin:8px 0}

.pill{display:inline-block;flex:none;font-size:12px;padding:1px 10px;border-radius:999px;border:1px solid currentColor;font-weight:700;white-space:nowrap}
.pill.applied,.pill.open{color:var(--kon-text)}
.pill.selected,.pill.approved,.pill.assigned{color:var(--ok)}
.pill.rejected,.pill.withdrawn,.pill.suspended,.pill.closed,.pill.paid{color:var(--sub)}
.pill.working,.pill.finished{color:var(--kon-text)}
.pill.completed{color:var(--warn)}
.pill.pending,.pill.submitted,.pill.draft{color:var(--warn)}
.pill.returned{color:var(--shu)}

/* 写真 */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin:8px 0}
.photos .ph{position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;background:var(--paper)}
.photos button.zoom{padding:0;border:0;background:none;cursor:zoom-in;width:100%;height:100%}
.photos img{width:100%;height:100%;object-fit:cover}
.photos .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;font-size:14px;line-height:26px;padding:0}

/* フォーム */
.field{display:grid;gap:6px;margin:0 0 16px}
.field > span,.field > legend{font-size:14px;font-weight:700;padding:0}
.field small{color:var(--sub);font-size:12px;font-weight:400;margin-left:4px}
fieldset{border:0;padding:0;min-width:0}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=date],input[type=file],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-size:16px}
input[type=file]{padding:8px}
textarea{min-height:110px;resize:vertical}
.two{display:grid;gap:0 12px}
@media (min-width:560px){.two{grid-template-columns:1fr 1fr}}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:4px;padding:6px 10px;background:var(--surface);font-size:14px;cursor:pointer}
.checks input{accent-color:var(--kon);width:18px;height:18px;margin:0}
.checks label:has(input:checked){border-color:var(--kon-text);background:var(--kon-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--kon);background:var(--kon);color:var(--kon-ink);border-radius:4px;padding:10px 18px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;min-height:44px}
.btn.sub{background:transparent;color:var(--kon-text);border-color:var(--kon-text)}
.btn.danger{background:transparent;color:var(--shu);border-color:var(--shu)}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:progress}
.textlink{background:none;border:0;color:var(--kon-text);text-decoration:underline;cursor:pointer;padding:0;font-size:14px}

/* ログイン */
.auth-wrap{max-width:440px;margin:0 auto;padding:36px 16px 48px}
.auth-wrap.wide{max-width:680px}
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.auth-brand .brand-mark{width:46px;height:46px;font-size:26px;background:var(--kon);color:var(--kon-ink);border-color:var(--kon)}
.auth-brand b{font-size:18px;display:block;line-height:1.35}
.auth-brand small{color:var(--sub);font-size:13px}

/* モーダル・通知 */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:6px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.modal-bg{position:fixed;inset:0;background:rgba(8,12,18,.6);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:8px;padding:20px;width:100%;max-width:440px}
.modal p{margin:0 0 14px;font-size:14px}
.modal textarea,.modal input{margin-bottom:14px}
.lightbox img{max-height:86vh;max-width:100%;border-radius:4px}

/* 進捗 */
.track{list-style:none;margin:0;padding:0}
.track li{position:relative;display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px;color:var(--sub)}
.track li:not(:last-child)::before{content:"";position:absolute;left:10px;top:28px;bottom:-6px;width:2px;background:var(--line)}
.track li.done:not(:last-child)::before{background:var(--kon-text)}
.track .dot{flex:none;position:relative;z-index:1;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.track li.done{color:var(--ink)}
.track li.done .dot{background:var(--kon);border-color:var(--kon)}
.track li.done .dot::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.track li.next{color:var(--ink);font-weight:700}
.track li.next .dot{border:3px solid var(--caution)}
.track .lbl{flex:1}
.track .tm{font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
.mini{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.mini i{width:12px;height:5px;border-radius:2px;background:var(--line)}
.mini i.on{background:var(--kon-text)}
.day-head{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--sub);margin:22px 0 10px}
.day-head b{color:var(--ink);font-size:16px}
.day-head::after{content:"";flex:1;border-top:1px solid var(--line)}
.doc-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.doc-row:first-of-type{border-top:0;padding-top:0}
.doc-row .row-main b{font-size:15px}
.doc-row .btn{flex:none;white-space:nowrap;min-height:40px;padding:8px 14px;font-size:14px}
.itbl{width:100%;border-collapse:collapse;font-size:14px}
.itbl td{border-top:1px solid var(--line);padding:8px 0;vertical-align:top}
.itbl td span{display:block}
.itbl .r{text-align:right;white-space:nowrap;padding-left:12px;font-variant-numeric:tabular-nums}
.itbl tr.sum td{font-weight:700;border-top:2px solid var(--ink)}
.items-ed{display:grid;gap:8px}
.item-row{display:grid;grid-template-columns:1fr 76px 72px 110px 96px 34px;gap:6px;align-items:center}
.item-row input{padding:8px 10px;font-size:15px}
.item-row .i-amt{text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.i-x{width:34px;height:34px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--sub);cursor:pointer;font-size:16px;padding:0}
@media (max-width:680px){
  .item-row{grid-template-columns:1fr 1fr 1fr 34px;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--paper)}
  .item-row [name=i_name]{grid-column:1/-1}
  .item-row .i-amt{grid-column:1/-1;grid-row:3}
}
.i-total{font-family:var(--num);font-size:24px;font-weight:600}
.import{border:2px dashed var(--kon-text)}
.pdftext{white-space:pre-wrap;font-size:12px;max-height:260px;overflow:auto;background:var(--paper);padding:8px;border-radius:4px;margin:6px 0 0}
.pdf-thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.pdf-thumbs .zoom{flex:none;width:110px;border:1px solid var(--line);border-radius:4px;padding:0;background:#fff;cursor:zoom-in}
.pdfview{padding:16px}
.pdfframe{display:block;width:100%;height:85vh;min-height:620px;margin-top:12px;border:1px solid var(--line);border-radius:4px;background:#fff}
.pdfview .zoom{display:block;width:100%;max-width:1000px;margin:12px auto 0;padding:0;border:1px solid var(--line);border-radius:4px;background:#fff;cursor:zoom-in}
.pdfview img{width:100%;height:auto}
.lightbox.doc{display:block;overflow:auto;padding:16px}
.lightbox.doc img{max-height:none;width:min(100%,1400px);margin:0 auto;display:block}
.cal-tool{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.cal-tool h2{margin:0;font-size:20px;min-width:7.5em;text-align:center}
.cal-tool .btn{min-height:36px;padding:4px 14px;font-size:18px}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-bottom:10px}
.cal-legend .cal-bar{cursor:default;margin:0;font-size:12px}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.cal-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--paper);font-size:12px;text-align:center;padding:4px 0;color:var(--sub)}
.sun{color:var(--shu)} .sat{color:var(--kon-text)}
.cal-week{position:relative;min-height:92px;border-top:1px solid var(--line)}
.cal-bg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-bg div + div{border-left:1px solid var(--line)}
.cal-bg .other{background:var(--paper)}
.cal-fg{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:min-content;row-gap:3px;padding-bottom:8px}
.cal-num{grid-row:1;font-size:12px;padding:4px 6px 2px;font-variant-numeric:tabular-nums}
.cal-num.other{opacity:.45}
.cal-num.today span{display:inline-block;min-width:22px;text-align:center;background:var(--kon);color:#fff;border-radius:999px}
.cal-bar{display:block;min-width:0;margin:0;border:0;padding:3px 6px;font:inherit;font-size:12px;line-height:1.35;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-radius:0}
.cal-bar.s{margin-left:3px;border-top-left-radius:4px;border-bottom-left-radius:4px}
.cal-bar.e{margin-right:3px;border-top-right-radius:4px;border-bottom-right-radius:4px}
.cal-bar.c-open{background:var(--warn-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--caution)}
.cal-bar.c-closed{background:var(--paper);color:var(--sub);box-shadow:inset 0 0 0 1px var(--line)}
.cal-bar.c-work{background:var(--kon);color:var(--kon-ink)}
.cal-bar.c-done{background:var(--line);color:var(--ink)}
.cal-bar:hover{filter:brightness(.95)}
@media (max-width:600px){
  .cal-week{min-height:72px}
  .cal-bar{font-size:10px;padding:2px 3px}
  .cal-num{padding:2px 3px}
}
.pill.issued{color:var(--warn)}
.inv-lines{display:grid;gap:8px;margin-bottom:12px}
.inv-line{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer}
.inv-line input[type=checkbox]{width:20px;height:20px;accent-color:var(--kon);flex:none}
.inv-line .row-main{flex:1}
.inv-amt{display:flex;align-items:center;gap:2px;flex:none}
.inv-amt input{width:120px;text-align:right;padding:8px}
.inv-sum{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px 18px;margin:0 0 14px;font-size:14px}
.inv-sum b{font-size:18px;font-variant-numeric:tabular-nums}

/* ---------- 共通の小道具 ---------- */

/* ---------- 案件PDFの読み込み ---------- */
async function openPdf(file){
  if(!window.pdfjsLib){
    let err;
    for(const base of PDFJS_SOURCES){
      try { await loadScript(base + "build/pdf.min.js"); PDFJS_BASE = base; err = null; break; } catch(e) { err = e; }
    }
    if(err) throw new Error("PDFを表示する部品を読み込めませんでした。通信環境を確認してください");
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + "build/pdf.worker.min.js";
  return pdfjsLib.getDocument({data:await file.arrayBuffer(), cMapUrl:PDFJS_BASE + "cmaps/", cMapPacked:true,
    standardFontDataUrl:PDFJS_BASE + "standard_fonts/", useSystemFonts:true, isEvalSupported:false}).promise;
}
// PDFの各ページを画像にする（Firestoreの1件あたりの上限に収まるよう、大きすぎれば画質を下げる）
// 1ページ＝1件で保存（Firestoreの1件1MBの上限対策）。元のPDFも分割して保存
const PDF_MAX_PAGES = 20, PDF_MAX_CHARS = 900000, PDF_CHUNK = 900000, PDF_MAX_CHUNKS = 12;
async function renderPdfPages(pdf){
  const n = Math.min(pdf.numPages, PDF_MAX_PAGES);
  const steps = api()?.mode === "demo" ? [[1100, 0.72], [900, 0.6]] : [[1800, 0.85], [1500, 0.78], [1200, 0.7], [1000, 0.6]];
  const pages = [];
  for(let i = 1; i <= n; i++){
    const page = await pdf.getPage(i);
    const v1 = page.getViewport({scale:1});
    let url = "";
    for(const [w, q] of steps){
      const vp = page.getViewport({scale:w / Math.max(v1.width, v1.height * 0.75)});
      const c = document.createElement("canvas"); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
      // intent:"print" と ENABLE_STORAGE で、フォーム欄に入力された文字や注釈も画像に焼き込む
      await page.render({canvasContext:ctx, viewport:vp, intent:"print", annotationMode:pdfjsLib.AnnotationMode.ENABLE_STORAGE}).promise;
      url = c.toDataURL("image/jpeg", q);
      c.width = c.height = 0;
      if(url.length <= PDF_MAX_CHARS) break;
    }
    if(url.length > PDF_MAX_CHARS) throw new Error(`${i}ページ目が大きすぎて添付できません`);
    pages.push(url);
  }
  return pages;
}

}
function pdfViewHtml(a, note = ""){
  if(!a?.pages?.length) return "";
  if(a.src?.data && !a.url){ try { a.url = URL.createObjectURL(dataUrlToBlob(a.src.data)); } catch(e) {} }
  // ブラウザごとのPDF表示の差をなくすため、どの端末でも高解像度の画像で表示する
  const body = a.pages.map((u, i) => `<button type="button" class="zoom" data-act="zoom" data-doc="1" data-src="${esc(u)}" aria-label="${i+1}ページ目を拡大"><img src="${esc(u)}" alt="${i+1}ページ目" loading="lazy"></button>`).join("");

      <span class="row">${note ? `<span class="small">${esc(note)}</span>` : ""}${a.url ? `<a class="btn sub" href="${a.url}" target="_blank" rel="noopener">PDFを開く</a>` : ""}</span></div>
    ${body}</section>`;
}
async function extractPdfText(file, pdf){
  pdf = pdf || await openPdf(file);
  const out = [];
  for(let n = 1; n <= Math.min(pdf.numPages, 5); n++){
    const tc = await (await pdf.getPage(n)).getTextContent();
    const its = tc.items.filter(i => typeof i.str === "string" && i.str !== "").map(i => ({s:i.str, x:i.transform[4], y:i.transform[5], w:i.width || 0, h:Math.abs(i.height || i.transform[3]) || 10}));
    its.sort((a, b) => b.y - a.y || a.x - b.x);
    const lines = [];
    its.forEach(i => {
      const L = lines[lines.length - 1];
      if(L && Math.abs(L.y - i.y) <= Math.max(2, i.h * 0.45)) L.items.push(i); else lines.push({y:i.y, items:[i]});
    });
    lines.forEach(L => {
      L.items.sort((a, b) => a.x - b.x);
      let t = "", end = null;
      L.items.forEach(i => { if(end !== null && i.x - end > i.h * 0.6) t += " "; t += i.s; end = i.x + i.w; });
      out.push(t);
    });
    out.push("");
  }
  return out.join("\n");
}
function findDates(line){
  const now = new Date(), res = [];
  let l = line;
  const push = (y, m, d) => { if(m >= 1 && m <= 12 && d >= 1 && d <= 31) res.push(`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`); };
  l = l.replace(/令和\s*(\d+|元)\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日?/g, (_, y, m, d) => { push(2018 + (y === "元" ? 1 : +y), +m, +d); return " "; });
  l = l.replace(/(20\d{2})\s*[年\/.\-]\s*(\d{1,2})\s*[月\/.\-]\s*(\d{1,2})\s*日?/g, (_, y, m, d) => { push(+y, +m, +d); return " "; });
  l.replace(/(?<!\d)(\d{1,2})\s*月\s*(\d{1,2})\s*日/g, (_, m, d) => { push(+m < now.getMonth() - 1 ? now.getFullYear() + 1 : now.getFullYear(), +m, +d); return " "; });
  return res;
}
function parseJobText(raw){
  const lines = raw.normalize("NFKC").split("\n").map(l => l.replace(/[ \t　]+/g, " ").trim()).filter(Boolean);
  const all = lines.join("\n");
  const r = {items:[], trades:[]};
  const labeled = re => { for(const l of lines){ const m = l.match(re); if(m && m[1] && m[1].trim()) return m[1].trim(); } return ""; };
  const num = v => Number(String(v).replace(/[,¥\s]/g, "")) || 0;

  r.title = labeled(/(?:件名|工事名|案件名|工事件名|作業名称)\s*[:]?\s*(.+)/);
  r.manager = labeled(/管理会社(?:名)?\s*[:]?\s*(.+)/);
  r.keyInfo = labeled(/(?:鍵|キー|入室方法)(?:の受け渡し|情報)?\s*[:]\s*(.+)/);
  let building = labeled(/(?:物件名|建物名|マンション名)\s*[:]?\s*(.+)/);
  const room = labeled(/(?:号室|部屋番号|部屋)\s*[:]\s*(.+)/);

  // 住所：ラベル付きを優先、なければ最初に見つかった住所
  const PREF = /(東京都|神奈川県|埼玉県|千葉県)\s*([^\s\d]+?[市区町村])((?:[^\s\d]+?区)?)/;
  let addrLine = labeled(/(?:現場住所|物件住所|所在地|住所|現場)\s*[:]?\s*((?:東京都|神奈川県|埼玉県|千葉県).+)/) || (lines.find(l => PREF.test(l)) || "");
  if(addrLine){
    const m = addrLine.match(PREF);
    if(m){
      r.pref = m[1]; r.city = m[2] + m[3];
      let addr = addrLine.slice(addrLine.indexOf(m[0])).split(/\s*(?:TEL|電話|FAX)/i)[0].trim();
      const b = addr.match(/\s(\S*(?:マンション|ハイツ|コーポ|レジデンス|アパート|荘|ビル|テラス|メゾン|パレス|ハイム|コート|プラザ|タワー|ハウス)\S*(?:\s*\d+号?室?)?)$/) || addr.match(/\s(\S+\s*\d+号室)$/);
      if(b){ if(!building) building = b[1]; addr = addr.slice(0, b.index).trim(); }
      r.address = addr.replace(/\s+/g, "");
    }
  }
  r.building = [building, room && !building.includes(room) ? room : ""].filter(Boolean).join(" ");

  // 作業日：工期・作業日などの行から
  const dates = [];
  lines.forEach((l, k) => {
    if(/工期|作業日|施工日|着工|完工|作業予定|施工予定|日程|希望日|実施日|工事日/.test(l)){
      let d = findDates(l);
      if(!d.length && lines[k + 1]) d = findDates(lines[k + 1]);
      dates.push(...d);
    }
  });
  if(dates.length){ r.startDate = dates[0]; const e = dates[dates.length - 1]; r.endDate = e > dates[0] ? e : ""; }

  // 作業内訳：「作業名 数量 単位 単価 金額」の並びを拾う
  const UNIT = "式|m2|m|平米|枚|台|箇所|ヶ所|か所|カ所|ケ所|個|本|室|セット|組|日|人工|回|ヶ月|kg|L";
  const reA = new RegExp(`^(?:No\\.?\\s*)?(?:\\d{1,2}[.)]?\\s+)?(.*?[^\\d\\s,].*?)\\s+(\\d+(?:\\.\\d+)?)\\s*(${UNIT})\\s+¥?\\s*([\\d,]+)(?:\\s+¥?\\s*([\\d,]+))?`);
  const reB = /^(?:\d{1,2}[.)]?\s+)?(.*?[^\d\s,].*?)\s+(\d+(?:\.\d+)?)\s+¥?\s*([\d,]{3,})\s+¥?\s*([\d,]{3,})\s*$/;
  lines.forEach(l => {
    if(/合計|小計|消費税|税込|値引|総額|見積金額|請求金額|発注金額|振込|口座/.test(l)) return;
    let m = l.match(reA);
    if(m){ r.items.push({name:m[1].trim(), qty:+m[2], unit:m[3] === "m2" || m[3] === "平米" ? "㎡" : m[3], unitPrice:num(m[4])}); return; }
    m = l.match(reB);
    if(m) r.items.push({name:m[1].trim(), qty:+m[2], unit:"式", unitPrice:num(m[3])});
  });
  r.items = r.items.filter(i => i.unitPrice > 0 && i.name.length <= 60);

  // 金額と税区分
  const sub = labeled(/小計\s*[:]?\s*¥?\s*([\d,]{3,})/);
  const tot = labeled(/(?:合計金額|合計|総額|御見積金額|見積金額|発注金額|請負金額)\s*(?:\(税込\)|\(税抜\)|\(税別\))?\s*[:]?\s*¥?\s*([\d,]{3,})/);
  if(r.items.length){ r.price = itemsTotal(r.items); r.taxMode = "税別"; }
  else if(sub){ r.price = num(sub); r.taxMode = "税別"; }
  else if(tot){ r.price = num(tot); r.taxMode = /税込/.test(all) && !/税抜|税別/.test(all) ? "税込" : "税別"; }

  // 工種
  const T = [["エアコンクリーニング", /エアコン/], ["クロス張替え", /クロス|壁紙/], ["床（CF・フロアタイル）", /CF|クッションフロア|フロアタイル|フローリング/],
    ["塗装", /塗装/], ["設備交換", /交換|取替|取り替え|取付/], ["簡易修繕", /補修|修繕|修理|網戸/], ["退去立会", /立会/]];
  T.forEach(([t, re]) => { if(re.test(all)) r.trades.push(t); });
  if(/(ハウス|ルーム|室内|退去|美装)\s*クリーニング|清掃|美装/.test(all) || (/クリーニング/.test(all) && !r.trades.includes("エアコンクリーニング"))) r.trades.unshift("ハウスクリーニング");

  // 作業内容・備考
  const notes = [];
  lines.forEach(l => { const m = l.match(/^(?:作業内容|工事内容|備考|特記事項|注意事項|連絡事項)\s*[:]?\s*(.+)/); if(m) notes.push(m[1].trim()); });
  r.description = notes.length ? notes.join("\n") : r.items.length ? r.items.map(i => `・${i.name}`).join("\n") : "";
  if(!r.title && r.items.length) r.title = r.items[0].name + (r.items.length > 1 ? " ほか" : "");
  return r;
}
async function importPdf(input){
  const file = input.files[0]; if(!file) return;
  const form = input.closest("form"), box = form.querySelector("#pdf-result");
  box.innerHTML = `<p class="small">「${esc(file.name)}」を読み込んでいます…</p>`;
  try {
    const pdf = await openPdf(file);
    const src = await blobToDataURL(file);
    S.editPdf = {name:file.name, pages:await renderPdfPages(pdf), addedAt:Date.now()};
    S.editPdfSrc = src.length <= PDF_CHUNK * PDF_MAX_CHUNKS ? {name:file.name, data:src} : null; S.editPdfChanged = true;
    form.querySelector("#pdf-attach").innerHTML = pdfAttachHtml();
    if(!form.elements.title.value.trim()){ form.elements.title.value = file.name.replace(/\.pdf$/i, ""); form.elements.title.dataset.auto = "1"; }
    box.innerHTML = "";
  } finally { input.value = ""; }
}

function buildPaymentDoc(job, c, order, input){
  const base = Number(input.base) || 0, tax = Math.floor(base * TAX_RATE), total = base + tax, fee = Number(input.fee) || 0;
  return {
    id:`${job.id}_payment`, type:"payment", jobId:job.id, craftsmanId:c.uid, number:input.number || docNumber("PS", job.id),
    status:"draft", createdAt:Date.now(), issuedAt:null,
    to:{name:c.name || "", tradeName:c.tradeName || "", invoiceNumber:c.invoiceNumber || ""},
    job:{title:job.title || "", pref:job.pref || "", city:job.city || "", startDate:job.startDate || "", endDate:job.endDate || "", startedAt:job.startedAt || null, finishedAt:job.finishedAt || null},
    orderNumber:order?.number || "", amount:{base, tax, total}, fee, transferAmount:total - fee, transferDate:input.transferDate, note:input.note || "", company:{...COMPANY}
  };
}

function resizeImage(file, max = 1280, q = 0.75){
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error("画像を変換できませんでした")), "image/jpeg", q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error(`「${file.name}」を画像として読み込めませんでした`)); };
    img.src = url;
  });
}
const blobToDataURL = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });

class DemoBackend {
  constructor(){
    this.mode = "demo"; this.key = "refore_shokunin_demo_v8"; this.listeners = []; this.watchers = new Set();
    let raw = null;
    try { raw = localStorage.getItem(this.key); } catch(e) {}
    try { this.data = raw ? JSON.parse(raw) : seedDemo(); } catch(e) { this.data = seedDemo(); }
    // ログイン状態はタブごと（別タブで管理者と職人を同時に試せる）
    try { this.session = sessionStorage.getItem(this.key + "_session"); } catch(e) { this.session = null; }
    window.addEventListener("storage", e => { if(e.key !== this.key || !e.newValue) return; try { this.data = JSON.parse(e.newValue); this.fire(); } catch(err) {} });
    this.save();
  }
  save(){ try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch(e) {} this.fire(); }
  fire(){ clearTimeout(this._ft); this._ft = setTimeout(() => this.watchers.forEach(f => { try { f(); } catch(e) { console.error(e); } }), 0); }

    const drop = (k, f) => { for(const [key, v] of Object.entries(d[k] || {})) if(f(key, v)){ delete d[k][key]; total++; } };
    ids.forEach(id => { ["jobs","jobPrivate","jobPdf","jobPdfSrc"].forEach(k => { if(d[k]?.[id]){ delete d[k][id]; total++; } }); });

function authError(e){
  const m = {
    "auth/email-already-in-use":"このメールアドレスはすでに登録されています",
    "auth/invalid-email":"メールアドレスの形式が正しくありません",
    "auth/weak-password":"パスワードは6文字以上にしてください",

    "auth/network-request-failed":"通信できませんでした。電波の良い場所でお試しください"

  return new Error(m[e.code] || e.message);
}
class FirebaseBackend {

  // 案件PDF（募集中は承認済みの業者全員、発注後は発注先が見られる）
  // files/pdf に目次、files/page_000… に各ページの画像、files/src_000… に元のPDFを分割して保存
  async getJobPdf(id){
    let snap;
    try { snap = await this.col("jobs").doc(id).collection("files").get(); }
    catch(e) { if(e.code === "permission-denied") return null; throw e; }
    const docs = new Map(snap.docs.map(d => [d.id, d.data()]));
    const meta = docs.get("pdf");
    if(!meta) return null;
    if(meta.pages) return meta;   // 以前の形式
    const part = pre => [...docs.keys()].filter(k => k.startsWith(pre)).sort().map(k => docs.get(k).data);
    const pages = part("page_"), chunks = part("src_");
    return {name:meta.name, addedAt:meta.addedAt, pages, src:chunks.length === meta.srcChunks && chunks.length ? {name:meta.name, data:chunks.join("")} : null};
  }
  // 元のPDFファイル（発注書としてダウンロード。管理者と発注先だけ）
  async getJobPdfSource(id){

  async wipeJobData(progress){
    let total = 0, refs = [];

    const jobs = await this.col("jobs").get();
    let i = 0;
    for(const j of jobs.docs){
      progress?.(`案件を削除しています… ${++i} / ${jobs.size}`);
      for(const sub of ["files", "private"]){ const s = await j.ref.collection(sub).get(); s.docs.forEach(d => refs.push(d.ref)); }
      refs.push(j.ref);
      if(refs.length > 300){ total += refs.length; await flush(); }
    }
    total += refs.length; await flush();
    const threads = await this.col("threads").get();
    for(const t of threads.docs){
      const m = await t.ref.collection("messages").get(); m.docs.forEach(d => refs.push(d.ref)); refs.push(t.ref);
      if(refs.length > 300){ total += refs.length; await flush(); }
    }
    progress?.("連絡を削除しています…"); total += refs.length; await flush();
    for(const c of ["applications", "reports", "documents", "invoices"]){
      progress?.(`${{applications:"応募", reports:"完了報告", documents:"発注書", invoices:"請求書"}[c]}を削除しています…`);
      const s = await this.col(c).get(); s.docs.forEach(d => refs.push(d.ref)); total += refs.length; await flush();
    }
    progress?.("削除が完了しました");
    return {jobs:jobs.size, total};
  }
  // 選んだ案件だけ削除（応募・完了報告・発注書・連絡も一緒に。請求書は記録として残す）
  async deleteJobs(ids, progress){
    let total = 0, refs = [], i = 0;
    const flush = async () => { while(refs.length){ const b = this.db.batch(); const part = refs.splice(0, 400); part.forEach(r => b.delete(r)); await b.commit(); total += part.length; } };
    for(const id of ids){
      progress?.(`案件を削除しています… ${++i} / ${ids.length}`);
      const ref = this.col("jobs").doc(id);
      for(const sub of ["files", "private"]){ const s = await ref.collection(sub).get(); s.docs.forEach(d => refs.push(d.ref)); }
      for(const c of ["applications", "reports"]){ const s = await this.col(c).where("jobId", "==", id).get(); s.docs.forEach(d => refs.push(d.ref)); }
      for(const k of ["order", "payment"]){ const s = await this.col("documents").doc(`${id}_${k}`).get(); if(s.exists) refs.push(s.ref); }
      const th = await this.col("threads").where("jobId", "==", id).get();
      for(const t of th.docs){ const m = await t.ref.collection("messages").get(); m.docs.forEach(d => refs.push(d.ref)); refs.push(t.ref); }
      refs.push(ref);
      if(refs.length > 300) await flush();
    }
    await flush();
    progress?.("削除が完了しました");
    return {jobs:ids.length, total};
  }
  // 物件マスタ：master/props_000… に700件ずつまとめて保存（読み込み回数を抑えるため）
  async getProperties(){
    const s = await this.col("master").get();
    return s.docs.filter(d => d.id.startsWith("props_")).sort((a, b) => a.id.localeCompare(b.id)).flatMap(d => d.data().items || []);
  }
  async saveProperties(list){
    const size = 700, items = list.map(p => ({id:p.id, company:p.company || "", name:p.name || "", address:p.address || "", al:p.al || "", ev:p.ev || "", note:p.note || ""}));
    const n = Math.ceil(items.length / size), old = await this.col("master").get(), b = this.db.batch();
    for(let i = 0; i < n; i++) b.set(this.col("master").doc(`props_${String(i).padStart(3, "0")}`), {items:items.slice(i * size, (i + 1) * size), updatedAt:Date.now()});
    old.docs.forEach(d => { if(d.id.startsWith("props_") && Number(d.id.slice(6)) >= n) b.delete(d.ref); });
    await b.commit();
  }
  // --- 連絡（チャット）: threads/{案件ID_業者UID} と その下の messages ---
  async listThreads(f = {}){
    let q = this.col("threads");
    if(f.craftsmanId) q = q.where("craftsmanId", "==", f.craftsmanId);
    if(f.jobId) q = q.where("jobId", "==", f.jobId);
    return this.docs(await q.get());

    catch(e) { if(e.code === "permission-denied") return null; throw e; }
  }
  async ensureThread(t){
    const ref = this.col("threads").doc(t.id);
    let exists = false;
    try { exists = (await ref.get()).exists; } catch(e) { if(e.code !== "permission-denied") throw e; }
    if(!exists) await ref.set(t);
  }
  async sendMessage(tid, m){
    const t = this.col("threads").doc(tid), b = this.db.batch();
    b.set(t.collection("messages").doc(), m);
    b.update(t, {lastAt:m.createdAt, lastText:m.text.slice(0, 120), lastFrom:m.from, [m.from + "ReadAt"]:m.createdAt});
    await b.commit();
  }
  async markRead(tid, role){ await this.col("threads").doc(tid).update({[role + "ReadAt"]:Date.now()}); }
  watch(name, where, cb){
    let q = this.col(name);
    where.forEach(([f, op, v]) => { q = q.where(f, op, v); });
    return q.onSnapshot(s => cb(this.docs(s)), e => console.error("更新の受信に失敗：" + name, e));
  }
  watchThreads(f, cb){
    let q = this.col("threads");
    if(f.craftsmanId) q = q.where("craftsmanId", "==", f.craftsmanId);
    return q.onSnapshot(s => cb(this.docs(s)), e => console.error("連絡の受信に失敗", e));
  }
  watchMessages(tid, cb){
    return this.col("threads").doc(tid).collection("messages").orderBy("createdAt").onSnapshot(s => cb(this.docs(s)), e => console.error("メッセージの受信に失敗", e));
  }
  async updateInvoice(id, d){ await this.col("invoices").doc(id).update(d); }
  async listInvoices(f = {}){
    let q = this.col("invoices");
    if(f.month) q = q.where("month", "==", f.month);
    if(f.craftsmanId) q = q.where("craftsmanId", "==", f.craftsmanId);
    return this.docs(await q.get());
  }
  async setJobPdf(id, d, src){
    const j = this.col("jobs").doc(id), files = j.collection("files");
    const old = await files.get();
    for(const doc of old.docs) await doc.ref.delete();
    try { await j.collection("private").doc("pdfsrc").delete(); } catch(e) {}
    if(!d) return;
    const pad = i => String(i).padStart(3, "0");
    for(let i = 0; i < d.pages.length; i++) await files.doc(`page_${pad(i)}`).set({i, data:d.pages[i]});
    const chunks = [];
    if(src?.data) for(let i = 0; i < src.data.length; i += PDF_CHUNK) chunks.push(src.data.slice(i, i + PDF_CHUNK));
    for(let i = 0; i < chunks.length; i++) await files.doc(`src_${pad(i)}`).set({i, data:chunks[i]});
    await files.doc("pdf").set({name:d.name, addedAt:d.addedAt || Date.now(), pageCount:d.pages.length, srcChunks:chunks.length});
  }
  async setJobPrivate(id, d){ await this.col("jobs").doc(id).collection("private").doc("detail").set(d); }

  async listApplications(f = {}){
    let q = this.col("applications");
    if(f.jobId) q = q.where("jobId", "==", f.jobId);
    if(f.craftsmanId) q = q.where("craftsmanId", "==", f.craftsmanId);
    return this.docs(await q.get());
  }
  async apply(app){
    try { await this.col("applications").doc(app.id).set(app); }
    catch(e) { if(e.code === "permission-denied") throw new Error("応募できませんでした。募集が終了したか、すでに応募済みです"); throw e; }
  }
  async withdraw(id){ await this.col("applications").doc(id).update({status:"withdrawn", updatedAt:Date.now()}); }
  async assign(jobId, uid, order){
    const apps = await this.col("applications").where("jobId", "==", jobId).get();
    const b = this.db.batch();
    b.update(this.col("jobs").doc(jobId), {status:"assigned", assignedTo:uid, assignedAt:Date.now(), updatedAt:Date.now()});
    b.set(this.col("documents").doc(order.id), order);
    apps.forEach(s => { const a = s.data(); if(a.status === "applied") b.update(s.ref, {status:a.craftsmanId === uid ? "selected" : "rejected", updatedAt:Date.now()}); });
    await b.commit();
  }

  async listReports(f = {}){
    let q = this.col("reports");
    if(f.jobId) q = q.where("jobId", "==", f.jobId);
    if(f.craftsmanId) q = q.where("craftsmanId", "==", f.craftsmanId);
    return this.docs(await q.get());
  }
  async submitReport(d){ await this.col("reports").add({...d, status:"submitted", createdAt:Date.now()}); }
  async setReportStatus(id, status, comment){ await this.col("reports").doc(id).update({status, reviewComment:comment || "", reviewedAt:Date.now()}); }
  async addReportPhotos(id, a){
    const F = firebase.firestore.FieldValue;
    await this.col("reports").doc(id).update({additions:F.arrayUnion(a), photoCount:F.increment(a.count)});
  }

  // 写真は圧縮して案件ドキュメントに直接保存（Storage・従量課金プラン不要）
  async uploadPhotos(files){
    const out = [];
    for(const f of files) out.push(await blobToDataURL(await resizeImage(f, 800, 0.65)));
    return out;
  }
}

function workDays(j){
  const ps = j.plannedStart || j.startDate, pe = j.plannedEnd || j.endDate || ps;
  const days = ps && pe && pe >= ps ? Math.round((new Date(pe + "T00:00:00") - new Date(ps + "T00:00:00")) / 86400000) : 0;
  if(j.startedAt){
    const s = isoOf(j.startedAt), d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + days);
    return {start:s, end:isoOf(d.getTime()), actual:true, ps, pe, days};
  }
  return {start:j.startDate, end:j.endDate && j.endDate >= j.startDate ? j.endDate : j.startDate, actual:false, ps, pe, days};
}

function progressTrack(job, reports = []){
  const rep = reports.filter(r => r.jobId === job.id && r.status !== "returned").sort((a, b) => b.createdAt - a.createdAt)[0];
  let stage = STAGE[job.status] ?? -1;
  if(stage === 3 && rep) stage = 4;
  const times = STEPS.map(([, k], i) => k ? job[k] : rep?.createdAt);
  if(!times[0]) times[0] = job.createdAt;
  return `<section class="panel"><h2>進捗</h2><ol class="track">${STEPS.map(([l], i) => {
    const cls = i <= stage ? "done" : i === stage + 1 ? "next" : "";
    const tm = i <= stage ? (fmtFull(times[i]) || "済") : i === stage + 1 ? "次はここ" : "";
    return `<li class="${cls}"><span class="dot" aria-hidden="true"></span><span class="lbl">${l}</span><span class="tm">${tm}</span></li>`;
  }).join("")}</ol></section>`;
}

  const stage = STAGE[job.status] ?? -1;

function rpProgress(done, total, msg){
  const box = $("#rp-progress"); if(!box) return;
  box.hidden = false;
  box.querySelector("i").style.width = (total ? Math.round(done / total * 100) : 0) + "%";
  box.querySelector("p").textContent = msg || `写真を送っています… ${done} / ${total}枚（画面を閉じないでください）`;
}
async function uploadReportPhotos(jobId, files, label){
  const pad = n => String(n).padStart(3, "0"), stamp = todayIso().replace(/-/g, "");
  let done = 0, folderUrl = "", next = 0;
  const failed = [], base = S.reportSentBase || 0;
  rpProgress(0, files.length);
  const work = async () => {
    while(next < files.length){
      const i = next++, file = files[i];
      let ok = false, lastErr;
      for(let t = 0; t < 3 && !ok; t++){
        try {
          const blob = await resizeImage(file, PHOTO_PX, PHOTO_Q);
          const data = (await blobToDataURL(blob)).split(",")[1];
          const r = await api().uploadReportPhoto({idToken:await api().getIdToken(), jobId, folderLabel:label, fileName:`${stamp}_${pad(base + i + 1)}.jpg`, mime:"image/jpeg", data});
          folderUrl = r.folderUrl || folderUrl; ok = true;
        } catch(e) { lastErr = e; await new Promise(r => setTimeout(r, 800 * (t + 1))); }
      }
      if(ok) done++; else failed.push({file, err:lastErr});
      rpProgress(done, files.length);
    }
  };
  await Promise.all(Array.from({length:Math.min(PHOTO_PARALLEL, files.length)}, work));
  return {done, failed, folderUrl};
}

  const segs = [["open","募集中"],["active","進行中"],["unpaid","支払待ち"],["paid","支払済み"],["other","下書き・締切"],["all","すべて"]];
  const inSeg = (j, k) => k === "all" || ADMIN_GROUPS[k].includes(j.status);
  const list = jobs.filter(j => inSeg(j, sf));
  const posted = j => j.publishedAt || j.createdAt;
  const card = j => {
    const c = S.crafts.get(j.assignedTo);
    const before = ["draft","open","closed"].includes(j.status);
    const foot = before
      ? `<p class="foot">応募 <span class="count">${cnt[j.id] || 0}</span> 件　${j.status === "draft" ? "作成" : "掲載"} ${fmtTime(posted(j))}</p>`
      : `<p class="foot">${progressMini(j)}${esc(JOB_STATUS[j.status])}${c ? `　${esc(c.name)}` : ""}</p>`;
    return jobCard(j, {href:`#/admin/job/${j.id}`, foot, showPrice:true, stampHtml:statusStamp(j)});
  };
  let body;
  if(!list.length){
    body = `<div class="empty">この状態の案件はありません。${sf === "open" ? `<br><a href="#/admin/new">新しい案件を作る</a>` : ""}</div>`;
  } else if(sf === "open"){
    // 募集中は時系列：作業日の近い順（または掲載の新しい順）に日付ごとにまとめる
    const byPosted = S.adminSort === "posted";
    const sorted = [...list].sort(byPosted ? (a, b) => posted(b) - posted(a)
      : (a, b) => (a.startDate || "9").localeCompare(b.startDate || "9") || posted(a) - posted(b));
    const groups = [];
    sorted.forEach(j => {
      const k = byPosted ? isoOf(posted(j)) : (j.startDate || "");
      const g = groups[groups.length - 1];
      if(g && g[0] === k) g[1].push(j); else groups.push([k, [j]]);
    });
    body = `<div class="filters"><select data-adminsort aria-label="並び順">
        <option value="work" ${!byPosted ? "selected" : ""}>作業日が近い順</option>

      + groups.map(([k, js]) => `<h2 class="day-head"><b>${k ? fmtDay(k) : "日程未定"}</b>${byPosted ? "に掲載" : "の作業"}　${js.length}件</h2>
        <div class="list grid">${js.map(card).join("")}</div>`).join("");
  } else {
    body = `<div class="list grid">${list.sort((a, b) => (a.startDate || "9").localeCompare(b.startDate || "9")).map(card).join("")}</div>`;
  }
  return `<div class="page-head"><div><h1>案件</h1><p class="lead">案件の作成、発注、進捗の確認を行います。</p></div><a class="btn" href="#/admin/new">新しい案件を作る</a></div>

    ${body}`;
}

const PROP_KEYS = new WeakMap();
const normKey = v => String(v || "").normalize("NFKC").toLowerCase()
  .replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60))
  .replace(/[\s・\-‐－ー_.,、。()（）「」〜~]/g, "");
function propKey(p){ let k = PROP_KEYS.get(p); if(!k){ k = {n:normKey(p.name), a:normKey(p.address), c:normKey(p.company)}; PROP_KEYS.set(p, k); } return k; }
function searchProps(q, list, limit = 8, company = ""){
  const k = normKey(q), res = [];
  for(const p of list || []){
    if(company && p.company !== company) continue;
    if(!k){ res.push([3, p]); continue; }
    const pk = propKey(p);
    const sc = pk.n.startsWith(k) ? 0 : pk.n.includes(k) ? 1 : pk.a.includes(k) ? 2 : pk.c.includes(k) ? 2.5 : -1;
    if(sc >= 0) res.push([sc, p]);
  }
  res.sort((a, b) => a[0] - b[0] || a[1].name.length - b[1].name.length || a[1].name.localeCompare(b[1].name, "ja"));
  return (limit ? res.slice(0, limit) : res).map(x => x[1]);
}
function splitAddress(addr){
  const m = String(addr || "").normalize("NFKC").replace(/\s/g, "").match(/^(東京都|北海道|(?:京都|大阪)府|.{2,3}?県)(.{1,6}?市.{1,4}?区|.{1,6}?[市区町村]|.{1,5}?郡.{1,5}?[町村])/);
  return m ? {pref:m[1], city:m[2]} : {pref:"", city:""};
}
const highlight = (text, q) => {
  const t = String(text || ""); const k = String(q || "").trim();
  if(!k) return esc(t);
  const i = t.normalize("NFKC").toLowerCase().indexOf(k.normalize("NFKC").toLowerCase());
  return i < 0 ? esc(t) : esc(t.slice(0, i)) + "<mark>" + esc(t.slice(i, i + k.length)) + "</mark>" + esc(t.slice(i + k.length));
};

// --- CSV ---
function parseCsv(text){
  const rows = []; let row = [], cell = "", q = false;
  text = text.replace(/^﻿/, "");
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if(c === '"') q = true;
    else if(c === ","){ row.push(cell); cell = ""; }
    else if(c === "\n" || c === "\r"){ if(c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if(cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
async function readCsvFile(file){
  const buf = await file.arrayBuffer();
  let t = new TextDecoder("utf-8").decode(buf);
  if((t.match(/�/g) || []).length > 3){ try { t = new TextDecoder("shift_jis").decode(buf); } catch(e) {} }
  return parseCsv(t);
}
function csvToProps(rows){
  const head = rows[0].map(h => normKey(h));
  const col = names => head.findIndex(h => names.some(n => h === normKey(n) || h.includes(normKey(n))));
  const ix = {company:col(["管理会社"]), name:col(["物件名称", "物件名"]), address:col(["所在地", "住所"]), al:col(["オートロック", "AL"]), ev:col(["エレベーター", "EV"]), note:col(["備考"])};
  if(ix.name < 0) throw new Error("CSVに「物件名」の列が見つかりません（1行目に見出しが必要です）");
  const clean = v => String(v || "").replace(/[　\s]+/g, " ").trim();
  return rows.slice(1).map(r => ({id:newId(), company:clean(r[ix.company]), name:clean(r[ix.name]), address:clean(r[ix.address]),
    al:clean(r[ix.al]), ev:clean(r[ix.ev]), note:clean(r[ix.note])})).filter(p => p.name);
}
const propIdKey = p => `${p.company}|${normKey(p.name)}|${normKey(p.address)}`;
function csvCell(v){ v = String(v ?? ""); return /[",\n\r]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; }

    (d.invoices || []).sort((a, b) => a.issuedAt - b.issuedAt).forEach(v => add("invoices", `#/admin/invoices/${v.month}`, `${v.from?.name || "業者"}　${fmtMonth(v.month)}分 ${yenFull(v.total)}`, "支払待ち", "orange"));
  } else {
    const appliedIds = new Set((d.myApps || []).map(a => a.jobId));
    (d.open || []).filter(j => (j.publishedAt || j.createdAt || 0) > seenJobs && !appliedIds.has(j.id))
      .forEach(j => add("jobs", `#/job/${j.id}`, j.title, "新着の募集", "blue"));
    (d.myApps || []).filter(a => (a.status === "selected" || a.status === "rejected") && (a.updatedAt || 0) > seenApplied)
      .forEach(a => add("applied", a.status === "selected" ? `#/work/${a.jobId}` : `#/job/${a.jobId}`, a.jobTitle, a.status === "selected" ? "採用されました" : "見送りになりました", a.status === "selected" ? "green" : "gray"));
    const reported = new Set((d.myReports || []).filter(r => r.status !== "returned").map(r => r.jobId));
    const returned = new Set((d.myReports || []).filter(r => r.status === "returned").map(r => r.jobId));
    (d.mine || []).forEach(j => {
      if(j.status === "assigned") add("work", `#/work/${j.id}`, j.title, `作業開始を押してください（${fmtDay(workDays(j).start)}〜）`, "blue", "作業開始待ち");
      else if(j.status === "working") add("work", `#/work/${j.id}`, j.title, "作業完了を押してください", "blue");
      else if(j.status === "finished" && !reported.has(j.id)) add("work", `#/work/${j.id}`, j.title, returned.has(j.id) ? "差し戻し・完了報告をやり直してください" : "完了報告をしてください", "orange");
    });
  }
  return out;
}
function computeBadges(){

// いま開いているタブの「お知らせ」：何についての通知かを一覧と目印で示す
function currentNoticeKey(){
  const h = location.hash || "#/";
  if(S.profile?.role === "admin"){
    if(/^#\/admin\/?$/.test(h) || h.startsWith("#/admin/list")) return "jobs";
    if(h.startsWith("#/admin/invoices")) return "invoices";
    return "";
  }
  const t = h.replace(/^#\/?/, "").split("/")[0] || "jobs";
  return ["jobs", "applied", "work"].includes(t) && !h.match(/^#\/(job|work)\/./) ? t : "";
}
function decorateNotices(){
  const main = $(".main"); if(!main) return;
  main.querySelectorAll(".notice-box, .flags").forEach(el => el.remove());
  const k = currentNoticeKey(); if(!k) return;
  // 新着・結果は「このタブを開く前に未読だったもの」を表示する
  const items = (k === "jobs" || k === "applied") && S.profile?.role !== "admin"
    ? (buildNotices(S.viewSeen?.jobs ?? getSeen("jobs"), S.viewSeen?.applied ?? getSeen("applied"))[k] || [])
    : (S.notices?.[k] || []);
  if(!items.length) return;
  const flag = r => `<span class="flag ${r.tone}">${esc(r.t)}</span>`;
  const box = document.createElement("section");
  box.className = "notice-box"; box.setAttribute("aria-label", "お知らせ");
  box.innerHTML = `<h2>お知らせ <span class="badge">${items.length}</span></h2><ul>${items.map(it => `<li><a href="${it.href}"><b>${esc(it.title)}</b><span class="flags-in">${it.reasons.map(flag).join("")}</span></a></li>`).join("")}</ul>`;
  const head = main.querySelector(".page-head") || main.querySelector(".lead") || main.querySelector("h1");
  if(head) head.after(box); else main.prepend(box);

}

}

/* ---------- 管理：予定表 ---------- */
const dayDiff = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return isoOf(d.getTime()); };
const CAL_CLASS = {open:"c-open", closed:"c-closed", assigned:"c-work", working:"c-work", finished:"c-done", completed:"c-done", paid:"c-done"};
async function viewCalendar(ym, company = ""){
  const now = new Date();
  let [y, m] = String(ym || "").split("-").map(Number);
  if(!y || !m){ y = now.getFullYear(); m = now.getMonth() + 1; }
  const [jobs, apps] = await Promise.all([api().listJobs({}), api().listApplications({})]);
  const cnt = {}; apps.forEach(a => { if(a.status === "applied") cnt[a.jobId] = (cnt[a.jobId] || 0) + 1; });
  const first = isoOf(new Date(y, m - 1, 1).getTime()), last = isoOf(new Date(y, m, 0).getTime());
  const gridStart = addDays(first, -new Date(y, m - 1, 1).getDay());
  const gridEnd = addDays(last, 6 - new Date(y, m, 0).getDay());
  // 表示中の月にかかる案件だけ、管理会社（現場情報）を読み込む
  const shown = jobs.filter(j => j.status !== "draft" && j.startDate).map(j => { const w = workDays(j); return {...j, startDate:w.start, endDate:w.end, _w:w}; })
    .filter(j => j.startDate <= gridEnd && j.endDate >= gridStart);
  const privs = await Promise.all(shown.map(j => api().getJobPrivate(j.id).catch(() => ({}))));
  shown.forEach((j, i) => { j.manager = String(privs[i]?.manager || "").trim(); });
  const NONE = "未設定";
  const coOf = j => j.manager || NONE;
  const masterCos = [...new Set((S.props?.length ? S.props : await api().getProperties().catch(() => [])).map(p => p.company).filter(Boolean))];
  const monthJobs = shown.filter(j => j.startDate <= last && j.endDate >= first);
  const counts = {}; monthJobs.forEach(j => { counts[coOf(j)] = (counts[coOf(j)] || 0) + 1; });
  const cos = [...new Set([...masterCos, ...shown.map(coOf)])].filter(c => c !== NONE).sort((a, b) => (counts[b] || 0) - (counts[a] || 0) || a.localeCompare(b, "ja"));
  if(counts[NONE]) cos.push(NONE);
  if(company && !cos.includes(company)) cos.unshift(company);
  const list = company ? shown.filter(j => coOf(j) === company) : shown;
  S.cal = {jobs:new Map(list.map(j => [j.id, j])), cnt};
  const calUrl = (ymv, co = company) => `#/admin/calendar/${ymv}${co ? "/" + encodeURIComponent(co) : ""}`;
  const today = todayIso(), mm = `${y}-${String(m).padStart(2, "0")}`;
  let weeks = "";
  for(let ws = gridStart; ws <= gridEnd; ws = addDays(ws, 7)){
    const we = addDays(ws, 6);
    const evs = list.filter(j => j.startDate <= we && j.endDate >= ws)
      .sort((a, b) => a.startDate.localeCompare(b.startDate) || dayDiff(b.startDate, b.endDate) - dayDiff(a.startDate, a.endDate));
    const lanes = [];
    const bars = evs.map(j => {
      const cs = Math.max(0, dayDiff(ws, j.startDate)) + 1, ce = Math.min(6, dayDiff(ws, j.endDate)) + 1;
      let lane = lanes.findIndex(end => end < cs); if(lane < 0){ lane = lanes.length; lanes.push(0); } lanes[lane] = ce;
      const isS = j.startDate >= ws, isE = j.endDate <= we;
      const who = S.crafts.get(j.assignedTo);
      return `<button type="button" class="cal-bar ${CAL_CLASS[j.status] || ""}${isS ? " s" : ""}${isE ? " e" : ""}" style="grid-column:${cs}/${ce + 1};grid-row:${lane + 2}"
        data-act="cal-job" data-id="${esc(j.id)}" title="${esc(j.title)}（${esc(fmtRange(j.startDate, j.endDate))}）${who ? " " + esc(who.name) : ""}">${isS ? "" : "◀ "}${esc(j.title)}${isE ? "" : " ▶"}</button>`;
    }).join("");
    let bg = "", nums = "";
    for(let i = 0; i < 7; i++){
      const d = addDays(ws, i), other = d.slice(0, 7) !== mm;
      bg += `<div class="${other ? "other" : ""}"></div>`;
      nums += `<div class="cal-num${d === today ? " today" : ""}${i === 0 ? " sun" : i === 6 ? " sat" : ""}${other ? " other" : ""}" style="grid-column:${i + 1}"><span>${Number(d.slice(8))}</span></div>`;
    }
    weeks += `<div class="cal-week"><div class="cal-bg">${bg}</div><div class="cal-fg">${nums}${bars}</div></div>`;
  }
  const prev = isoOf(new Date(y, m - 2, 1).getTime()).slice(0, 7), next = isoOf(new Date(y, m, 1).getTime()).slice(0, 7);
  const inMonth = list.filter(j => j.startDate <= last && j.endDate >= first).sort((a, b) => a.startDate.localeCompare(b.startDate));
  const tabs = `<nav class="seg cal-tabs" aria-label="管理会社で切り替え">
    <a href="${calUrl(mm, "")}" ${!company ? 'aria-current="true"' : ""}>全体（${monthJobs.length}）</a>
    ${cos.map(c => `<a href="${calUrl(mm, c)}" ${company === c ? 'aria-current="true"' : ""}>${esc(c)}（${counts[c] || 0}）</a>`).join("")}</nav>`;
  const rows = inMonth.map(j => {
    const who = S.crafts.get(j.assignedTo);
    return `<a class="row-item" href="#/admin/job/${esc(j.id)}"><span class="row-main"><b>${esc(j.title)}</b>
      <span class="small">開始 ${fmtDay(j.startDate)}　終了 ${fmtDay(j.endDate)}　${esc(j.pref)}${esc(j.city)}${!company ? `　${esc(coOf(j))}` : ""}</span>
      <span class="small">${who ? `受注業者：${esc(who.name)}${who.tradeName ? `（${esc(who.tradeName)}）` : ""}` : `未発注　応募 ${cnt[j.id] || 0}件`}</span></span>
      <span class="pill ${j.status}">${JOB_STATUS[j.status]}</span></a>`;
  }).join("");
  return `<div class="page-head"><div><h1>予定表${company ? `<small class="cal-co">${esc(company)}</small>` : ""}</h1><p class="lead">案件の工期をカレンダーで確認できます。上のタブで全体と管理会社ごとを切り替えられます。案件名を押すと受注業者が表示されます。</p></div></div>
    ${tabs}
    <div class="cal-tool"><a class="btn sub" href="${calUrl(prev)}" aria-label="前の月">‹</a><h2>${y}年${m}月</h2><a class="btn sub" href="${calUrl(next)}" aria-label="次の月">›</a>
      ${mm !== today.slice(0, 7) ? `<a class="textlink" href="${calUrl(today.slice(0, 7))}">今月へ</a>` : ""}</div>
    <div class="cal-legend"><span class="cal-bar c-open s e">募集中</span><span class="cal-bar c-closed s e">締切</span><span class="cal-bar c-work s e">発注済み・作業中</span><span class="cal-bar c-done s e">作業完了以降</span></div>
    <div class="cal" role="grid" aria-label="${y}年${m}月の予定"><div class="cal-head">${"日月火水木金土".split("").map((d, i) => `<div class="${i === 0 ? "sun" : i === 6 ? "sat" : ""}">${d}</div>`).join("")}</div>${weeks}</div>
    <h2 class="day-head"><b>${m}月の案件${company ? `（${esc(company)}）` : ""}</b>${inMonth.length}件</h2>
    ${rows ? `<div class="list">${rows}</div>` : `<div class="empty">この月に工期がかかる案件はありません。</div>`}`;
}

async function downloadPdf(html, filename){
  if(!window.html2pdf) await loadScript(HTML2PDF_URL);
  try { await document.fonts?.ready; } catch(e) {}
  const holder = document.createElement("div");
  holder.style.cssText = "position:absolute;left:-12000px;top:0;width:794px";
  holder.innerHTML = `<style>${PDF_CSS}</style>${html}`;
  document.body.appendChild(holder);
  try {
    await window.html2pdf().set({
      margin:0, filename, image:{type:"jpeg", quality:0.95},
      html2canvas:{scale:2, backgroundColor:"#ffffff", useCORS:true, scrollX:0, scrollY:0},
      jsPDF:{unit:"mm", format:"a4", orientation:"portrait"}
    }).from(holder.querySelector(".pdfdoc")).save();
  } finally { holder.remove(); }
}

/* ---------- ルーティング ---------- */
function go(hash){ if(location.hash === hash) route(); else location.hash = hash; }
async function route(){
  const token = ++S.tok;
  const hash = location.hash || "#/";
  const parts = hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
  const moved = hash !== S.lastHash; S.lastHash = hash;
  if(S.pageUnsub){ S.pageUnsub(); S.pageUnsub = null; }
  let after = null;
  const done = (html, opts) => { if(token !== S.tok) return; paint(html, opts); if(moved) window.scrollTo(0, 0); if(after) S.pageUnsub = after(); decorateNotices(); };
  if(!api()) return;
  try {
    if(!S.user) return done(parts[0] === "signup" ? viewSignup() : viewLogin(), {bare:true});
    if(!S.profile) return done(viewProfileForm(null, true), {bare:true});
    const p = S.profile;
    startNotifier(); startBadges();
    if(p.role !== "admin"){
      const t = parts[0] || "jobs";
      S.viewSeen ||= {};
      if((t === "jobs" || t === "applied") && S.lastTab !== t){ S.viewSeen[t] = getSeen(t); setSeen(t); }
      if(t === "job" && S.lastTab !== "jobs" && S.lastTab !== "job"){ setSeen("jobs"); }
      S.lastTab = t; computeBadges();
    }
    if(p.role === "admin"){
      if(parts[0] !== "admin"){ location.replace("#/admin"); return; }
      const crafts = await api().listCraftsmen();
      S.crafts = new Map(crafts.map(c => [c.uid, c]));
      S.pending = crafts.filter(c => c.status === "pending").length;
      const [, a, b, c] = parts;
      let html;
      if(!a || a === "list") html = await viewAdminJobs(b || "open");
      else if(a === "new") html = await viewJobEdit(null);
      else if(a === "job" && c === "edit") html = await viewJobEdit(b);
      else if(a === "job") html = await viewAdminJob(b);
      else if(a === "craftsmen") html = await viewCraftsmen();
      else if(a === "calendar") html = await viewCalendar(b, parts[3] || "");
      else if(a === "invoices") html = await viewAdminInvoices(b);
      else if(a === "chat"){ if(b){ html = await viewChat(b); after = () => startChat(b); } else html = await viewChatList(); }
      else if(a === "settings"){ html = await viewSettings(); after = () => { renderPropList(); renderDelList(); return null; }; }
      else if(a === "craftsman") html = await viewCraftsman(b);
      else { location.replace("#/admin"); return; }
      return done(html);
    }
    if(p.status === "suspended") return done(viewSuspended());
    if(p.status !== "approved") return done(viewPending());
    const [a, b] = parts;
    let html;
    if(a === "job") html = await viewJobDetail(b);
    else if(a === "applied") html = await viewApplied();
    else if(a === "work") html = b ? await viewWorkDetail(b) : await viewWork();
    else if(a === "profile") html = viewProfileForm(p, false);
    else if(a === "invoice") html = await viewInvoice(b);
    else if(a === "chat"){ if(b){ html = await viewChat(b); after = () => startChat(b); } else html = await viewChatList(); }
    else if(!a || a === "jobs") html = await viewJobs();
    else { location.replace("#/jobs"); return; }
    done(html);
  } catch(err) {
    console.error(err);
    done(`<div class="empty">読み込めませんでした（${esc(err.message || err)}）<br><br><button class="btn sub" data-act="reload">もう一度読み込む</button></div>`);
  }
}

/* ---------- モーダル・通知 ---------- */
let toastTimer;
function toast(msg){
  let t = $(".toast");
  if(!t){ t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3400);
}
function ask({title, body = "", ok = "OK", danger = false, input = null, placeholder = ""}){
  return new Promise(res => {
    const bg = document.createElement("div"); bg.className = "modal-bg";
    const field = input === "textarea" ? `<textarea class="m-in" placeholder="${esc(placeholder)}"></textarea>`
      : input ? `<input class="m-in" type="${input}" placeholder="${esc(placeholder)}">` : "";
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title"><h2 id="m-title">${esc(title)}</h2>${body ? `<p style="white-space:pre-line">${esc(body)}</p>` : ""}${field}
      <div class="row end"><button type="button" class="btn sub m-no">キャンセル</button><button type="button" class="btn${danger ? " danger" : ""} m-ok">${esc(ok)}</button></div></div>`;
    const close = v => { bg.remove(); document.removeEventListener("keydown", key); res(v); };
    const key = e => { if(e.key === "Escape") close(false); };
    bg.querySelector(".m-no").onclick = () => close(false);
    bg.querySelector(".m-ok").onclick = () => close(input ? bg.querySelector(".m-in").value : true);
    bg.addEventListener("click", e => { if(e.target === bg) close(false); });
    document.addEventListener("keydown", key);
    document.body.appendChild(bg);
    (bg.querySelector(".m-in") || bg.querySelector(".m-ok")).focus();
  });
}
function lightbox(src, doc){
  const bg = document.createElement("div"); bg.className = "modal-bg lightbox" + (doc ? " doc" : "");
  bg.innerHTML = `<img src="${esc(src)}" alt="拡大した画像">`;
  const close = () => { bg.remove(); document.removeEventListener("keydown", key); };
  const key = e => { if(e.key === "Escape") close(); };
  bg.addEventListener("click", close); document.addEventListener("keydown", key);
  document.body.appendChild(bg);
}

    for(let i = 0; i < view.pages.length; i++){
      const img = new Image(); img.src = view.pages[i]; await img.decode();
      const w = 210, h = w * img.height / img.width;
      if(i) doc.addPage([w, h]); else if(Math.abs(h - 297) > 1){ doc.deletePage(1); doc.addPage([w, h]); }
      doc.addImage(view.pages[i], "JPEG", 0, 0, w, h);
    }
    doc.save(`${base}.pdf`);

      const job = await api().getJob(id);

      S.uploading = true;
      let res;
      try { res = await uploadReportPhotos(id, files, label); } finally { S.uploading = false; }
      S.reportSent = (S.reportSent || 0) + res.done; S.reportSentBase = (S.reportSentBase || 0) + files.length;
      if(res.folderUrl) S.reportFolder = res.folderUrl;
      if(res.failed.length){
        S.reportFiles = res.failed.map(f => f.file); renderReportPicks();
        rpProgress(res.done, files.length, `${res.done}枚を送りました。${res.failed.length}枚は送れませんでした（${res.failed[0].err?.message || "通信エラー"}）。電波の良い場所で、もう一度ボタンを押してください。送れた写真はそのまま残ります。`);
        return;
      }
      const sent = S.reportSent;
      S.reportFiles = []; S.reportSent = 0; S.reportSentBase = 0;
      if(add){
        const note = form.elements.note?.value.trim() || "";
        if(form.dataset.report) await api().addReportPhotos(form.dataset.report, {at:Date.now(), count:sent, note});
        const tid = `${id}_${S.user.uid}`;
        try {
          await api().ensureThread({id:tid, jobId:id, craftsmanId:S.user.uid, craftsmanName:S.profile.name || "", jobTitle:job?.title || "", createdAt:Date.now(), lastAt:0, lastText:"", lastFrom:"", adminReadAt:0, craftsmanReadAt:0});
          await api().sendMessage(tid, {from:"craftsman", uid:S.user.uid, name:S.profile.name || "", text:`完了報告の写真を${sent}枚、追加で送りました。${note ? "\n" + note : ""}`, createdAt:Date.now()});
        } catch(e) { console.error(e); }
        notifyMail(id, "完了報告の写真が追加されました", `追加の写真：${sent}枚${note ? "\nコメント：" + note : ""}`);
        toast(`写真を${sent}枚、追加で送りました`); route(); return;
      }
      await api().submitReport({jobId:id, jobTitle:job?.title || "", craftsmanId:S.user.uid, craftsmanName:S.profile.name, method:"photos",
        photoCount:sent, folderUrl:S.reportFolder || "", note:form.elements.note?.value.trim() || ""});
      S.reportFolder = "";
      notifyMail(id, "完了報告が届きました", `写真：${sent}枚${form.elements.note?.value.trim() ? "\nコメント：" + form.elements.note.value.trim() : ""}`);
      toast(`写真${sent}枚を送り、完了報告しました`); route(); return;
    }
    if(!await ask({title:"報告メールは送りましたか？", body:`写真を添付したメールを ${REPORT_EMAIL} に送ってから「報告済み」にしてください。`, ok:"送ったので報告済みにする"})) return;
    const job = await api().getJob(id);
    await api().submitReport({jobId:id, jobTitle:job?.title || "", craftsmanId:S.user.uid, craftsmanName:S.profile.name, method:"email"});
    notifyMail(id, "完了報告が届きました（メール）", `写真と報告内容は ${REPORT_EMAIL} にメールで送られています。`);
    toast("報告済みにしました"); route();
  }
};

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if(!el || !ACTIONS[el.dataset.act]) return;
  e.preventDefault();
  if(el.disabled) return;
  el.disabled = true;
  try { await ACTIONS[el.dataset.act](el); }
  catch(err) { console.error(err); toast(err.message || String(err)); }
  finally { el.disabled = false; }
});
document.addEventListener("submit", async e => {
  const form = e.target.closest("form[data-form]");
  if(!form || !FORMS[form.dataset.form]) return;
  e.preventDefault();
  const btns = [...form.querySelectorAll("button")];
  btns.forEach(b => b.disabled = true);
  try { await FORMS[form.dataset.form](form, e); }
  catch(err) { console.error(err); toast(err.message || String(err)); }
  finally { btns.forEach(b => b.disabled = false); }
});
document.addEventListener("keydown", e => {
  if(e.target.matches?.("[data-propsearch]")){
    const box = $("#prop-ac");
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){ if(box?.hidden) renderPropAc(e.target); e.preventDefault(); moveAc(e.target, e.key === "ArrowDown" ? 1 : -1); return; }
    if(e.key === "Enter" && box && !box.hidden && S.acIdx >= 0){ e.preventDefault(); applyProp(e.target.form, S.acHits[S.acIdx]); return; }
    if(e.key === "Escape"){ hideAc(); return; }
  }
  if(e.key === "Enter" && (e.ctrlKey || e.metaKey) && e.target.closest("form[data-form=chat]")){ e.preventDefault(); e.target.form.requestSubmit(); }
});
document.addEventListener("mousedown", e => {
  const it = e.target.closest?.("#prop-ac .ac-item");
  if(it){ e.preventDefault(); applyProp(it.closest("form"), S.acHits[Number(it.dataset.i)]); return; }
  if(!e.target.closest?.(".ac-wrap")) hideAc();
});
document.addEventListener("focusout", e => { if(e.target.matches?.("[data-propsearch]")) setTimeout(hideAc, 150); });
document.addEventListener("input", e => {
  if(e.target.matches?.("[data-propsearch]")){
    renderPropAc(e.target);
    const f = e.target.form; f.elements.masterId.value = ""; const hit = $("#prop-hit"); if(hit) hit.hidden = true;
    autoTitle(f);
  }
  if(e.target.matches?.("form[data-form=job] [name=room]")) autoTitle(e.target.form);
  if(e.target.matches?.("form[data-form=job] [name=title]")) e.target.dataset.auto = "";
  if(e.target.matches?.("[data-delfilter=q]")){ S.delFilter.q = e.target.value; renderDelList(); }
  if(e.target.matches?.("[data-propfilter=q]")){ S.propFilter.q = e.target.value; renderPropList(); } if(e.target.closest(".item-row")) syncItems(e.target.form);  });
document.addEventListener("change", e => {
  if(e.target.matches("[data-pdfimport]")){
    importPdf(e.target).catch(err => { console.error(err); toast("PDFを読み込めませんでした（" + (err.message || err) + "）"); const b = $("#pdf-result"); if(b) b.innerHTML = ""; });
    return;
  }
  if(e.target.matches("[data-reportphotos]")){
    const seen = new Set(S.reportFiles.map(f => f.name + f.size));
    [...e.target.files].forEach(f => { if(f.type.startsWith("image/") && !seen.has(f.name + f.size)){ S.reportFiles.push(f); seen.add(f.name + f.size); } });
    e.target.value = ""; renderReportPicks(); return;
  }
  if(e.target.matches("[data-adminsort]")){ S.adminSort = e.target.value; route(); return; }
  if(e.target.matches("[data-delfilter=status]")){ S.delFilter.status = e.target.value; renderDelList(); return; }
  if(e.target.matches("[data-delpick]")){ const id = e.target.dataset.delpick; e.target.checked ? S.delSel.add(id) : S.delSel.delete(id); renderDelList(); return; }
  if(e.target.matches("[data-delall]")){
    const f = S.delFilter, q = f.q.trim().toLowerCase();
    (S.delJobs || []).filter(j => (!f.status || j.status === f.status) && (!q || `${j.title} ${j.pref}${j.city}`.toLowerCase().includes(q))).forEach(j => e.target.checked ? S.delSel.add(j.id) : S.delSel.delete(j.id));
    renderDelList(); return;
  }
  if(e.target.matches("[data-propfilter=company]")){ S.propFilter.company = e.target.value; renderPropList(); return; }
  if(e.target.matches("[data-propimport]")){
    const input = e.target, file = input.files[0]; if(!file) return;
    (async () => {
      const rows = await readCsvFile(file), incoming = csvToProps(rows);
      if(!incoming.length) throw new Error("取り込める物件がありませんでした");
      const replace = $("#prop-replace")?.checked;
      let added = 0, updated = 0, list;
      if(replace) list = incoming;
      else {
        const map = new Map(S.props.map(p => [propIdKey(p), p]));
        incoming.forEach(p => { const k = propIdKey(p), old = map.get(k); if(old){ map.set(k, {...p, id:old.id}); updated++; } else { map.set(k, p); added++; } });
        list = [...map.values()];
      }
      const msg = replace ? `いまの物件マスタ（${S.props.length}件）を消して、${incoming.length}件に入れ替えます。` : `新しく${added}件を追加し、${updated}件を上書きします。`;
      if(!await ask({title:"物件マスタに取り込みますか？", body:msg, ok:"取り込む", danger:replace})) return;
      toast("保存しています…");
      await api().saveProperties(list); S.props = list;
      toast(`取り込みました（${list.length.toLocaleString()}件）`); route();
    })().catch(err => { console.error(err); toast(err.message || String(err)); }).finally(() => { input.value = ""; });
    return;
  }
  const el = e.target.closest("[data-filter]");
  if(!el) return;
  S.filter[el.dataset.filter] = el.type === "checkbox" ? el.checked : el.value;
  route();
});

/* ---------- 起動 ---------- */
function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = src;
    s.onload = res; s.onerror = () => rej(new Error("読み込みに失敗：" + src));
    document.head.appendChild(s);
  });
}
async function boot(){
  try {
    if(FIREBASE_CONFIG.apiKey && !FORCE_DEMO){
      for(const m of ["app","auth","firestore"]) await loadScript(`https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}/firebase-${m}-compat.js`);
      S.api = new FirebaseBackend();
    } else {
      S.api = new DemoBackend();
    }
  } catch(err) {
    $("#app").innerHTML = `<div class="auth-wrap"><div class="empty">起動できませんでした（${esc(err.message)}）。通信環境を確認して、ページを読み込み直してください。</div></div>`;
    return;
  }
  S.api.onAuth(async u => {
    stopNotifier(); stopBadges();
    S.user = u;
    try { S.profile = u ? await S.api.getProfile(u.uid) : null; } catch(e) { console.error(e); S.profile = null; }
    route();
  });
  window.addEventListener("hashchange", route);
}
boot();
</script>
