const dayDiff = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return isoOf(d.getTime()); };
const CAL_CLASS = {open:"c-open", closed:"c-closed", selected:"c-open", assigned:"c-work", working:"c-work", finished:"c-done", completed:"c-done", paid:"c-done"};
async function viewCalendar(ym, company = ""){
  const now = new Date();
  let [y, m] = String(ym || "").split("-").map(Number);
  if(!y || !m){ y = now.getFullYear(); m = now.getMonth() + 1; }
  const [jobs, apps] = await Promise.all([api().listJobs({}), api().listApplications({})]);
  const cnt = {}; apps.forEach(a => { if(a.status === "applied") cnt[a.jobId] = (cnt[a.jobId] || 0) + 1; });
  const first = isoOf(new Date(y, m - 1, 1).getTime()), last = isoOf(new Date(y, m, 0).getTime());
  const gridStart = addDays(first, -new Date(y, m - 1, 1).getDay());
  const gridEnd = addDays(last, 6 - new Date(y, m, 0).getDay());
  // 表示中の月にかかる案件だけ、管理会社（現場情報）を読み込む
  const shown = jobs.filter(j => j.status !== "draft" && j.startDate).map(j => { const w = workDays(j); return {...j, startDate:w.start, endDate:w.end, _w:w}; })
    .filter(j => j.startDate <= gridEnd && j.endDate >= gridStart);
  const privs = await Promise.all(shown.map(j => api().getJobPrivate(j.id).catch(() => ({}))));
  shown.forEach((j, i) => { j.manager = String(privs[i]?.manager || "").trim(); });
  const NONE = "未設定";
  const coOf = j => j.manager || NONE;
  const masterCos = [...new Set((S.props?.length ? S.props : await api().getProperties().catch(() => [])).map(p => p.company).filter(Boolean))];
  const monthJobs = shown.filter(j => j.startDate <= last && j.endDate >= first);
  const counts = {}; monthJobs.forEach(j => { counts[coOf(j)] = (counts[coOf(j)] || 0) + 1; });
  const cos = [...new Set([...masterCos, ...shown.map(coOf)])].filter(c => c !== NONE).sort((a, b) => (counts[b] || 0) - (counts[a] || 0) || a.localeCompare(b, "ja"));
  if(counts[NONE]) cos.push(NONE);
  if(company && !cos.includes(company)) cos.unshift(company);
  const list = company ? shown.filter(j => coOf(j) === company) : shown;
  S.cal = {jobs:new Map(list.map(j => [j.id, j])), cnt};
  const calUrl = (ymv, co = company) => `#/admin/calendar/${ymv}${co ? "/" + encodeURIComponent(co) : ""}`;
  const today = todayIso(), mm = `${y}-${String(m).padStart(2, "0")}`;
  let weeks = "";
  for(let ws = gridStart; ws <= gridEnd; ws = addDays(ws, 7)){
    const we = addDays(ws, 6);
    const evs = list.filter(j => j.startDate <= we && j.endDate >= ws)
      .sort((a, b) => a.startDate.localeCompare(b.startDate) || dayDiff(b.startDate, b.endDate) - dayDiff(a.startDate, a.endDate));
    const lanes = [];
    const bars = evs.map(j => {
      const cs = Math.max(0, dayDiff(ws, j.startDate)) + 1, ce = Math.min(6, dayDiff(ws, j.endDate)) + 1;
      let lane = lanes.findIndex(end => end < cs); if(lane < 0){ lane = lanes.length; lanes.push(0); } lanes[lane] = ce;
      const isS = j.startDate >= ws, isE = j.endDate <= we;
      const who = S.crafts.get(j.assignedTo);
      return `<button type="button" class="cal-bar ${CAL_CLASS[j.status] || ""}${isS ? " s" : ""}${isE ? " e" : ""}" style="grid-column:${cs}/${ce + 1};grid-row:${lane + 2}"
        data-act="cal-job" data-id="${esc(j.id)}" title="${esc(j.title)}（${esc(fmtRange(j.startDate, j.endDate))}）${who ? " " + esc(who.name) : ""}">${isS ? "" : "◀ "}${esc(j.title)}${isE ? "" : " ▶"}</button>`;
    }).join("");
    let bg = "", nums = "";
    for(let i = 0; i < 7; i++){
      const d = addDays(ws, i), other = d.slice(0, 7) !== mm;
      bg += `<div class="${other ? "other" : ""}"></div>`;
      nums += `<div class="cal-num${d === today ? " today" : ""}${i === 0 ? " sun" : i === 6 ? " sat" : ""}${other ? " other" : ""}" style="grid-column:${i + 1}"><span>${Number(d.slice(8))}</span></div>`;
    }
    weeks += `<div class="cal-week"><div class="cal-bg">${bg}</div><div class="cal-fg">${nums}${bars}</div></div>`;
  }
  const prev = isoOf(new Date(y, m - 2, 1).getTime()).slice(0, 7), next = isoOf(new Date(y, m, 1).getTime()).slice(0, 7);
  const inMonth = list.filter(j => j.startDate <= last && j.endDate >= first).sort((a, b) => a.startDate.localeCompare(b.startDate));
  const tabs = `<nav class="seg cal-tabs" aria-label="管理会社で切り替え">
    <a href="${calUrl(mm, "")}" ${!company ? 'aria-current="true"' : ""}>全体（${monthJobs.length}）</a>
    ${cos.map(c => `<a href="${calUrl(mm, c)}" ${company === c ? 'aria-current="true"' : ""}>${esc(c)}（${counts[c] || 0}）</a>`).join("")}</nav>`;
  const rows = inMonth.map(j => {
    const who = S.crafts.get(j.assignedTo);
    return `<a class="row-item" href="#/admin/job/${esc(j.id)}"><span class="row-main"><b>${esc(j.title)}</b>
      <span class="small">開始 ${fmtDay(j.startDate)}　終了 ${fmtDay(j.endDate)}　${esc(j.pref)}${esc(j.city)}${!company ? `　${esc(coOf(j))}` : ""}</span>
      <span class="small">${who ? `受注業者：${esc(who.name)}${who.tradeName ? `（${esc(who.tradeName)}）` : ""}` : `未発注　応募 ${cnt[j.id] || 0}件`}</span></span>
      <span class="pill ${j.status}">${JOB_STATUS[j.status]}</span></a>`;
  }).join("");
  return `<div class="page-head"><div><h1>予定表${company ? `<small class="cal-co">${esc(company)}</small>` : ""}</h1><p class="lead">案件の工期をカレンダーで確認できます。上のタブで全体と管理会社ごとを切り替えられます。案件名を押すと受注業者が表示されます。</p></div></div>
    ${tabs}
    <div class="cal-tool"><a class="btn sub" href="${calUrl(prev)}" aria-label="前の月">‹</a><h2>${y}年${m}月</h2><a class="btn sub" href="${calUrl(next)}" aria-label="次の月">›</a>
      ${mm !== today.slice(0, 7) ? `<a class="textlink" href="${calUrl(today.slice(0, 7))}">今月へ</a>` : ""}</div>
    <div class="cal-legend"><span class="cal-bar c-open s e">募集中</span><span class="cal-bar c-closed s e">締切</span><span class="cal-bar c-work s e">発注済み・作業中</span><span class="cal-bar c-done s e">作業完了以降</span></div>
    <div class="cal" role="grid" aria-label="${y}年${m}月の予定"><div class="cal-head">${"日月火水木金土".split("").map((d, i) => `<div class="${i === 0 ? "sun" : i === 6 ? "sat" : ""}">${d}</div>`).join("")}</div>${weeks}</div>
    <h2 class="day-head"><b>${m}月の案件${company ? `（${esc(company)}）` : ""}</b>${inMonth.length}件</h2>
    ${rows ? `<div class="list">${rows}</div>` : `<div class="empty">この月に工期がかかる案件はありません。</div>`}`;
}
function calPopup(j){
  const who = S.crafts.get(j.assignedTo), n = S.cal?.cnt[j.id] || 0;
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="cal-t">
    <div class="row between" style="margin-bottom:6px"><span class="pill ${j.status}">${JOB_STATUS[j.status]}</span><span class="small">${esc(j.pref)}${esc(j.city)}</span></div>
    <h2 id="cal-t">${esc(j.title)}</h2>
    <p class="small" style="margin:-6px 0 10px">管理会社：${esc(j.manager || "未設定")}</p>
    <dl class="kv"><dt>工事開始</dt><dd>${fmtDate(j.startDate)}${j.startedAt ? `<br><span class="small">作業開始 ${fmtFull(j.startedAt)}</span>` : ""}</dd>
      <dt>工事終了</dt><dd>${fmtDate(j.endDate)}${j.finishedAt ? `<br><span class="small">作業完了 ${fmtFull(j.finishedAt)}</span>` : ""}</dd>

      <dt>受注業者</dt><dd>${who ? `<b>${esc(who.name)}</b>${who.tradeName ? `（${esc(who.tradeName)}）` : ""}<br><a href="tel:${esc(who.phone)}">${esc(who.phone)}</a>` : `未発注（応募 ${n}件）`}</dd></dl>
    <div class="row end" style="margin-top:16px"><button type="button" class="btn sub c-close">閉じる</button><a class="btn" href="#/admin/job/${esc(j.id)}">案件を開く</a></div></div>`;
  const close = () => { bg.remove(); document.removeEventListener("keydown", key); };
  const key = e => { if(e.key === "Escape") close(); };
  bg.addEventListener("click", e => { if(e.target === bg || e.target.closest(".c-close") || e.target.closest("a")) close(); });
  document.addEventListener("keydown", key);
  document.body.appendChild(bg); bg.querySelector(".c-close").focus();
}

  return `<section class="panel"><h2>既存業者 <small>既存業者のみに公開した案件を見られる業者</small></h2>

    <p class="small" style="margin:8px 0 0">押すと既存業者にする／外すを切り替えます。★が既存業者です。</p></section>`;
}

  holder.innerHTML = `<style>${PDF_CSS}</style>${html}`;
  document.body.appendChild(holder);

      html2canvas:{scale:2, backgroundColor:"#ffffff", useCORS:true, scrollX:0, scrollY:0},

async function downloadPdf(html, filename){
  if(!window.html2pdf) await loadScript(HTML2PDF_URL);
  try { await document.fonts?.ready; } catch(e) {}
  const holder = document.createElement("div");
  holder.style.cssText = "position:absolute;left:-12000px;top:0;width:794px";
  holder.innerHTML = `<style>${PDF_CSS}</style>${html}`;
  document.body.appendChild(holder);
  try {
    await window.html2pdf().set({
      margin:0, filename, image:{type:"jpeg", quality:0.95},
      html2canvas:{scale:2, backgroundColor:"#ffffff", useCORS:true, scrollX:0, scrollY:0},
      jsPDF:{unit:"mm", format:"a4", orientation:"portrait"},
      pagebreak:{mode:["css", "legacy"], avoid:["tr", ".po-bottom", ".po-top", ".po-parties"]}
    }).from(holder.querySelector(".pdfwrap") || holder.querySelector(".pdfdoc")).save();
  } finally { holder.remove(); }
}

async function route(){
  const token = ++S.tok;

  const done = (html, opts) => { if(token !== S.tok) return; paint(html, opts); if(moved) window.scrollTo(0, 0); if(after) S.pageUnsub = after(); decorateNotices(); };
  if(!api()) return;
  try {
    if(parts[0] === "join") return done(await viewJoin(parts[1]), {bare:true});
    if(!S.user) return done(parts[0] === "signup" ? viewSignup(parts[1] === "staff") : viewLogin(), {bare:true});
    if(S.pendingJoin){ const t = S.pendingJoin; return done(await viewJoin(t), {bare:true}); }
    if(!S.profile){ let st = false; try { st = localStorage.getItem("refore_signup_staff") === "1"; } catch(e) {} return done(st ? viewStaffSignup() : viewProfileForm(null, true), {bare:true}); }
    const p = S.profile;
    if(p.role === "op") return done(await routeOp(parts));
    if(p.role === "co" && (p.status === "suspended" || !S.company)) return done(viewSuspended());
    startNotifier(); startBadges();
    if(!isCoRole(p.role)){
      const t = parts[0] || "jobs";
      S.viewSeen ||= {};
      if((t === "jobs" || t === "applied") && S.lastTab !== t){ S.viewSeen[t] = getSeen(t); setSeen(t); }
      if(t === "job" && S.lastTab !== "jobs" && S.lastTab !== "job"){ setSeen("jobs"); }
      S.lastTab = t; computeBadges();
    }
    if(isCoRole(p.role)){
      if(parts[0] !== "admin"){ location.replace("#/admin"); return; }
      if(tenant() && !coAdmin() && ["money", "settings", "plan", "members"].includes(parts[1])){ location.replace("#/admin"); return; }
      // 協力業者と評価は、操作がないあいだ（30秒）は読み直さない
      if(!S.craftsAt || Date.now() - S.craftsAt > 30000){
        const [all, ratings] = await Promise.all([api().listCraftsmen(), api().listRatings().catch(() => [])]), crafts = all.filter(c => !c.employee);
        S.crafts = new Map(crafts.map(c => [c.uid, c])); S.allCrafts = all; S.ratings = ratings; S.craftsAt = Date.now();
      }
      const all = S.allCrafts || [], crafts = all.filter(c => !c.employee);
      S.empPending = all.filter(c => c.employee && c.status === "pending");
      S.pending = crafts.filter(c => c.status === "pending").length;
      const [, a, b, c] = parts;
      let html;
      if(!a || a === "list") html = await viewAdminJobs(b || "open");
      else if(a === "new") html = await viewJobEdit(null);
      else if(a === "job" && c === "mat") html = await viewMatOrder(b, parts[4] || "new");
      else if(a === "job" && c === "doc") html = await viewDocEdit(b, parts[4]);
      else if(a === "job" && c === "edit") html = await viewJobEdit(b);
      else if(a === "job") html = await viewAdminJob(b);
      else if(a === "craftsmen") html = await viewCraftsmen();
      else if(a === "home") html = await viewHome();
      else if(a === "memo") html = await viewMemo();
      else if(a === "calendar") html = await viewCalendar(b, parts[3] || "");
      else if(a === "invoices") html = await viewAdminInvoices(b);
      else if(a === "bills") html = await viewBills(b);
      else if(a === "est" && b === "from"){ const id = await estFromLedger(c); location.replace(`#/admin/est/edit/${id}`); return; }
      else if(a === "est" && coAdmin() && (!b || EST_STATUS[b] || (b === "edit" && c === "new"))){ location.replace(b === "edit" ? "#/admin/memo" : "#/admin/money"); return; }
      else if(a === "est"){ if(b === "edit"){ html = await viewEstEdit(c); after = () => { estZoom(); const f = $("#est-form"); if(f){ const prev = S.est; estSync(f); S.est = prev; } return null; }; } else html = await viewEstimates(b); }
      else if(a === "money") html = b === "edit" ? await viewMoneyEdit(c) : await viewMoney(b, c, parts[4]);
      else if(a === "chat"){ if(b){ html = await viewChat(b); after = () => startChat(b); } else html = await viewChatList(); }
      else if(a === "settings"){ html = await viewSettings(b); after = () => { renderPropList(); renderDelList(); return null; }; }
      else if(a === "craftsman") html = await viewCraftsman(b);
      else if(a === "members" && tenant()) html = await viewCoMembers();
      else if(a === "plan" && tenant() && SUBSCRIPTION_ON) html = await viewCoPlan();
      else { location.replace("#/admin"); return; }
      return done(html);
    }
    if(p.status === "suspended") return done(viewSuspended());
    if(p.status !== "approved") return done(viewPending());
    const [a, b] = parts;
    let html;
    if(S.me && (!a || ["jobs", "job", "applied", "invoice"].includes(a))){ location.replace("#/work"); return; }
    if(a === "job") html = await viewJobDetail(b);
    else if(a === "applied") html = await viewApplied();
    else if(a === "work") html = b ? await viewWorkDetail(b) : await viewWork();
    else if(a === "profile") html = S.me ? viewCrewProfile() : viewProfileForm(p, false) + await crewPanel();
    else if(a === "invoice") html = await viewInvoice(b);
    else if(a === "schedule") html = await viewMySchedule(b);
    else if(a === "chat"){ if(b){ html = await viewChat(b); after = () => startChat(b); } else html = await viewChatList(); }
    else if(!a || a === "jobs") html = await viewJobs();
    else { location.replace("#/jobs"); return; }
    done(html);
  } catch(err) {
    console.error(err);
    done(`<div class="empty">読み込めませんでした（${esc(err.message || err)}）<br><br><button class="btn sub" data-act="reload">もう一度読み込む</button></div>`);
  }
}

let toastTimer;
function toast(msg){
  let t = $(".toast");
  if(!t){ t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;

}

function ask({title, body = "", ok = "OK", danger = false, input = null, placeholder = ""}){
  return new Promise(res => {
    const bg = document.createElement("div"); bg.className = "modal-bg";
    const field = input === "textarea" ? `<textarea class="m-in" placeholder="${esc(placeholder)}"></textarea>`
      : input ? `<input class="m-in" type="${input}" placeholder="${esc(placeholder)}">` : "";

    const close = v => { bg.remove(); document.removeEventListener("keydown", key); res(v); };
    const key = e => { if(e.key === "Escape") close(false); };

// 発注書の作業予定日は、業者が決めた入る日（あとから決めた・変えた日も反映する）
async function withWorkDate(d){
  if(!d || d.type !== "order") return d;
  const [job, priv] = await Promise.all([api().getJob(d.jobId).catch(() => null), api().getJobPrivate(d.jobId).catch(() => null)]);
  // 発注書は、表示するたびに「いまの入る日・現場情報」を入れる（以前に作った発注書や、あとから現場情報を直した場合も反映される）
  if(job && !d.manual){
    d.job = {...d.job, workDate:job.craftStart ? pdfPeriod(job.craftStart, job.craftEnd) : ""};
    if(priv) d.job = {...d.job, building:priv.building || d.job.building || "", room:priv.room || "", address:priv.address || d.job.address || "",
      autolock:priv.autolock || "", elevator:priv.elevator || "", keyInfo:priv.keyInfo || "", contact:priv.contact || ""};
  }
  if(myRole() !== "admin" && !job?.craftStart) throw new Error("入る日を決めると、発注書が見られるようになります");
  return d;
}

  async "money-import"(){

    inp.onchange = async () => {
      try {
        const files = [...inp.files]; if(!files.length) return;
        const sets = [];
        for(const f of files){
          const m = f.name.normalize("NFC").match(/(\d+)期[_＿\s-]*(.+?)\.csv$/i);
          let ki = m ? Number(m[1]) : Number(S.ledger?.ki) || kiNow(), co = m ? m[2].trim() : "";
          if(!co){ co = (prompt(`「${f.name}」の管理会社名を入力してください（例：FLEXTOKYO）`, S.ledger && !["全体", "個人成績"].includes(S.ledger.sheet) ? S.ledger.sheet : "") || "").trim(); if(!co) continue; }
          sets.push({ki, co, rows:ledgerFromCsv(await f.text(), co, ki)});
        }
        const n = sets.reduce((a, x) => a + x.rows.length, 0);
        if(!n) throw new Error("取り込める行がありませんでした");
        if(!await ask({title:`${n}行を取り込みますか？`, body:sets.map(x => `・${x.ki}期 ${x.co}：${x.rows.length}行`).join("\n") + "\n\n前に取り込んだ同じ行（同じ期・管理会社・物件名・工事番号）は、新しい内容で上書きします。", ok:"取り込む"})) return;
        const old = (await api().listLedger()).filter(r => !r.jobId);
        // 同じ期・管理会社・物件名で、工事番号が同じもの（または以前の取り込みで数字だけになった番号：「118.0」と「E-2425-118」）は同じ行として上書き

        const used = new Set();
        const all = sets.flatMap(x => x.rows.map(r => { const o = old.find(y => !used.has(y.id) && y.ki === r.ki && coKey(y.company) === coKey(r.company) && y.name === r.name && sameNo(y.jobNo, r.jobNo)); if(o){ used.add(o.id); return {...o, ...r, id:o.id}; } return r; }));
        await api().saveLedgerMany(all); toast(`${all.length}行を取り込みました`); route();
      } catch(e) { toast(e.message || String(e)); }
    };
    inp.click();
  },

      await applyTemaToJob(jobD, priv, tema.filter(x => ids.includes(x)));
      if(ids.length < all.length) return splitAssign(jobD, priv, uid, name, ids);
    } else if(!await ask({title:`${name} さんに発注しますか？`, body:`発注内容（作業内訳）から発注書を自動で作成し、業者さまがダウンロードできるようになります。現場情報もこの業者に表示されます。ほかの応募者は「見送り」になります。${noItems ? "\n\n※作業内訳がまだ入力されていません。先に「編集」で作業ごとの金額を入力してください（あとから入力して発注書を作り直すこともできます）。" : `\n\n発注金額（税抜）：${yenFull(jobD.price)}`}`, ok:"発注する"})) return;

    if(!view?.pages?.length) throw new Error("添付PDFが見つかりません");

      const img = new Image(); img.src = view.pages[i]; await img.decode();
      const w = 210, h = w * img.height / img.width;
      if(i) doc.addPage([w, h]); else if(Math.abs(h - 297) > 1){ doc.deletePage(1); doc.addPage([w, h]); }

    }

    if(job.status === "assigned" && !job.acceptedAt) throw new Error("先に発注内容を確認して「承諾する」を押してください");
    if(job.status === "assigned" && !job.craftStart) throw new Error("先に入る日を決めてください");
    const ps = job.plannedStart || job.startDate || today, pe = job.plannedEnd && job.plannedEnd >= ps ? job.plannedEnd : (job.endDate && job.endDate >= ps ? job.endDate : ps);
    const dur = Math.max(0, dayDiff(ps, pe)), newEnd = addDays(today, dur);
    const moved = today !== job.startDate || newEnd !== job.endDate;
    const body = `開始日時を「${fmtFull(Date.now())}」として記録します。` +
      (moved ? `予定の開始日（${fmtDay(job.startDate)}）と違うため、工期を「${fmtRange(today, newEnd)}」（${dur + 1}日間）に合わせて、予定表も更新します。` : "");
    if(!await ask({title:"作業を開始しますか？", body, ok:"作業を開始する"})) return;
    await api().setWorkProgress(id, "working", {startDate:today, endDate:newEnd, plannedStart:ps, plannedEnd:pe});
    notifyMail(id, "作業を開始しました", `${S.profile.name || "業者"}さんが作業を開始しました（${fmtFull(Date.now())}）。\n工期：${fmtRange(today, newEnd)}`);

    await api().signUp(fd.get("email"), fd.get("password"));

  async profile(form){
    const fd = new FormData(form);
    const trades = fd.getAll("trades"), prefs = fd.getAll("prefs");
    if(!trades.length) throw new Error("対応できる工種を1つ以上選んでください");
    if(!prefs.length) throw new Error("対応エリアを1つ以上選んでください");
    let inv = String(fd.get("invoiceNumber") || "").trim().toUpperCase();
    if(inv && !inv.startsWith("T")) inv = "T" + inv;
    inv = inv ? normInvoice(inv) : "";
    if(inv && !invoiceOk(inv)) throw new Error("インボイス登録番号は「T」と13桁の数字で入力してください");
    const g = k => String(fd.get(k) || "").trim();
    const data = {name:g("name"), tradeName:g("tradeName"), phone:g("phone"), years:g("years"), trades, prefs, areaNote:g("areaNote"), licenses:g("licenses"), invoiceNumber:inv, insurance:g("insurance"), pr:g("pr"), address:g("address"), emailNotify:!!form.elements.emailNotify?.checked,
      bank:{bankName:g("bankName"), branch:g("bankBranch"), type:g("bankType"), number:g("bankNumber"), holder:g("bankHolder")}};
    if(!S.profile){
      await api().createProfile(S.user.uid, {...data, role:"craftsman", status:"pending", plan:"free", email:S.user.email, createdAt:Date.now()});
      toast("審査を申し込みました");
    } else {
      await api().updateProfile(S.user.uid, data);
      toast("登録情報を保存しました");
    }
    S.profile = await api().getProfile(S.user.uid);
    route();

  async apply(form){
    const id = form.dataset.id;
    const job = await api().getJob(id);

  async job(form, e){

    const startDate = g("startDate"), endDate = g("endDate") || startDate;
    if(endDate < startDate) throw new Error("終了日が開始日より前になっています");
    const photoUrls = g("photoUrls").split(/\s+/).map(u => u.trim()).filter(Boolean);
    const badUrl = photoUrls.find(u => !/^https?:\/\/\S+$/i.test(u));
    if(badUrl) throw new Error(`写真確認URLは https:// から始まるリンクを入力してください（${badUrl.slice(0, 40)}）`);

    if(!title) throw new Error("案件名を入力してください");

    if(items.some(i => !i.name)) throw new Error("作業内訳に作業名が空の行があります");
    if(items.some(i => !(i.qty > 0))) throw new Error("作業内訳の数量を入力してください");
    // 「単価表に追加」にチェックした手入力の作業を単価表に登録し、以後はその単価に固定する
    const adds = items.filter(i => i.addPrice);
    let added = 0;
    if(adds.length){
      const bad = adds.find(i => !i.unit || !(i.unitPrice > 0));
      if(bad) throw new Error(`単価表に追加する「${bad.name}」の単位と単価を入力してください`);
      const prices = await api().getPrices().catch(() => clone(DEFAULT_PRICES));
      for(const i of adds){
        const same = prices.find(x => x.name === i.name);
        if(same && (same.unit !== i.unit || Number(same.unitPrice) !== i.unitPrice))
          throw new Error(`「${i.name}」は単価表にすでにあります（${yenFull(same.unitPrice)}／${same.unit}）。プルダウンから選んでください`);
        if(same){ i.priceId = same.id; continue; }
        const np = {id:"p_" + newId(), cat:i.addCat || "未分類", name:i.name, unit:i.unit, unitPrice:i.unitPrice, note:""};
        prices.push(np); i.priceId = np.id; added++;
      }
      if(added){ await api().savePrices(prices); S.prices = prices; }
    }
    items.forEach(i => { delete i.addPrice; delete i.addCat; });
    const price = items.length ? itemsTotal(items) : Math.max(0, Math.round(Number(g("price")) || 0));
    // 募集中に業者全員が見る作業内訳（単価・金額も見せる。住所・鍵などは発注先だけが読める private に保存）
    const publicItems = items.map(i => ({iid:i.iid, cat:i.cat || "その他", loc:i.loc || "", name:i.name, qty:i.qty, unit:i.unit, unitPrice:i.unitPrice, note:i.note || "", zai:!!i.zai,
      ...(i.temaPrice ? {temaPrice:i.temaPrice} : {}), ...(i.tema ? {tema:true, zaiPrice:i.zaiPrice ?? 0} : {})}));
    // 住所・物件名・オートロック・エレベーターは募集中の業者にも見せる（鍵・入室方法・連絡事項・写真URLは発注先だけ。管理会社は業者に見せない）
    const site = {address:g("address"), building:g("building"), room:g("room"), autolock:g("autolock"), elevator:g("elevator")};
    let jobNo = normJobNo(g("jobNo"));
    if(/^[A-Z]+-\d{4}-$/.test(jobNo)) jobNo = "";   // 頭だけで番号が入っていなければ空のまま保存
    if(jobNo && !/^[A-Z]+-\d{4}-\d+$/.test(jobNo)) throw new Error("工事番号は「FT-2627-122」の形で入力してください");
    if(jobNo && (S.jobNos || []).includes(jobNo)) throw new Error(`工事番号「${jobNo}」はほかの案件で使われています`);
    const staffName = g("staff"), sp = (S.staff || []).find(p => p.name === staffName);
    const staff = staffName ? {name:staffName, phone:sp ? sp.phone || "" : ""} : null;
    if(staffName){ try { localStorage.setItem("refore_last_staff", staffName); } catch(e) {} }
    const data = {title, trades, pref:g("pref"), city:g("city"), startDate, endDate, price, taxMode:"税別", items:publicItems, site, staff, jobNo, description:g("description")};

// 作業内訳の並べ替え：つまみをつかんで上下に動かす。ほかの行はよけて場所を空け、離すと行がその場所に滑り込む
// （動かしている間は見た目だけ動かし、離したときに並びを変える）
let itemDrag = null;
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
// 並びを変えたあと、行が元の位置から新しい位置へ滑るように動かす（FLIP）
function slideRows(rows, change, moved){
  const before = new Map(rows.map(r => [r, r.getBoundingClientRect().top]));
  change();
  if(reduceMotion()){ moved?.classList.add("moved"); return; }
  rows.forEach(r => {
    const dy = before.get(r) - r.getBoundingClientRect().top; if(!dy) return;
    r.style.transition = "none"; r.style.transform = `translateY(${dy}px)`;
  });
  requestAnimationFrame(() => requestAnimationFrame(() => rows.forEach(r => {
    if(!r.style.transform) return;
    r.style.transition = "transform .25s ease"; r.style.transform = "";
    r.addEventListener("transitionend", () => { r.style.transition = ""; }, {once:true});
  })));
  if(moved){ moved.classList.remove("moved"); void moved.offsetWidth; moved.classList.add("moved"); }
}
document.addEventListener("pointerdown", e => {
  const g = e.target.closest?.(".i-grip"); if(!g || e.button > 0) return;
  e.preventDefault();
  const row = g.closest(".item-row"), ed = row.parentElement, rows = [...ed.querySelectorAll(".item-row")];
  const gap = parseFloat(getComputedStyle(ed).rowGap) || 0;
  itemDrag = {id:e.pointerId, row, ed, rows, from:rows.indexOf(row), to:rows.indexOf(row), startY:e.pageY,
    size:row.getBoundingClientRect().height + gap,
    mids:rows.map(r => { const b = r.getBoundingClientRect(); return b.top + scrollY + b.height / 2; })};
  row.classList.add("dragging"); ed.classList.add("sorting");
});
document.addEventListener("pointermove", e => {
  const d = itemDrag; if(!d || e.pointerId !== d.id) return;
  e.preventDefault();
  const dy = e.pageY - d.startY, y = d.mids[d.from] + dy;
  d.row.style.transform = `translateY(${dy}px)`;
  d.to = d.rows.filter((r, k) => k !== d.from && d.mids[k] < y).length;
  // 動かしている行が通り過ぎた行は、1行ぶん上（または下）によける
  d.rows.forEach((r, k) => {
    if(r === d.row) return;
    const shift = d.from < d.to && k > d.from && k <= d.to ? -d.size : d.to < d.from && k >= d.to && k < d.from ? d.size : 0;
    r.style.transform = shift ? `translateY(${shift}px)` : "";
  });
  if(e.clientY < 90) scrollBy(0, -14); else if(e.clientY > innerHeight - 90) scrollBy(0, 14);   // 端に来たら自動でスクロール
}, {passive:false});
const endItemDrag = e => {
  const d = itemDrag; if(!d || e.pointerId !== d.id) return;
  itemDrag = null;
  d.ed.classList.remove("sorting"); d.row.classList.remove("dragging");
  if(e.type === "pointerup" && d.to !== d.from){
    // 見た目の位置から、並べ替えたあとの位置へ滑り込ませる
    slideRows(d.rows, () => {
      d.rows.forEach(r => { r.style.transform = ""; });
      const others = d.rows.filter(r => r !== d.row);
      if(d.to < others.length) others[d.to].before(d.row); else others[others.length - 1].after(d.row);
    }, d.row);
    syncItems(d.row.closest("form"));
  } else {
    slideRows(d.rows, () => d.rows.forEach(r => { r.style.transform = ""; }));
  }
};
document.addEventListener("pointerup", endItemDrag); document.addEventListener("pointercancel", endItemDrag);

document.addEventListener("keydown", e => {
  const g = e.target.closest?.(".i-grip"); if(!g || (e.key !== "ArrowUp" && e.key !== "ArrowDown")) return;
  e.preventDefault();
  const row = g.closest(".item-row"), to = e.key === "ArrowUp" ? row.previousElementSibling : row.nextElementSibling;
  if(!to?.classList.contains("item-row")) return;
  slideRows([row, to], () => { e.key === "ArrowUp" ? to.before(row) : to.after(row); }, row);
  g.focus();
});

  if(e.target.matches("[data-delpick]")){ const id = e.target.dataset.delpick; e.target.checked ? S.delSel.add(id) : S.delSel.delete(id); renderDelList(); return; }
  if(e.target.matches("[data-delall]")){
    const f = S.delFilter, q = f.q.trim().toLowerCase();
    (S.delJobs || []).filter(j => (!f.status || j.status === f.status) && (!q || `${j.title} ${j.pref}${j.city}`.toLowerCase().includes(q))).forEach(j => e.target.checked ? S.delSel.add(j.id) : S.delSel.delete(j.id));
    renderDelList(); return;
  }
  if(e.target.matches("[data-propfilter=company]")){ S.propFilter.company = e.target.value; renderPropList(); return; }
  if(e.target.matches("[data-propimport]")){
    const input = e.target, file = input.files[0]; if(!file) return;
    (async () => {
      const rows = await readCsvFile(file), incoming = csvToProps(rows);
      if(!incoming.length) throw new Error("取り込める物件がありませんでした");
      const replace = $("#prop-replace")?.checked;
      let added = 0, updated = 0, list;
      if(replace) list = incoming;
      else {
        const map = new Map(S.props.map(p => [propIdKey(p), p]));
        incoming.forEach(p => { const k = propIdKey(p), old = map.get(k); if(old){ map.set(k, {...p, id:old.id}); updated++; } else { map.set(k, p); added++; } });
        list = [...map.values()];
      }
      const msg = replace ? `いまの物件マスタ（${S.props.length}件）を消して、${incoming.length}件に入れ替えます。` : `新しく${added}件を追加し、${updated}件を上書きします。`;
      if(!await ask({title:"物件マスタに取り込みますか？", body:msg, ok:"取り込む", danger:replace})) return;
      toast("保存しています…");
      await api().saveProperties(list); S.props = list;
      toast(`取り込みました（${list.length.toLocaleString()}件）`); route();
    })().catch(err => { console.error(err); toast(err.message || String(err)); }).finally(() => { input.value = ""; });
    return;
  }
  const el = e.target.closest("[data-filter]");
  if(!el) return;
  S.filter[el.dataset.filter] = el.type === "checkbox" ? el.checked : el.value;
  route();
});

/* =========================================================
   工務店（マルチテナント）・運営・職人のメンバー
   ・Refore（COMPANY_ID）は今までどおり。ほかの工務店は companies/{cid} と、案件などの companyId で分ける
   ・工務店が「全体に公開」した案件は、発注するときに工事代金（税込）＋運営手数料をReforeへ先払い（銀行振込・運営が入金を確認して発注確定）
   ・「既存業者のみ」の案件は先払いなし。職人さんは工務店の締め日で、その工務店へまとめて請求
   ・月額（プラン・メンバー・収支オプション・追加枠）は、運営が毎月請求書を発行
   ========================================================= */
const SUBSCRIPTION_ON = false;   // サブスク（プラン・月額の請求・お試し・投稿数の上限）を使うときは true に
const OP_DEFAULT = {
  plans:{p10:{name:"10件プラン", price:3000, limit:10}, p30:{name:"30件プラン", price:5000, limit:30}, p50:{name:"50件プラン", price:8000, limit:50}},
  trial:{name:"お試しプラン", limit:5, days:30},
  fee:0.1, memberFee:100, moneyFee:1000, extraFee:500,
  bank:"", opName:"株式会社Refore（GENPUKU Pro 運営）", opInvoiceNumber:""
};
const opCfg = () => ({...OP_DEFAULT, ...(S.opCfg || {}), plans:{...OP_DEFAULT.plans, ...((S.opCfg || {}).plans || {})}, trial:{...OP_DEFAULT.trial, ...((S.opCfg || {}).trial || {})}});
const opFee = () => Number(opCfg().fee) || 0.1;
// お試しプラン：運営が招待するときに選ぶ。期間中は月額が無料（全体公開の案件の運営手数料はかかる）。終わると新しい案件を公開できない
const isTrial = c => SUBSCRIPTION_ON && c?.plan === "trial";
const planOf = c => isTrial(c) ? {...opCfg().trial, price:0, trial:true} : opCfg().plans[c?.plan] || opCfg().plans.p10;
const trialLeft = c => isTrial(c) ? Math.ceil(((c.trialEnds || 0) - Date.now()) / 86400000) : null;
const trialNote = c => { const d = trialLeft(c); return d === null ? "" : d > 0 ? `お試し中：あと${d}日（${fmtDate(c.trialEnds)}まで）` : `お試し期間は${fmtDate(c.trialEnds)}で終わりました`; };
const CLOSE_DAYS = [[10, "10日"], [15, "15日"], [20, "20日"], [25, "25日"], [0, "末日"]];
const coCloseLabel = d => (CLOSE_DAYS.find(x => x[0] === Number(d || 0)) || CLOSE_DAYS[4])[1];
const CO_STATUS = {active:"利用中", stopped:"利用停止"};
const PAY_STATUS = {waiting:"振込待ち", reported:"振込の連絡あり（入金確認待ち）", held:"入金確認済み（お預かり中）", billed:"職人の請求あり", sent:"職人に支払済み", refund:"返金が必要", refunded:"返金済み"};

function pubCraftFields(d){
  return {name:d.name || "", tradeName:d.tradeName || "", phone:d.phone || "", email:d.email || "", emailNotify:d.emailNotify !== false, trades:d.trades || [], prefs:d.prefs || [], areaNote:d.areaNote || "",
    years:d.years || "", licenses:d.licenses || "", insurance:d.insurance || "", invoiceNumber:d.invoiceNumber || "", pr:d.pr || "",
    status:d.status || "pending", createdAt:d.createdAt || Date.now(), updatedAt:Date.now()};
}
function pubCraftOf(u, company){
  const f = pubCraftFields(u);
  return {uid:u.uid, role:"craftsman", ...f, invoiceVerified:u.invoiceVerified || null, priority:(company?.priority || []).includes(u.uid)};
}
// Refore の管理者が協力業者の一覧を開いたとき、公開用の登録情報（pubcrafts）を最新にしておく
async function syncPubCrafts(crafts){
  if(api()?.mode !== "firebase" || S.pubSynced) return; S.pubSynced = true;
  const key = "refore_pubsync_" + todayIso(); try { if(localStorage.getItem(key)) return; } catch(e) {}

async function assignOrPrepay(jobId, uid, order){
  const j = await api().getJob(jobId);
  if(tenant() && j?.pay){
    const amt = calcAmount(j.price, taxModeOf(j)), fee = Math.round(amt.total * opFee());
    const c = S.crafts.get(uid) || {};
    const pay = {id:`${jobId}_${Date.now().toString(36)}`, jobId, companyId:S.cid, coName:S.company?.name || "", craftsmanId:uid, craftsmanName:c.tradeName || c.name || "",
      jobTitle:j.title || "", jobNo:j.jobNo || "", amount:amt.total, base:amt.base, fee, total:amt.total + fee, status:"waiting", createdAt:Date.now(), month:curMonth()};
    await api().requestPrepay(jobId, uid, order, pay);
    return "prepay";
  }
  await api().assign(jobId, uid, order);
  return "assigned";
}

function periodOf(ms, closeDay){ const d = new Date(ms || Date.now()), cd = Number(closeDay || 0); if(cd && d.getDate() > cd) d.setMonth(d.getMonth() + 1, 1); return isoOf(d.getTime()).slice(0, 7); }
const periodLabel = (p, cd) => { const [y, m] = p.split("-").map(Number); cd = Number(cd || 0); return `${y}年${m}月分（${cd ? `${m - 1 || 12}/${cd + 1}〜${m}/${cd}` : `${m}/1〜${m}/末日`}）`; };

async function issueCraftInvoice(id, extra, jobs, toName, label){
  const p = S.profile, uid = S.user.uid;
  if(!p.bank?.number) throw new Error("先に登録情報で振込先を入力してください");
  const lines = jobs.filter(j => Number(j.price) > 0).map(j => ({jobId:j.id, title:j.title, place:(j.pref || "") + (j.city || ""), date:fmtDate(j.completedAt || j.finishedAt || j.endDate), amount:Number(j.price)}));
  if(!lines.length) throw new Error("金額が設定された案件がありません");
  const prev = await api().getInvoice(id), base = lines.reduce((a, l) => a + l.amount, 0), tax = Math.floor(base * TAX_RATE);
  if(prev?.status === "paid") throw new Error("この請求書はすでに支払済みです");
  if(!await ask({title:`${toName}宛ての請求書を${prev ? "再" : ""}発行しますか？`, body:`${label}\n${lines.length}件　合計 ${yenFull(base + tax)}（税込）`, ok:"発行する"})) return false;
  await api().saveInvoice({id, craftsmanId:uid, ...extra, toName, number:prev?.number || `INV-${extra.month.replace("-", "")}-${uid.slice(-4).toUpperCase()}${String(Date.now()).slice(-3)}`,
    status:"issued", issuedAt:Date.now(), lines, base, tax, total:base + tax, note:"",
    from:{name:p.name || "", tradeName:p.tradeName || "", address:p.address || "", phone:p.phone || "", email:p.email || "", invoiceNumber:p.invoiceNumber || ""}, bank:{...p.bank}});
  return {lines, total:base + tax, prev};
}

/* ---------- 操作 ---------- */
Object.assign(ACTIONS, {
  async "pp-reported"(el){
    if(!await ask({title:"振り込みましたか？", body:"運営に知らせます。入金を確認すると発注が確定します。", ok:"振り込んだので知らせる"})) return;
    await api().updatePayment(el.dataset.id, {status:"reported", reportedAt:Date.now()});
    const p = await api().getPayment(el.dataset.id); if(p) notifyMail(p.jobId, "先払いの振込の連絡がありました", `${p.coName}　${yenFull(p.total)}`, {kind:"op"});
    toast("運営に知らせました"); route();
  },
  async "pp-cancel"(el){
    if(!await ask({title:"発注先を選び直しますか？", body:"先払いの案内を取り消して、案件を「募集中」に戻します。すでに振り込んでいる場合は、運営（Refore）に連絡してください。", ok:"選び直す", danger:true})) return;
    await api().cancelPrepay(el.dataset.id); toast("募集中に戻しました"); route();
  },
  async "pp-receipt"(el){ const p = await api().getPayment(el.dataset.id); if(!p) return; toast("PDFを作成しています…"); await downloadPdf(feeReceiptHtml(p), `${todayIso().replace(/-/g, "")}・運営手数料領収書.pdf`); },
  async "inv-copy"(el){ const u = inviteUrl(el.dataset.id); try { await navigator.clipboard.writeText(u); toast("招待のリンクをコピーしました"); } catch(e) { await ask({title:"招待のリンク", body:u, ok:"閉じる"}); } },
  async "inv-del"(el){ if(!await ask({title:"招待を取り消しますか？", ok:"取り消す", danger:true})) return; await api().deleteInvite(el.dataset.id); toast("取り消しました"); route(); },
  async "mem-remove"(el){ if(!await ask({title:"このメンバーを外しますか？", body:"管理画面にログインできなくなります。", ok:"外す", danger:true})) return; await api().removeMember(el.dataset.uid); toast("外しました"); route(); },
  async "crew-remove"(el){ if(!await ask({title:"この従業員を外しますか？", ok:"外す", danger:true})) return; await api().removeMember(el.dataset.uid); toast("外しました"); route(); },
  async "co-plan"(el){
    const p = opCfg().plans[el.dataset.id];
    if(!await ask({title:`${p.name}に変更しますか？`, body:`月額 ${yenFull(p.price)}（税別）・月 ${p.limit}件まで公開。今月の請求から新しいプランになります。`, ok:"変更する"})) return;
    await api().updateCompany(S.cid, {plan:el.dataset.id}); S.company.plan = el.dataset.id; toast("プランを変更しました"); route();
  },
  async "co-extra"(){
    const ym = curMonth(), o = opCfg();
    if(!await ask({title:"追加枠を1件買いますか？", body:`今月だけ公開できる件数が1件増えます。${yenFull(o.extraFee)}（税別）を今月の請求に足します。`, ok:"買う"})) return;
    const extra = {...(S.company.extra || {})}; extra[ym] = Number(extra[ym] || 0) + 1;
    await api().updateCompany(S.cid, {extra}); S.company.extra = extra; toast("追加枠を1件買いました"); route();
  },
  async "co-money"(el){
    const on = el.dataset.on === "1";
    if(!await ask({title:on ? "収支オプションを使いますか？" : "収支オプションをやめますか？", body:on ? `月額 ${yenFull(opCfg().moneyFee)}（税別）が足されます。` : "データは残ります。あとから再開できます。", ok:on ? "使う" : "やめる"})) return;
    await api().updateCompany(S.cid, {money:on}); S.company.money = on; toast(on ? "収支オプションを始めました" : "収支オプションをやめました"); route();
  },
  async "cobill-pdf"(el){ const b = (await api().listCoBills(tenant() ? {companyId:S.cid} : {})).find(x => x.id === el.dataset.id); if(!b) return; toast("PDFを作成しています…"); await downloadPdf(coBillHtml(b), `${b.month.replace("-", "")}・GENPUKU Pro 御請求書.pdf`); },
  async "civ-job"(el){
    const j = await api().getJob(el.dataset.job); if(!j) return;
    const r = await issueCraftInvoice(`${S.user.uid}_j_${j.id}`, {type:"job", companyId:j.companyId, coName:j.coName || "", jobId:j.id, month:curMonth()}, [j], "株式会社Refore", `${j.title}（掲載元：${coNameOf(j)}）`);
    if(!r) return;
    if(j.payId) api().updatePayment(j.payId, {status:"billed", billedAt:Date.now()}).catch(e => console.warn(e));
    notifyMail(j.id, "ポータル案件の請求書が届きました", `${S.profile.name || ""}さん　${yenFull(r.total)}（税込）`, {kind:"op"});

// オートロック：無／鍵対応／有（番号を入れる）の3つ。物件マスタの「呼1131」「#1234」「不明」なども読み取る
const AL_TYPES = [["", "選んでください"], ["none", "無"], ["key", "鍵対応"], ["yes", "有（番号を入れる）"]];
function alParse(v){
  v = String(v || "").normalize("NFKC").trim();
  if(!v) return {t:""};
  if(/^(無|なし|無し|-|ー|×)$/.test(v)) return {t:"none"};
  if(/^(鍵対応|キー対応)$/.test(v)) return {t:"key"};
  if(/^(有|あり|有り|○|不明|\?|？)$/.test(v)) return {t:"yes", n:""};
  // 「呼1131」「呼出1131」「有呼1131」「有 呼出4131」「※0427呼」「#1234」「有 1131」は番号だけ
  const m = v.match(/^(?:有\s*)?(?:呼(?:出|び出し)?\s*)?(?:暗証(?:番号)?\s*)?(#?\d{3,8}#?)$/) || v.match(/^※?\s*(\d{3,6})\s*呼$/);
  if(m) return {t:"yes", n:m[1]};
  // カードキー・キーBOXの場所など、それ以外は書いてあるまま
  return {t:"yes", n:v.replace(/^有\s*/, "")};
}
function alText(t, n){ n = String(n || "").trim(); return {none:"無", key:"鍵対応", yes:n ? `有 ${n}` : "有"}[t] || ""; }
function alSet(f, v){ const a = alParse(v); f.elements.mAlT.value = a.t; f.elements.mAlN.value = a.n || ""; f.elements.mAlT.dataset.orig = v || ""; alUi(f); }
// 物件マスタの書き方（呼1131など）は、変えていなければそのまま残す
function alSave(f){
  const t = f.elements.mAlT.value, n = f.elements.mAlN.value.trim(), orig = f.elements.mAlT.dataset.orig || "", o = alParse(orig);
  if(!t) return orig;
  if(o.t === t && String(o.n || "") === n && orig) return orig;
  return alText(t, n);
}
function alUi(f){ f.elements.mAlN.hidden = f.elements.mAlT.value !== "yes"; }
document.addEventListener("change", e => { if(e.target.name === "mAlT" && e.target.form) alUi(e.target.form); });
function evSet(f, v){
  const sel = f.elements.mEv; v = String(v || "").trim();
  [...sel.options].filter(o => o.dataset.extra).forEach(o => o.remove());
  if(v && ![...sel.options].some(o => o.value === v)){ const o = new Option(v, v); o.dataset.extra = "1"; sel.add(o); }
  sel.value = v;
}
// 物件マスタの「有・無・鍵対応・呼出1131」などを、ある／ないに読み替える
const hasFacility = v => { v = String(v || "").trim(); return !!v && !/^(無|なし|無し|-|ー|×|不明|\?|？)$/.test(v); };
// チェックが物件マスタと同じなら元の書き方（呼出1131など）を残し、変わったときだけ「有／無」にする
const facilityVal = (old, on) => hasFacility(old) === on ? (old || (on ? "有" : "")) : (on ? "有" : "無");
// 鍵・入室方法：プルダウン＋必要なときだけ番号・場所。選んだ内容は1行の文字（keyInfo）にまとめて保存する
const KEY_TYPES = [["mailbox", "メールボックス紐吊るし"], ["ps", "PS内直置き"], ["unlock", "玄関アンロック"], ["keybox", "キーBOX"], ["resident", "入居者対応（入居者に開けてもらう）"], ["other", "その他"]];
function keyParse(v){
  v = String(v || "").trim();
  if(!v) return {t:""};
  const g = re => (v.match(re) || [])[1] || "";
  if(v.startsWith("メールボックス紐吊るし")) return {t:"mailbox", note:g(/（(.*)）$/)};
  if(v.startsWith("PS内直置き")) return {t:"ps", note:g(/（(.*)）$/)};
  if(v.startsWith("玄関アンロック")) return {t:"unlock", code:g(/番号[:：]\s*([^／）]+)/)};
  if(v.startsWith("入居者対応")){ const inner = g(/（(.*)）$/).split("／"); const nm = inner.find(x => /様$/.test(x)) || "", tel = inner.find(x => /^[\d\-+() ]{8,}$/.test(x)) || "";
    return {t:"resident", rname:nm.replace(/様$/, ""), rtel:tel, rnote:inner.filter(x => x && x !== nm && x !== tel).join("／")}; }
  if(/^キー\s*BOX|^キーボックス/i.test(v)) return {t:"keybox", code:g(/番号[:：]\s*([^／）]+)/), place:g(/場所[:：]\s*([^／）]+)/)};
  return {t:"other", other:v};
}
function keyText(t, code, place, other, res = {}){
  code = String(code || "").trim(); place = String(place || "").trim(); other = String(other || "").trim();
  if(t === "resident"){ const nm = String(res.rname || "").trim(), tel = String(res.rtel || "").trim(), note = String(res.rnote || "").trim();
    const inner = [nm && nm + "様", tel, note].filter(Boolean).join("／"); return `入居者対応${inner ? `（${inner}）` : ""}`; }
  if(t === "mailbox") return "メールボックス紐吊るし";
  if(t === "ps") return "PS内直置き";
  if(t === "unlock") return `玄関アンロック${code ? `（番号：${code}）` : ""}`;
  if(t === "keybox") return `キーBOX${code || place ? `（${[place && "場所：" + place, code && "番号：" + code].filter(Boolean).join("／")}）` : ""}`;
  if(t === "other") return other;
  return "";
}
function keyPicker(value, label = "鍵・入室方法", hint = "発注した業者にだけ見えます"){
  const k = keyParse(value);
  return `<div class="field keypick" data-keypick><span>${esc(label)}${hint ? ` <small>${esc(hint)}</small>` : ""}</span>
    <select data-key-t aria-label="${esc(label)}"><option value="">選んでください</option>${KEY_TYPES.map(([v, l]) => `<option value="${v}" ${k.t === v ? "selected" : ""}>${l}</option>`).join("")}</select>
    <div class="keypick-sub">
      <input type="text" data-key-place placeholder="キーBOXの場所（例：PS内・メーターボックス）" value="${esc(k.place || "")}" ${k.t === "keybox" ? "" : "hidden"}>
      <input type="text" data-key-code inputmode="numeric" placeholder="${k.t === "keybox" ? "キーBOXの番号" : "玄関の番号"}" value="${esc(k.code || "")}" ${["unlock", "keybox"].includes(k.t) ? "" : "hidden"}>
      <input type="text" data-key-other placeholder="例：管理人室で受け取り" value="${esc(k.other || "")}" ${k.t === "other" ? "" : "hidden"}>
      <input type="text" data-key-rname placeholder="入居者の名前（例：山田）" value="${esc(k.rname || "")}" ${k.t === "resident" ? "" : "hidden"}>
      <input type="tel" data-key-rtel placeholder="入居者の電話番号" value="${esc(k.rtel || "")}" ${k.t === "resident" ? "" : "hidden"}>
      <input type="text" data-key-rnote placeholder="在宅の時間・注意（例：平日10時以降・犬あり）" value="${esc(k.rnote || "")}" ${k.t === "resident" ? "" : "hidden"}>
    </div>
    <input type="hidden" name="keyInfo" value="${esc(value || "")}"></div>`;
}
function keySync(box){
  const q = sel => box.querySelector(sel), t = q("[data-key-t]").value;
  q("[data-key-place]").hidden = t !== "keybox";
  q("[data-key-code]").hidden = !["unlock", "keybox"].includes(t);
  q("[data-key-code]").placeholder = t === "keybox" ? "キーBOXの番号" : "玄関の番号";
  q("[data-key-other]").hidden = t !== "other";
  ["rname", "rtel", "rnote"].forEach(k => { q(`[data-key-${k}]`).hidden = t !== "resident"; });
  q("[name=keyInfo]").value = keyText(t, q("[data-key-code]").value, q("[data-key-place]").value, q("[data-key-other]").value,
    {rname:q("[data-key-rname]").value, rtel:q("[data-key-rtel]").value, rnote:q("[data-key-rnote]").value});
}
document.addEventListener("input", e => { const b = e.target.closest?.("[data-keypick]"); if(b) keySync(b); });
document.addEventListener("change", e => { const b = e.target.closest?.("[data-keypick]"); if(b) keySync(b); });

// 新しい工事番号：管理会社の頭文字-期-（収支・案件・見積で使った番号のいちばん大きい番号＋1）
async function nextJobNo(company){
  const head = `${jobNoPrefix(company)}-${jobNoPeriod()}-`;
  const [{rows}, ests] = await Promise.all([ledgerData().catch(() => ({rows:[]})), api().listEstimates().catch(() => [])]);
  const nums = [...rows.map(r => r.jobNo), ...ests.map(e => e.no), ...(S.jobNos || [])].map(normJobNo).filter(n => n.startsWith(head)).map(n => Number(n.slice(head.length)) || 0);
  return head + (Math.max(0, ...nums) + 1);
}

// 見積の行の並べ替え：つまみをつかんで上下に。ほかの行はよけて場所を空け、離すとその場所に入る
let erDrag = null;
document.addEventListener("pointerdown", e => {
  const g = e.target.closest?.(".er-grip"); if(!g || e.button > 0) return;
  e.preventDefault();
  const row = g.closest(".er"), box = row.parentElement, rows = [...box.children].filter(x => x.classList.contains("er"));
  erDrag = {id:e.pointerId, row, box, rows, from:rows.indexOf(row), to:rows.indexOf(row), startY:e.pageY,
    size:row.getBoundingClientRect().height, mids:rows.map(r => { const b = r.getBoundingClientRect(); return b.top + scrollY + b.height / 2; })};
  row.classList.add("dragging"); box.classList.add("er-sorting");
  try { g.setPointerCapture(e.pointerId); } catch(err) {}
});
document.addEventListener("pointermove", e => {
  const d = erDrag; if(!d || e.pointerId !== d.id) return;
  e.preventDefault();
  const dy = e.pageY - d.startY, y = d.mids[d.from] + dy;
  d.row.style.transform = `translateY(${dy}px)`;
  d.to = d.rows.filter((r, k) => k !== d.from && d.mids[k] < y).length;
  d.rows.forEach((r, k) => {
    if(r === d.row) return;
    const shift = d.from < d.to && k > d.from && k <= d.to ? -d.size : d.to < d.from && k >= d.to && k < d.from ? d.size : 0;
    r.style.transform = shift ? `translateY(${shift}px)` : "";
  });
  if(e.clientY < 90) scrollBy(0, -14); else if(e.clientY > innerHeight - 90) scrollBy(0, 14);
}, {passive:false});
const erDragEnd = e => {
  const d = erDrag; if(!d || e.pointerId !== d.id) return;
  erDrag = null;
  d.rows.forEach(r => { r.style.transition = "none"; r.style.transform = ""; });
  d.box.classList.remove("er-sorting"); d.row.classList.remove("dragging");
  if(d.to !== d.from){
    const others = d.rows.filter(r => r !== d.row), ref = others[d.to];
    slideRows(d.rows, () => { ref ? ref.before(d.row) : others[others.length - 1].after(d.row); }, d.row);
    const f = d.row.closest("form"); if(f) estSync(f);
  }
  requestAnimationFrame(() => d.rows.forEach(r => { r.style.transition = ""; }));
};
document.addEventListener("pointerup", erDragEnd);
document.addEventListener("pointercancel", erDragEnd);
document.addEventListener("keydown", e => {
  const g = e.target.closest?.(".er-grip"); if(!g || (e.key !== "ArrowUp" && e.key !== "ArrowDown")) return;
  e.preventDefault();
  const row = g.closest(".er"), to = e.key === "ArrowUp" ? row.previousElementSibling : row.nextElementSibling;
  if(!to?.classList.contains("er")) return;
  slideRows([row, to], () => { e.key === "ArrowUp" ? to.before(row) : to.after(row); }, row);
  g.focus(); const f = row.closest("form"); if(f) estSync(f);
});

// 訂正：訂正前（baseRows）と今の行を比べて、追加・変更・削除を付ける（並びは今の順。消した行は元の位置あたりに）
function estDiffRows(e){
  const base = e.baseRows || [], cur = e.rows || [];
  if(!e.rev || !base.length || e.showDiff === false) return cur;
  const byId = new Map(base.map(r => [r.id, r])), curIds = new Set(cur.map(r => r.id)), out = [];
  let bi = 0;
  const flushTo = idx => { while(bi < idx){ const b = base[bi++]; if(!curIds.has(b.id)) out.push({...b, _del:true}); } };
  const KEYS = ["loc", "name", "spec", "qty", "unit", "price"];
  cur.forEach(r => {
    const b = byId.get(r.id);
    if(b){ const idx = base.indexOf(b); if(idx >= bi){ flushTo(idx); bi = idx + 1; } }
    if(!b) out.push({...r, _add:true});
    else { const ch = b.noteRow ? (b.name !== r.name ? ["name"] : []) : KEYS.filter(k => String(b[k] ?? "") !== String(r[k] ?? "")); out.push(ch.length ? {...r, _old:b, _ch:ch} : r); }
  });
  flushTo(base.length);
  return out;
}
function estMarkDiff(form){
  const e = S.est || {}, box = $("#er-rev"); if(!box) return;
  const base = e.baseRows || [];
  form.querySelectorAll(".er").forEach(el => { el.classList.remove("er-add", "er-chg"); el.querySelector(".er-was")?.remove(); });
  if(!e.rev || !base.length){
    box.innerHTML = (e.revs || []).length ? estRevHistory(e) : ""; return;
  }
  const rows = estDiffRows({...e, showDiff:true}), del = rows.filter(r => r._del), add = rows.filter(r => r._add), chg = rows.filter(r => r._ch);
  rows.forEach(r => {
    const el = form.querySelector(`.er[data-id="${CSS.escape(r.id || "")}"]`); if(!el || r._del) return;
    if(r._add) el.classList.add("er-add");
    if(r._ch){ el.classList.add("er-chg"); const o = r._old;
      el.insertAdjacentHTML("beforeend", `<span class="er-was">訂正前：${esc([o.loc, o.name, o.spec].filter(Boolean).join(" "))}${o.noteRow ? "" : `　${fmtQty(o.qty || 0)}${esc(o.unit || "")} × ${yenFull(o.price || 0)} = ${yenFull(estAmt(o))}`}</span>`); }
  });
  const bt = estTotals({rows:base}).total, nt = estTotals(e).total;
  box.innerHTML = `<div class="er-revbox"><div class="er-revhead"><b>訂正${e.rev}</b><span>追加 ${add.length}・変更 ${chg.length}・削除 ${del.length}</span><span>訂正前 ${yenFull(bt)} → <b>${yenFull(nt)}</b>（${nt - bt >= 0 ? "+" : "−"}${yenFull(Math.abs(nt - bt))}）</span>
      <label class="toggle"><input type="checkbox" name="showDiff" ${e.showDiff !== false ? "checked" : ""}>見積書に訂正前の内容を取消線で載せる</label></div>
    ${del.length ? `<div class="er-dellist"><span class="small">訂正で消した工事（見積書には取消線で出ます）</span>${del.map(r => `<div class="er-delrow"><s>${esc([r.loc, r.name, r.spec].filter(Boolean).join(" "))}${r.noteRow ? "" : `　${fmtQty(r.qty || 0)}${esc(r.unit || "")} × ${yenFull(r.price || 0)} = ${yenFull(estAmt(r))}`}</s><button type="button" class="textlink" data-act="er-restore" data-id="${esc(r.id)}">戻す</button></div>`).join("")}</div>` : ""}
    ${estRevHistory(e)}</div>`;
}
function estRevHistory(e){
  const revs = e.revs || []; if(!revs.length) return "";
  return `<div class="er-hist small">前の版：${revs.map((r, i) => `<button type="button" class="textlink" data-act="est-oldpdf" data-i="${i}">${r.rev ? `訂正${r.rev}` : "初回"}（${yenFull(r.total)}${r.issuedAt ? "・" + fmtDate(r.issuedAt) : ""}）</button>`).join("　")}</div>`;
}

// 工事メモの工事内容：文字で単価表を探す（工事名・分類・単位）。選ぶと単位も入る
function memoWork(input){
  const box = input.parentElement.querySelector(".memo-wac"), q = normKey(input.value);
  if(!q){ box.hidden = true; return; }
  const hits = estPrices().filter(p => !p.noteRow && p.name).map(p => { const n = normKey(p.name), c = normKey(p.cat || ""); return [n.startsWith(q) ? 0 : n.includes(q) ? 1 : c.includes(q) ? 2 : -1, p]; })
    .filter(x => x[0] >= 0).sort((a, b) => a[0] - b[0] || a[1].name.length - b[1].name.length).slice(0, 10).map(x => x[1]);
  box.innerHTML = hits.length ? hits.map(p => `<li data-pid="${esc(p.id)}"><b>${highlight(p.name, input.value.trim())}</b><span>${esc(p.cat || "")}${p.sell ? `　${yenFull(p.sell)}／${esc(p.unit)}` : ""}</span></li>`).join("")
    : `<li class="none">単価表にありません。このまま入れられます（単価は見積で入れます）</li>`;
  box.hidden = false; S.mwIdx = -1;
}
function memoWorkPick(input, p){
  const row = input.closest(".memo-row");
  input.value = p.name; row.querySelector("[name=m_pid]").value = p.id;
  const u = row.querySelector("[name=m_unit]"); if(u) u.value = p.unit || u.value;
  row.querySelector(".memo-wac").hidden = true; memoRowState(row);
  (isCloth(p.name) ? row.querySelector("[name=d_h]") : row.querySelector("[name=m_qty]")).focus();
}
document.addEventListener("input", e => {
  const t = e.target; if(!t.matches?.("[data-memo-w]")) return;
  t.parentElement.querySelector("[name=m_pid]").value = ""; memoWork(t);
});
document.addEventListener("keydown", e => {
  const t = e.target; if(!t.matches?.("[data-memo-w]")) return;
  const box = t.parentElement.querySelector(".memo-wac"), items = [...box.querySelectorAll("li[data-pid]")]; if(box.hidden || !items.length) return;
  if(e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); S.mwIdx = (S.mwIdx + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length; items.forEach((li, i) => li.classList.toggle("on", i === S.mwIdx)); }
  else if(e.key === "Enter" && S.mwIdx >= 0){ e.preventDefault(); const p = estPrices().find(x => x.id === items[S.mwIdx].dataset.pid); if(p) memoWorkPick(t, p); }
  else if(e.key === "Escape") box.hidden = true;
});
document.addEventListener("focusout", e => { if(e.target.matches?.("[data-memo-w]")) setTimeout(() => { const b = e.target.parentElement?.querySelector(".memo-wac"); if(b) b.hidden = true; }, 200); });
document.addEventListener("mousedown", e => {
  const li = e.target.closest?.(".memo-wac li[data-pid]");
  if(li){ e.preventDefault(); const p = estPrices().find(x => x.id === li.dataset.pid), inp = li.closest(".memo-wq").querySelector("[data-memo-w]"); if(p) memoWorkPick(inp, p); return; }
  if(!e.target.closest?.(".memo-wq")) document.querySelectorAll(".memo-wac").forEach(b => { b.hidden = true; });
});

document.addEventListener("input", e => { const t = e.target; if(t.matches?.("#est-form [name=company], form[data-form=memo] [name=company], form[data-form=memo] [name=companyNew]")) S.estCo = t.value === "__new" ? "" : t.value.trim(); });
document.addEventListener("change", e => { const t = e.target; if(t.matches?.("form[data-form=memo] [name=company]")) S.estCo = t.value === "__new" ? "" : t.value; });

/* ---------- 起動 ---------- */
function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = src;
    s.onload = res; s.onerror = () => rej(new Error("読み込みに失敗：" + src));
    document.head.appendChild(s);
  });
}
async function boot(){
  try {
    if(FIREBASE_CONFIG.apiKey && !FORCE_DEMO){
      const fb = m => loadScript(`https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}/firebase-${m}-compat.js`);
      await fb("app"); await Promise.all([fb("auth"), fb("firestore")]);   // app のあとは並べて読む
      S.api = new FirebaseBackend();
    } else {
      S.api = new DemoBackend();
    }
  } catch(err) {
    $("#app").innerHTML = `<div class="auth-wrap"><div class="empty">起動できませんでした（${esc(err.message)}）。通信環境を確認して、ページを読み込み直してください。</div></div>`;
    return;
  }
  S.api.onAuth(async u => {
    stopNotifier(); stopBadges();
    S.user = u;
    try { S.profile = u ? await S.api.getProfile(u.uid) : null; } catch(e) { console.error(e); S.profile = null; }
    try { await afterLogin(); } catch(e) { console.error(e); }
    route(); if(S.profile && !S.me) startPushListener();
  });
  window.addEventListener("hashchange", route);
}
boot();
