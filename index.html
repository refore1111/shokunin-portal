<!-- Firebase の部品は、ページを読み始めると同時にダウンロードしておく（ログイン画面が早く出る） -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">
<link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js">
<link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet" media="(min-width: 900px)">
<style>
:root{
  --paper:#EEF1F4; --surface:#FFFFFF; --ink:#18212C; --sub:#5A6574; --line:#D3D9E0;
  --kon:#1F3A5F; --kon-text:#1F3A5F; --kon-ink:#FFFFFF; --kon-soft:#E2E9F2;
  --shu:#C42E26; --caution:#E8B21C; --warn:#8A5F00; --warn-soft:#FBF1D6;
  --ok:#2C7A4B;
  --font:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  --num:"Barlow Condensed","Arial Narrow","BIZ UDPGothic",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11161D; --surface:#19212B; --ink:#E5EAF0; --sub:#9AA5B3; --line:#2B3542;
    --kon:#2F5487; --kon-text:#8FB2E3; --kon-ink:#FFFFFF; --kon-soft:#1E2A3A;
    --shu:#E5584E; --warn:#E8B21C; --warn-soft:#30291A; --ok:#5BB585;
  }
}
:root[data-theme="dark"]{
  --paper:#11161D; --surface:#19212B; --ink:#E5EAF0; --sub:#9AA5B3; --line:#2B3542;
  --kon:#2F5487; --kon-text:#8FB2E3; --kon-ink:#FFFFFF; --kon-soft:#1E2A3A;
  --shu:#E5584E; --warn:#E8B21C; --warn-soft:#30291A; --ok:#5BB585;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
img{max-width:100%;display:block}
a{color:var(--kon-text)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--caution);outline-offset:2px}
h1{font-size:22px;line-height:1.4;margin:0 0 4px}
h2{font-size:16px;line-height:1.5;margin:0 0 12px}

/* デモ表示 */
.demo{background:var(--caution);color:#1d1600;font-size:13px;padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.demo button{background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.25);border-radius:4px;padding:2px 10px;cursor:pointer;font-size:13px;color:#1d1600}

/* ヘッダー */
.top{background:var(--kon);color:var(--kon-ink)}
.top-in{max-width:960px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-decoration:none;color:inherit}
.brand-mark{flex:none;width:34px;height:34px;border:2px solid currentColor;display:grid;place-items:center;font-family:var(--num);font-weight:600;font-size:20px;border-radius:3px}
.brand b{display:block;font-size:15px;line-height:1.3}
.brand small{display:block;font-size:12px;opacity:.8;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .link{background:none;border:1px solid rgba(255,255,255,.45);color:inherit;border-radius:4px;padding:4px 10px;font-size:13px;cursor:pointer;flex:none}
.admin-nav{max-width:960px;margin:0 auto;padding:0 8px;display:flex;gap:4px}
.admin-nav a{padding:8px 12px 10px;text-decoration:none;font-size:14px;color:rgba(255,255,255,.75);border-bottom:3px solid transparent}
.admin-nav a[aria-current="page"]{color:#fff;border-color:var(--caution);font-weight:700}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--caution);color:#1d1600;font-size:12px;font-weight:700;text-align:center;line-height:20px;margin-left:4px}

/* 職人用タブ（スマホは下、PCは上） */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 10px;font-size:11px;text-decoration:none;color:var(--sub)}
.tabbar svg{width:22px;height:22px}
.tabbar a[aria-current="page"]{color:var(--kon-text);font-weight:700}
@media (min-width:720px){
  .tabbar{position:sticky;top:0;bottom:auto;display:flex;justify-content:center;gap:4px;border-top:0;border-bottom:1px solid var(--line);padding-bottom:0}
  .tabbar a{flex-direction:row;gap:6px;font-size:14px;padding:10px 16px;border-bottom:3px solid transparent}
  .tabbar a[aria-current="page"]{border-color:var(--kon-text)}
  .tabbar svg{width:18px;height:18px}
}

.main{max-width:960px;margin:0 auto;padding:20px 16px 110px}
@media (min-width:720px){.main{padding-bottom:48px}}
.lead{color:var(--sub);font-size:14px;margin:0 0 20px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.page-head .lead{margin:0}
.back{display:inline-block;font-size:14px;color:var(--sub);text-decoration:none;margin-bottom:10px;padding:4px 0}
.small{font-size:13px;color:var(--sub)}
.pre{white-space:pre-wrap;word-break:break-word}
.center{text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.end{justify-content:flex-end}
.stack{display:grid;gap:16px;align-content:start}
.cols{display:grid;gap:16px}
@media (min-width:860px){.cols{grid-template-columns:1.25fr 1fr;align-items:start}}

/* 絞り込み */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters select{width:auto;padding:8px 10px;font-size:14px}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--kon)}
.seg{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.seg a{padding:5px 14px;border-radius:999px;border:1px solid var(--line);text-decoration:none;font-size:13px;white-space:nowrap;background:var(--surface);color:var(--ink)}
.seg a[aria-current="true"]{background:var(--kon);border-color:var(--kon);color:var(--kon-ink)}

/* 案件カード：伝票＋判子 */
.list{display:grid;gap:12px}
@media (min-width:720px){.list.grid{grid-template-columns:1fr 1fr}}
.job{position:relative;display:block;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--kon);border-radius:6px;padding:14px 16px;text-decoration:none;color:var(--ink);overflow:hidden}
.job:hover{border-color:var(--kon-text)}
.job h3{font-size:17px;margin:6px 0 8px;line-height:1.45;padding-right:66px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:12px;background:var(--kon-soft);color:var(--ink);padding:1px 8px;border-radius:3px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px;margin:0}
.meta dt{color:var(--sub)}
.meta dd{margin:0}
.price{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.price .num{font-family:var(--num);font-weight:600;font-size:30px;line-height:1;letter-spacing:.01em}
.price small{color:var(--sub);font-size:12px}
.price.big{border:0;padding:0;margin:4px 0 14px}
.price.big .num{font-size:42px}
.job .foot{margin:8px 0 0;font-size:13px;color:var(--sub)}
.count{font-family:var(--num);font-weight:600;font-size:20px;color:var(--ink)}
.stamp{position:absolute;top:12px;right:12px;width:60px;height:60px;border:2px solid var(--stamp,var(--shu));color:var(--stamp,var(--shu));border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.04em;transform:rotate(-12deg);box-shadow:inset 0 0 0 2px var(--surface),inset 0 0 0 3.5px var(--stamp,var(--shu));pointer-events:none}
.stamp.mute{--stamp:var(--sub)}
.stamp.inline{position:static;flex:none}
.stamp.press{animation:press .38s cubic-bezier(.2,.9,.3,1.2)}
@keyframes press{0%{transform:rotate(-12deg) scale(1.9);opacity:0}70%{transform:rotate(-12deg) scale(.94);opacity:1}100%{transform:rotate(-12deg) scale(1)}}

/* パネル・詳細 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.panel > :last-child{margin-bottom:0}
.panel h2 small{font-weight:400;color:var(--sub);font-size:12px;margin-left:6px}
.detail h1{margin:8px 0 6px}
.detail h2{font-size:15px;margin:20px 0 8px;border-left:4px solid var(--caution);padding-left:8px}
.kv{display:grid;grid-template-columns:7.5em 1fr;gap:6px 12px;margin:0;font-size:14px}
.kv dt{color:var(--sub)}
.kv dd{margin:0;white-space:pre-wrap;word-break:break-word}
.note{background:var(--warn-soft);border-left:4px solid var(--caution);padding:10px 12px;font-size:14px;border-radius:0 4px 4px 0;margin:0 0 16px}
.empty{text-align:center;color:var(--sub);padding:36px 16px;border:1px dashed var(--line);border-radius:6px;background:var(--surface)}
.row-item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.row-item:hover{border-color:var(--kon-text)}
.row-main{display:grid;gap:2px;min-width:0}

.file-btn{position:relative;overflow:hidden;cursor:pointer}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.rp-head{display:flex;justify-content:space-between;align-items:center;margin:10px 0 6px}
.rp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px;margin-bottom:14px}
.rp-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px;background:var(--paper)}
.rp-more{display:grid;place-items:center;aspect-ratio:1;background:var(--paper);border-radius:3px;font-size:13px;color:var(--sub)}
.rp-progress{margin:0 0 12px}
.rp-bar{height:10px;background:var(--paper);border-radius:999px;overflow:hidden}
.rp-bar i{display:block;height:100%;width:0;background:var(--kon);transition:width .2s}
.cmt{border:2px solid var(--kon-text);border-radius:8px;background:var(--kon-soft);padding:10px 14px;margin:0 0 10px}
.cmt.empty{border-width:1px;border-style:dashed;background:transparent}
.cmt-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;margin-bottom:4px}
.cmt-head b{font-size:14px;color:var(--kon-text)}
.cmt p.pre{margin:0;font-size:15px;line-height:1.75}
.notice-box{background:var(--surface);border:2px solid var(--caution);border-radius:8px;padding:12px 14px;margin:0 0 16px}
.notice-box h2{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.notice-box ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.notice-box li a{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 10px;padding:8px 6px;border-radius:4px;text-decoration:none;color:var(--ink)}
.notice-box li a:hover{background:var(--paper)}
.notice-box li + li a{border-top:1px solid var(--line)}
.flags-in,.flags{display:flex;flex-wrap:wrap;gap:4px}
.flags{margin:0 0 6px}
.flag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;line-height:1.5;white-space:nowrap}
.flag.blue{background:var(--kon);color:var(--kon-ink)}
.flag.orange{background:var(--caution);color:#1d1600}
.flag.green{background:var(--ok);color:#fff}
.flag.gray{background:var(--line);color:var(--ink)}
.danger-zone{border:2px solid var(--shu)}
.danger-zone h2{color:var(--shu)}
.del-list{border:1px solid var(--line);border-radius:10px;max-height:420px;overflow:auto;background:var(--surface)}
.del-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}
.del-row:first-child{border-top:0}
.del-row:hover{background:var(--paper)}
.del-row input{width:20px;height:20px;flex:none;accent-color:var(--shu)}
.del-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.del-main b{overflow-wrap:anywhere}
.danger-text{color:var(--shu)}
.big-action{font-size:17px;min-height:56px}
.field[hidden]{display:none}
.pri-list{display:flex;flex-wrap:wrap;gap:6px}
.pri-chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.pri-chip.on{background:var(--kon);border-color:var(--kon);color:var(--kon-ink);font-weight:700}
.memo{max-width:560px}
.memo-row{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr) 80px 34px;gap:6px;align-items:center;margin-bottom:6px}
.memo-row select,.memo-row input{padding:9px 6px;font-size:15px;min-width:0}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1220; --surface:#161B2C; --ink:#E8EAF0; --sub:#9AA2B4; --line:#283048;
    --kon:#2B4A94; --kon-text:#9DB5EE; --kon-ink:#FFFFFF; --kon-soft:#1C2540; --kon-deep:#0A1330;
    --shu:#EE5F57; --warn:#E5A800; --warn-soft:#2E2816; --ok:#5BB585;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1220; --surface:#161B2C; --ink:#E8EAF0; --sub:#9AA2B4; --line:#283048;
  --kon:#2B4A94; --kon-text:#9DB5EE; --kon-ink:#FFFFFF; --kon-soft:#1C2540; --kon-deep:#0A1330;
  --shu:#EE5F57; --warn:#E5A800; --warn-soft:#2E2816; --ok:#5BB585;
}
body{font-family:"Helvetica Neue",var(--font)}
h1{font-size:24px;letter-spacing:.02em}
/* ロゴマーク（色はcurrentColorに追従） */
.brand-mark.gp{width:52px;height:32px;border:0;border-radius:0;background:currentColor;
  -webkit-mask:var(--gp) center/contain no-repeat;mask:var(--gp) center/contain no-repeat}
.auth-brand .brand-mark.gp{width:76px;height:47px;background:var(--kon-text);border:0}
.auth-brand b{color:var(--kon-text)}
/* ヘッダー：ネイビー、足元に斜めカットのライン */
.top{background:linear-gradient(100deg,var(--kon-deep) 0%,#142A5E 60%,#1B3A7E 100%);color:#fff;position:relative}
.top::after{content:"";display:block;height:5px;
  background:repeating-linear-gradient(-60deg,rgba(255,255,255,.9) 0 2px,transparent 2px 9px),#142A5E}
.brand b{font-size:16px;letter-spacing:.03em}
.top .link{border-radius:2px;border-color:rgba(255,255,255,.5)}
.admin-nav a{color:rgba(255,255,255,.7)}
.admin-nav a[aria-current="page"]{color:#fff;border-color:#fff}
.badge{background:#fff;color:var(--kon-deep)}
.tabbar a[aria-current="page"]{color:var(--kon-text)}
.tabbar .badge{background:var(--shu);color:#fff}
/* カード：直線的、角をロゴのように斜めにカット */
.panel,.job,.row-item,.empty,.cal,.chat-log,.applicant,.del-list{border-radius:4px;box-shadow:0 1px 2px rgba(13,29,68,.05)}
.job{border-left:0;padding-left:20px;transition:transform .15s,box-shadow .15s}
.job::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--kon)}
.job::after{content:"";position:absolute;right:0;bottom:0;width:22px;height:22px;background:linear-gradient(135deg,transparent 50%,var(--kon) 50%)}
.job:hover,.row-item:hover{border-color:var(--kon-text);transform:translateY(-2px);box-shadow:0 8px 20px rgba(13,29,68,.10)}
.job h3{font-size:18px}
.tag{background:var(--kon-soft);color:var(--kon-text);border-radius:2px;font-weight:700}
.price .num{color:var(--kon-text);font-size:34px}
.price.big .num{font-size:46px}
/* ボタン：ネイビー、右下を斜めカット */
.btn{border-radius:2px;background:var(--kon);border-color:var(--kon);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);transition:filter .12s,transform .08s}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(1px)}
.btn.sub{background:var(--surface);color:var(--kon-text);border:2px solid var(--kon-text);clip-path:none}
.btn.danger{background:var(--surface);border-width:2px;clip-path:none}
.seg a{border-radius:2px}
.seg a[aria-current="true"]{background:var(--kon);border-color:var(--kon)}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=date],input[type=file],select,textarea{border-radius:2px}
input:focus,select:focus,textarea:focus{border-color:var(--kon-text);outline:none;box-shadow:0 0 0 3px var(--kon-soft)}
.checks label{border-radius:2px}
/* 見出し：斜めのスラッシュ */
.panel h2,.detail h2{display:flex;align-items:center;gap:8px;border-left:0;padding-left:0}
.panel h2::before,.detail h2::before{content:"";flex:none;width:8px;height:1.05em;background:var(--kon-text);transform:skewX(-25deg)}
.note{border-left-color:var(--kon-text);background:var(--kon-soft)}
.notice-box{border-color:var(--kon-text);border-radius:4px}
.flag.orange{background:var(--caution)}
.msg-row.me .bubble{background:var(--kon)}
.cal-num.today span{background:var(--kon)}
.track li.next .dot{border-color:var(--kon-text)}
.demo{background:var(--caution)}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body::before{filter:invert(1);opacity:.1}}
:root[data-theme="dark"] body::before{filter:invert(1);opacity:.1}
.panel,.job,.row-item,.cal,.chat-log,.applicant,.del-list{background:color-mix(in srgb,var(--surface) 94%,transparent)}
.empty{background:color-mix(in srgb,var(--surface) 80%,transparent)}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ===== 見やすさ（職人さんは高齢の方が多いので、文字を大きく・パッと見でわかるように。PCは画面を広く使う） ===== */
body{font-size:17px}
.small{font-size:14px}
.lead{font-size:15px}
.kv{font-size:16px;grid-template-columns:7em 1fr}
.meta{font-size:15px}
.tag{font-size:13px;padding:2px 9px}
.panel h2{font-size:18px}
.detail h1{font-size:26px}
@media (min-width:1200px){
  .main,.top-in,.admin-nav{max-width:1280px}
  .list.grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cols{grid-template-columns:1.45fr 1fr;gap:20px}
}
@media (max-width:719px){
  .main{padding-left:12px;padding-right:12px}
  .panel{padding:14px}
  .btn{min-height:50px;font-size:16px}
  .tabbar a{font-size:12px}
  .tabbar svg{width:24px;height:24px}
  .detail h1{font-size:24px}
}
/* 工事の内容（画面用のカード） */
.wlist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.witem{border:1px solid var(--line);border-radius:4px;padding:8px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 14px;align-items:baseline;background:var(--surface)}
.witem .wn{grid-column:1/-1;font-size:17px;font-weight:700;line-height:1.45;word-break:break-word}
.witem .wq{grid-column:1;grid-row:2;font-size:15px;color:var(--sub);font-variant-numeric:tabular-nums}
.witem .wa{grid-column:2;grid-row:2;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ap-items{margin:8px 0 0;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.ap-items summary{cursor:pointer;padding:8px 10px;font-size:15px;list-style:none}
.ap-items summary::-webkit-details-marker{display:none}

.ap-items[open] summary::after{content:"閉じる"}
.ap-items summary::before{content:"▶";display:inline-block;margin-right:6px;font-size:11px;color:var(--kon-text);transition:transform .15s}
.ap-items[open] summary::before{transform:rotate(90deg)}
.ap-list{padding:0 10px 8px}
.ap-grp{padding:6px 0;border-top:1px dashed var(--line)}
.ap-grp > b{font-size:13px;color:var(--kon-text)}
.ap-it{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:2px 8px;font-size:14px;padding:2px 0}
.ap-it > span:first-child{color:var(--ok);font-weight:700}
.ap-it > span:last-child{color:var(--sub);white-space:nowrap}
.ap-it.off{opacity:.4}
.ap-it.off > span:first-child{color:var(--sub)}
.witem.other{opacity:.45;background:var(--paper)}
.witem.other .wa{font-size:12px;font-weight:400;color:var(--sub)}
.witem .wtags{grid-column:1/-1;font-size:13px;color:var(--sub);margin-top:2px}
.witem .wtags b{color:var(--ok)}
.witem .wtags .none{color:var(--warn)}
.witem.pick{grid-template-columns:30px minmax(0,1fr) auto;cursor:pointer}
.witem.pick .w-pick{grid-row:1/3;grid-column:1;width:22px;height:22px;accent-color:var(--kon)}
.witem.pick .wn{grid-column:2/-1}
.witem.pick .wq{grid-column:2}
.witem.pick .wa{grid-column:3}
.witem.pick .wnote{grid-column:2/-1}
.witem.pick.off{opacity:.45;background:var(--paper)}
.zai.tema{border-color:#9A6A12;color:#9A6A12}
.witem .wtema{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.witem.pick .wtema{grid-column:2/-1}
.wtema label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:15px;background:var(--surface);cursor:pointer}
.wtema label:has(input:checked){border-color:var(--kon);background:#EEF3FB;font-weight:700}
.wtema input{accent-color:var(--kon);margin:0}
.i-checks .i-tema{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--sub)}
.i-checks .i-tema input{width:90px;padding:6px 8px;font-size:14px}
.i-checks:not(:has([name=i_zai]:checked)) .i-tema{display:none}
.i-checks .tema-on{font-size:13px;color:#9A6A12;font-weight:700}
.aud-tag{display:inline-block;font-size:12px;font-weight:700;color:#9A6A12;border:1px solid #9A6A12;border-radius:3px;padding:0 6px;margin:0 0 6px}
.aud-pick{display:flex;flex-wrap:wrap;gap:8px;flex-basis:100%;margin-bottom:4px}
.aud-pick label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:var(--surface);cursor:pointer}
.aud-pick label:has(input:checked){border-color:var(--kon);background:#EEF3FB;font-weight:700}
.aud-pick .aud-auto{border-style:dashed;font-size:14px}
.aud-pick .aud-auto select{padding:4px 6px;font-size:14px}
.aud-pick:not(:has([value=priority]:checked)) .aud-auto{display:none}
.reapply{margin-top:8px;padding:8px 10px;border:1px dashed var(--line);border-radius:6px;font-size:14px}
.witem.pick.off .wn{text-decoration:line-through}
.witem .wnote{grid-column:1/-1;font-size:14px;color:var(--sub);word-break:break-word}
.loc{display:inline-block;font-size:13px;font-weight:700;background:var(--kon-soft);color:var(--kon-text);padding:0 8px;border-radius:2px;margin-right:6px;vertical-align:2px;white-space:nowrap}
.zai{display:inline-block;font-size:12px;font-weight:700;border:1.5px solid var(--ok);color:var(--ok);padding:0 6px;border-radius:2px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.wtotal{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px;border-top:2px solid var(--ink);margin-top:10px;padding-top:8px;font-weight:700}
.wtotal .num{font-family:var(--num);font-size:32px;color:var(--kon-text)}
.wtotal small{font-weight:400;color:var(--sub);font-size:14px;margin-left:8px}
/* 現場の情報（大きなマス） */
.stars{color:#E8A317;letter-spacing:1px;white-space:nowrap}
.stars .off{color:#D5D9E0}
.stars small{color:var(--sub);letter-spacing:0;margin-left:4px;font-weight:400}
.stars-in{display:inline-flex;flex-direction:row-reverse;justify-content:flex-end;gap:2px}
.stars-in input{position:absolute;opacity:0;width:1px;height:1px}
.stars-in label{font-size:34px;line-height:1;color:#D5D9E0;cursor:pointer;padding:0 2px}
.stars-in input:checked~label,.stars-in label:hover,.stars-in label:hover~label{color:#E8A317}
.stars-in input:focus-visible+label{outline:2px solid var(--kon);outline-offset:2px}
.money-tool{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 12px}
.money-tool h2{margin:0;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chips a{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;background:var(--surface);color:var(--ink);text-decoration:none}
.chips a[aria-current]{background:var(--kon);border-color:var(--kon);color:#fff;font-weight:700}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.mtbl{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
.mtbl th,.mtbl td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left;vertical-align:top}

}

// 分離発注：選んだ工事を子案件に切り出して発注し、残りの工事は元の案件で募集を続ける
async function splitAssign(jobD, priv, uid, name, ids){
  const pubAll = itemsWithId(jobD.items), privAll = itemsWithId(priv.items?.length ? priv.items : jobD.items);
  const take = list => list.filter(i => ids.includes(i.iid)), keep = list => list.filter(i => !ids.includes(i.iid));
  const selPriv = take(privAll), cats = [...new Set(selPriv.map(i => i.cat).filter(c => c && c !== "その他"))];
  const label = cats.length ? cats.join("・") : selPriv[0].name + (selPriv.length > 1 ? " ほか" : "");
  const child = {title:`${jobD.title}（${label}）`, trades:jobD.trades || [], pref:jobD.pref || "", city:jobD.city || "", startDate:jobD.startDate, endDate:jobD.endDate,
    price:itemsTotal(selPriv), taxMode:jobD.taxMode || "税別", items:take(pubAll), audience:jobD.audience || "all", site:jobD.site || null, staff:jobD.staff || null, jobNo:jobD.jobNo || "",
    description:jobD.description || "", priceNote:"", photos:jobD.photos || [], parentId:jobD.id, status:"closed", publishedAt:jobD.publishedAt || Date.now(),
    allItems:jobD.allItems?.length ? jobD.allItems : pubAll};
  const cid = await api().saveJob(null, child);
  await api().setJobPrivate(cid, {...priv, items:selPriv});
  await api().saveJob(jobD.id, {items:keep(pubAll), price:itemsTotal(keep(privAll)), allItems:jobD.allItems?.length ? jobD.allItems : pubAll});
  await api().setJobPrivate(jobD.id, {...priv, items:keep(privAll)});
  const c = S.crafts.get(uid) || await api().getProfile(uid), childJob = await api().getJob(cid);
  const how = await assignOrPrepay(cid, uid, buildOrderDoc(childJob, {...priv, items:selPriv}, c, await orderExtra(cid)));
  await api().setAppStatus(`${jobD.id}_${uid}`, how === "prepay" ? "waiting" : "selected").catch(e => console.error(e));
  if(how === "prepay"){ toast(`${name} さんを${selPriv.length}件の工事の発注先に選びました。先払いをお願いします`); return go(`#/admin/job/${cid}`); }
  notifyMail(cid, "発注されました", `「${child.title}」をあなたに発注しました。ポータルで発注内容と金額を確認して、「承諾する」を押してください。\n工期：${fmtRange(child.startDate, child.endDate)}`, {to:uid});
  toast(`${name} さんに${selPriv.length}件の工事を発注しました（残りは募集を続けます）`); go(`#/admin/job/${cid}`);
}

async function applyTemaToJob(jobD, priv, ids){
  if(!ids?.length) return;
  const conv = l => l?.length ? temaConv(itemsWithId(l), ids) : l;
  const pub = conv(jobD.items), pv = conv(priv.items);
  if(!(pub || []).some(i => i.tema) && !(pv || []).some(i => i.tema)) return;
  const upd = {items:pub, price:itemsTotal(pv?.length ? pv : pub)};
  if(jobD.allItems?.length) upd.allItems = conv(jobD.allItems);
  await api().saveJob(jobD.id, upd); Object.assign(jobD, upd);
  if(pv?.length){ priv.items = pv; await api().setJobPrivate(jobD.id, priv); }
}

async function revertTemaJob(id){

  if(!j || (!(j.items || []).some(i => i.tema) && !(p.items || []).some(i => i.tema))) return;
  const pub = temaBack(j.items), pv = temaBack(p.items), upd = {items:pub, price:itemsTotal(pv.length ? pv : pub)};
  if(j.allItems?.length) upd.allItems = temaBack(j.allItems);

}

async function unassignChild(job){
  const [parent, ppriv, cpriv] = await Promise.all([api().getJob(job.parentId), api().getJobPrivate(job.parentId).catch(() => ({})), api().getJobPrivate(job.id)]);
  const back = parent && ["open", "closed", "draft"].includes(parent.status);
  const c = S.crafts.get(job.assignedTo);
  if(!await ask({title:"発注を取り消しますか？", body:`${c ? `${c.name} さんへの` : ""}発注を取り消し、発注書を削除します。${back ? "この工事は元の案件に戻り、募集を続けます。" : "元の案件はすでに発注済みなので、この工事は別の案件として「募集中」に戻します。"}`, ok:"取り消す", danger:true})) return;
  if(!job.declinedAt && job.assignedTo) await notifyMail(job.id, "発注が取り消されました", `「${job.title}」の発注を取り消しました。`, {to:job.assignedTo});
  if(!back){ await api().unassign(job.id); toast("発注を取り消して募集に戻しました"); return route(); }
  const pPub = itemsWithId(parent.items), pPriv = itemsWithId(ppriv.items?.length ? ppriv.items : parent.items), cPub = temaBack(itemsWithId(job.items)), cPriv = temaBack(itemsWithId(cpriv.items?.length ? cpriv.items : job.items));
  const back1 = parent.allItems?.length ? {allItems:parent.allItems.map(i => cPub.some(x => x.iid === i.iid) ? temaBack([i])[0] : i)} : {};
  await api().saveJob(parent.id, {items:[...pPub, ...cPub], price:itemsTotal([...pPriv, ...cPriv]), status:parent.status === "closed" ? "open" : parent.status, ...back1});
  await api().setJobPrivate(parent.id, {...ppriv, items:[...pPriv, ...cPriv]});
  await api().setAppStatus(`${parent.id}_${job.assignedTo}`, job.declinedAt ? "declined" : "applied").catch(e => console.error(e));
  await api().deleteJobs([job.id]);

}

/* ---------- 案件PDFの読み込み ---------- */
async function openPdf(file){
  if(!window.pdfjsLib){
    let err;
    for(const base of PDFJS_SOURCES){
      try { await loadScript(base + "build/pdf.min.js"); PDFJS_BASE = base; err = null; break; } catch(e) { err = e; }
    }
    if(err) throw new Error("PDFを表示する部品を読み込めませんでした。通信環境を確認してください");
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + "build/pdf.worker.min.js";
  return pdfjsLib.getDocument({data:await file.arrayBuffer(), cMapUrl:PDFJS_BASE + "cmaps/", cMapPacked:true,
    standardFontDataUrl:PDFJS_BASE + "standard_fonts/", useSystemFonts:true, isEvalSupported:false}).promise;
}
// PDFの各ページを画像にする（Firestoreの1件あたりの上限に収まるよう、大きすぎれば画質を下げる）
// 1ページ＝1件で保存（Firestoreの1件1MBの上限対策）。元のPDFも分割して保存
const PDF_MAX_PAGES = 20, PDF_MAX_CHARS = 900000, PDF_CHUNK = 900000, PDF_MAX_CHUNKS = 12;
async function renderPdfPages(pdf){
  const n = Math.min(pdf.numPages, PDF_MAX_PAGES);
  const steps = api()?.mode === "demo" ? [[1100, 0.72], [900, 0.6]] : [[1800, 0.85], [1500, 0.78], [1200, 0.7], [1000, 0.6]];
  const pages = [];
  for(let i = 1; i <= n; i++){
    const page = await pdf.getPage(i);
    const v1 = page.getViewport({scale:1});
    let url = "";
    for(const [w, q] of steps){
      const vp = page.getViewport({scale:w / Math.max(v1.width, v1.height * 0.75)});
      const c = document.createElement("canvas"); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
      // intent:"print" と ENABLE_STORAGE で、フォーム欄に入力された文字や注釈も画像に焼き込む
      await page.render({canvasContext:ctx, viewport:vp, intent:"print", annotationMode:pdfjsLib.AnnotationMode.ENABLE_STORAGE}).promise;
      url = c.toDataURL("image/jpeg", q);
      c.width = c.height = 0;
      if(url.length <= PDF_MAX_CHARS) break;
    }
    if(url.length > PDF_MAX_CHARS) throw new Error(`${i}ページ目が大きすぎて添付できません`);
    pages.push(url);
  }
  return pages;
}

async function extractPdfText(file, pdf){
  pdf = pdf || await openPdf(file);
  const out = [];
  for(let n = 1; n <= Math.min(pdf.numPages, 5); n++){
    const tc = await (await pdf.getPage(n)).getTextContent();
    const its = tc.items.filter(i => typeof i.str === "string" && i.str !== "").map(i => ({s:i.str, x:i.transform[4], y:i.transform[5], w:i.width || 0, h:Math.abs(i.height || i.transform[3]) || 10}));
    its.sort((a, b) => b.y - a.y || a.x - b.x);
    const lines = [];
    its.forEach(i => {
      const L = lines[lines.length - 1];
      if(L && Math.abs(L.y - i.y) <= Math.max(2, i.h * 0.45)) L.items.push(i); else lines.push({y:i.y, items:[i]});
    });
    lines.forEach(L => {
      L.items.sort((a, b) => a.x - b.x);
      let t = "", end = null;
      L.items.forEach(i => { if(end !== null && i.x - end > i.h * 0.6) t += " "; t += i.s; end = i.x + i.w; });
      out.push(t);
    });
    out.push("");
  }
  return out.join("\n");
}
function findDates(line){
  const now = new Date(), res = [];
  let l = line;
  const push = (y, m, d) => { if(m >= 1 && m <= 12 && d >= 1 && d <= 31) res.push(`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`); };
  l = l.replace(/令和\s*(\d+|元)\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日?/g, (_, y, m, d) => { push(2018 + (y === "元" ? 1 : +y), +m, +d); return " "; });
  l = l.replace(/(20\d{2})\s*[年\/.\-]\s*(\d{1,2})\s*[月\/.\-]\s*(\d{1,2})\s*日?/g, (_, y, m, d) => { push(+y, +m, +d); return " "; });
  l.replace(/(?<!\d)(\d{1,2})\s*月\s*(\d{1,2})\s*日/g, (_, m, d) => { push(+m < now.getMonth() - 1 ? now.getFullYear() + 1 : now.getFullYear(), +m, +d); return " "; });
  return res;
}
function parseJobText(raw){
  const lines = raw.normalize("NFKC").split("\n").map(l => l.replace(/[ \t　]+/g, " ").trim()).filter(Boolean);
  const all = lines.join("\n");
  const r = {items:[], trades:[]};
  const labeled = re => { for(const l of lines){ const m = l.match(re); if(m && m[1] && m[1].trim()) return m[1].trim(); } return ""; };
  const num = v => Number(String(v).replace(/[,¥\s]/g, "")) || 0;

  r.title = labeled(/(?:件名|工事名|案件名|工事件名|作業名称)\s*[:]?\s*(.+)/);
  r.manager = labeled(/管理会社(?:名)?\s*[:]?\s*(.+)/);
  r.keyInfo = labeled(/(?:鍵|キー|入室方法)(?:の受け渡し|情報)?\s*[:]\s*(.+)/);
  let building = labeled(/(?:物件名|建物名|マンション名)\s*[:]?\s*(.+)/);
  const room = labeled(/(?:号室|部屋番号|部屋)\s*[:]\s*(.+)/);

  // 住所：ラベル付きを優先、なければ最初に見つかった住所
  const PREF = /(東京都|神奈川県|埼玉県|千葉県)\s*([^\s\d]+?[市区町村])((?:[^\s\d]+?区)?)/;
  let addrLine = labeled(/(?:現場住所|物件住所|所在地|住所|現場)\s*[:]?\s*((?:東京都|神奈川県|埼玉県|千葉県).+)/) || (lines.find(l => PREF.test(l)) || "");
  if(addrLine){
    const m = addrLine.match(PREF);
    if(m){
      r.pref = m[1]; r.city = m[2] + m[3];
      let addr = addrLine.slice(addrLine.indexOf(m[0])).split(/\s*(?:TEL|電話|FAX)/i)[0].trim();
      const b = addr.match(/\s(\S*(?:マンション|ハイツ|コーポ|レジデンス|アパート|荘|ビル|テラス|メゾン|パレス|ハイム|コート|プラザ|タワー|ハウス)\S*(?:\s*\d+号?室?)?)$/) || addr.match(/\s(\S+\s*\d+号室)$/);
      if(b){ if(!building) building = b[1]; addr = addr.slice(0, b.index).trim(); }
      r.address = addr.replace(/\s+/g, "");
    }
  }
  r.building = [building, room && !building.includes(room) ? room : ""].filter(Boolean).join(" ");

  // 作業日：工期・作業日などの行から
  const dates = [];
  lines.forEach((l, k) => {
    if(/工期|作業日|施工日|着工|完工|作業予定|施工予定|日程|希望日|実施日|工事日/.test(l)){
      let d = findDates(l);
      if(!d.length && lines[k + 1]) d = findDates(lines[k + 1]);
      dates.push(...d);
    }
  });
  if(dates.length){ r.startDate = dates[0]; const e = dates[dates.length - 1]; r.endDate = e > dates[0] ? e : ""; }

  // 作業内訳：「作業名 数量 単位 単価 金額」の並びを拾う
  const UNIT = "式|m2|m|平米|枚|台|箇所|ヶ所|か所|カ所|ケ所|個|本|室|セット|組|日|人工|回|ヶ月|kg|L";
  const reA = new RegExp(`^(?:No\\.?\\s*)?(?:\\d{1,2}[.)]?\\s+)?(.*?[^\\d\\s,].*?)\\s+(\\d+(?:\\.\\d+)?)\\s*(${UNIT})\\s+¥?\\s*([\\d,]+)(?:\\s+¥?\\s*([\\d,]+))?`);
  const reB = /^(?:\d{1,2}[.)]?\s+)?(.*?[^\d\s,].*?)\s+(\d+(?:\.\d+)?)\s+¥?\s*([\d,]{3,})\s+¥?\s*([\d,]{3,})\s*$/;
  lines.forEach(l => {
    if(/合計|小計|消費税|税込|値引|総額|見積金額|請求金額|発注金額|振込|口座/.test(l)) return;
    let m = l.match(reA);
    if(m){ r.items.push({name:m[1].trim(), qty:+m[2], unit:m[3] === "m2" || m[3] === "平米" ? "㎡" : m[3], unitPrice:num(m[4])}); return; }
    m = l.match(reB);
    if(m) r.items.push({name:m[1].trim(), qty:+m[2], unit:"式", unitPrice:num(m[3])});
  });
  r.items = r.items.filter(i => i.unitPrice > 0 && i.name.length <= 60);

  // 金額と税区分
  const sub = labeled(/小計\s*[:]?\s*¥?\s*([\d,]{3,})/);
  const tot = labeled(/(?:合計金額|合計|総額|御見積金額|見積金額|発注金額|請負金額)\s*(?:\(税込\)|\(税抜\)|\(税別\))?\s*[:]?\s*¥?\s*([\d,]{3,})/);
  if(r.items.length){ r.price = itemsTotal(r.items); r.taxMode = "税別"; }
  else if(sub){ r.price = num(sub); r.taxMode = "税別"; }
  else if(tot){ r.price = num(tot); r.taxMode = /税込/.test(all) && !/税抜|税別/.test(all) ? "税込" : "税別"; }

  // 工種
  const T = [["エアコンクリーニング", /エアコン/], ["クロス張替え", /クロス|壁紙/], ["床（CF・フロアタイル）", /CF|クッションフロア|フロアタイル|フローリング/],
    ["塗装", /塗装/], ["設備交換", /交換|取替|取り替え|取付/], ["簡易修繕", /補修|修繕|修理|網戸/], ["退去立会", /立会/]];
  T.forEach(([t, re]) => { if(re.test(all)) r.trades.push(t); });
  if(/(ハウス|ルーム|室内|退去|美装)\s*クリーニング|清掃|美装/.test(all) || (/クリーニング/.test(all) && !r.trades.includes("エアコンクリーニング"))) r.trades.unshift("ハウスクリーニング");

  // 作業内容・備考
  const notes = [];
  lines.forEach(l => { const m = l.match(/^(?:作業内容|工事内容|備考|特記事項|注意事項|連絡事項)\s*[:]?\s*(.+)/); if(m) notes.push(m[1].trim()); });
  r.description = notes.length ? notes.join("\n") : r.items.length ? r.items.map(i => `・${i.name}`).join("\n") : "";
  if(!r.title && r.items.length) r.title = r.items[0].name + (r.items.length > 1 ? " ほか" : "");
  return r;
}
async function importPdf(input){
  const file = input.files[0]; if(!file) return;
  const form = input.closest("form"), box = form.querySelector("#pdf-result");
  box.innerHTML = `<p class="small">「${esc(file.name)}」を読み込んでいます…</p>`;
  try {
    const pdf = await openPdf(file);
    const src = await blobToDataURL(file);
    S.editPdf = {name:file.name, pages:await renderPdfPages(pdf), addedAt:Date.now()};
    S.editPdfSrc = src.length <= PDF_CHUNK * PDF_MAX_CHUNKS ? {name:file.name, data:src} : null; S.editPdfChanged = true;

    if(!form.elements.title.value.trim()){ form.elements.title.value = file.name.replace(/\.pdf$/i, ""); form.elements.title.dataset.auto = "1"; }

  } finally { input.value = ""; }
}

function resizeImage(file, max = 1280, q = 0.75){
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error("画像を変換できませんでした")), "image/jpeg", q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error(`「${file.name}」を画像として読み込めませんでした`)); };
    img.src = url;
  });
}
const blobToDataURL = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });

    try { this.session = sessionStorage.getItem(this.key + "_session"); } catch(e) { this.session = null; }
    window.addEventListener("storage", e => { if(e.key !== this.key || !e.newValue) return; try { this.data = JSON.parse(e.newValue); this.fire(); } catch(err) {} });
    this.save();
  }
  save(){ try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch(e) {} this.fire(); }
  fire(){ clearTimeout(this._ft); this._ft = setTimeout(() => this.watchers.forEach(f => { try { f(); } catch(e) { console.error(e); } }), 0); }
  setSession(uid){ this.session = uid; try { if(uid) sessionStorage.setItem(this.key + "_session", uid); else sessionStorage.removeItem(this.key + "_session"); } catch(e) {} }
  emit(){
    const s = this.session;
    const u = s && this.data.accounts[s] ? {uid:s, email:this.data.accounts[s].email} : null;
    this.listeners.forEach(f => f(u));

  async deleteJobs(ids, progress){ S.ldCache = null;

function authError(e){
  const m = {
    "auth/email-already-in-use":"このメールアドレスはすでに登録されています",
    "auth/invalid-email":"メールアドレスの形式が正しくありません",
    "auth/weak-password":"パスワードは6文字以上にしてください",
    "auth/invalid-credential":"メールアドレスかパスワードが違います",
    "auth/wrong-password":"メールアドレスかパスワードが違います",
    "auth/user-not-found":"メールアドレスかパスワードが違います",
    "auth/too-many-requests":"試行回数が多すぎます。しばらく待ってからお試しください",
    "auth/network-request-failed":"通信できませんでした。電波の良い場所でお試しください"
  };
  return new Error(m[e.code] || e.message);
}
class FirebaseBackend {
  constructor(){
    this.mode = "firebase";
    firebase.initializeApp(FIREBASE_CONFIG);
    this.auth = firebase.auth(); this.db = firebase.firestore();
    try { this.db.settings({ignoreUndefinedProperties:true, merge:true}); } catch(e) { console.warn(e); }
    this.db.enablePersistence({synchronizeTabs:true}).catch(e => console.warn("端末への保存は使いません：", e.code || e));
    this.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(e => console.error(e));
    // 書き込み（save・set・assign…）をしたら、覚えている全案件を捨てる
    const proto = Object.getPrototypeOf(this);
    Object.getOwnPropertyNames(proto).filter(k => typeof proto[k] === "function" && /^(save|set|assign|unassign|delete|update|accept|decline|request|cancel|confirm|wipe|apply|withdraw|submit|create|remove|add|send|ensure|mark|react|upload)/.test(k))
      .forEach(k => { const f = proto[k]; this[k] = (...a) => { this._jl = null; return f.apply(this, a); }; });
  }
  col(n){ return this.db.collection(n); }
  docs(s){ return s.docs.map(d => ({id:d.id, ...d.data()})); }
  // 工務店のときは companies/{cid}/… の中（見積・請求・収支・評価・設定など）
  scol(n){ return tenant() ? this.db.collection("companies").doc(S.cid).collection(n) : this.db.collection(n); }
  smaster(id){ return this.scol("master").doc(id); }
  // 案件・応募・チャット・完了報告・請求書は、工務店なら自社の分だけを読む（ルールもそうなっている）
  scoped(q, name){ return tenant() && SCOPED_COLS.includes(name) ? q.where("companyId", "==", S.cid) : q; }
  onAuth(cb){ this.auth.onAuthStateChanged(u => cb(u ? {uid:u.uid, email:u.email} : null)); }
  async signUp(email, pw){ try { await this.auth.createUserWithEmailAndPassword(email.trim(), pw); } catch(e) { throw authError(e); } }
  async signIn(email, pw, remember = true){
    try {
      const P = firebase.auth.Auth.Persistence;
      await this.auth.setPersistence(remember ? P.LOCAL : P.SESSION).catch(() => {});
      await this.auth.signInWithEmailAndPassword(email.trim(), pw);
    } catch(e) { throw authError(e); }
  }
  async signOut(){ await this.auth.signOut(); }
  async resetPassword(email){ try { await this.auth.sendPasswordResetEmail(email.trim()); } catch(e) { throw authError(e); } }
  async getIdToken(){ return this.auth.currentUser.getIdToken(); }
  // 写真は Firebase ではなく、Apps Script 経由で Reforeの Googleドライブに保存する
  async uploadReportPhoto(body){
    const r = await fetch(PHOTO_UPLOAD_URL, {method:"POST", body:JSON.stringify(body)});   // ヘッダーを付けない（Apps Scriptの仕様に合わせる）
    let j; try { j = await r.json(); } catch(e) { throw new Error("写真の受け口から正しい応答がありません"); }
    if(!j.ok) throw new Error(j.error || "写真を送れませんでした");
    return j;
  }

  async createProfile(uid, d){ await this.col("users").doc(uid).set(d); if(d.role === "craftsman" && !d.employee) this.upsertPubCraft(uid, d).catch(e => console.warn(e)); }
  async updateProfile(uid, d){ await this.col("users").doc(uid).update(d);
    if(uid === S.user?.uid && S.profile?.role === "craftsman" && !S.profile?.employee) this.upsertPubCraft(uid, {...S.profile, ...d}).catch(e => console.warn(e)); }
  async listCraftsmen(){

  // 工務店・運営が見る、職人さんの公開用の登録情報（振込先などは入れない）
  async upsertPubCraft(uid, d){ await this.col("pubcrafts").doc(uid).set(pubCraftFields(d), {merge:true}); }

  async listJobs(f = {}){
    let q = this.scoped(this.col("jobs"), "jobs");
    if(f.status) q = q.where("status", "==", f.status);
    if(f.assignedTo) q = q.where("assignedTo", "==", f.assignedTo);
    if(f.audience) q = q.where("audience", "==", f.audience);
    // 既存業者（Refore）の「募集中」は Refore の案件だけを聞く（工務店の案件は下で別に読む）
    if(myRole() === "craftsman" && f.status === "open" && !f.audience) q = q.where("companyId", "==", COMPANY_ID);
    const all = myRole() === "admin" && !f.status && !f.assignedTo && !f.audience;
    if(all && this._jl && this._jl.cid === S.cid && Date.now() - this._jl.at < 8000) return [...await this._jl.p];
    const pr = q.get().then(s => this.docs(s));
    if(all) this._jl = {at:Date.now(), cid:S.cid, p:pr.catch(e => { this._jl = null; throw e; })};
    let list = await pr;
    if(myRole() === "admin") return scopeList(list);
    // 職人：工務店が「既存業者のみ」に出した案件は、その工務店の既存業者だけに見える
    if(f.status === "open"){
      const me = S.user?.uid;
      const qs = [this.col("jobs").where("status", "==", "open").where("priCrafts", "array-contains", me)];
      if(!f.audience) qs.push(this.col("jobs").where("status", "==", "open").where("audience", "==", "all"));
      for(const r of await Promise.all(qs.map(x => x.get().catch(() => ({docs:[]}))))) this.docs(r).forEach(j => { if(!list.some(x => x.id === j.id)) list.push(j); });
      list = list.filter(j => isRefJob(j) || j.audience !== "priority" || (j.priCrafts || []).includes(me));
    }
    return list;
  }
  async getJob(id){
    try { const s = await this.col("jobs").doc(id).get(); return s.exists ? {id:s.id, ...s.data()} : null; }
    catch(e) { if(e.code === "permission-denied") return null; throw e; }
  }
  async saveJob(id, d){ S.ldCache = null;
    d = coJobPatch(d, !id);
    if(d.status === "open") await coPostGuard(id, d);
    if(!id){ const ref = this.col("jobs").doc(); await ref.set({...d, companyId:coId(), assignedTo:null, createdAt:Date.now(), updatedAt:Date.now()}); return ref.id; }
    await this.col("jobs").doc(id).update({...d, updatedAt:Date.now()}); return id;
  }
  async setJobStatus(id, status){ S.ldCache = null; const x = {};
    if(status === "open") await coPostGuard(id, x);
    await this.col("jobs").doc(id).update({status, ...stampFor(status), ...x, updatedAt:Date.now()}); }
  // 業者が自分で押す「作業開始」「作業完了」（ルールで許可された項目だけを更新）
  async setWorkProgress(id, status, extra = {}){ await this.col("jobs").doc(id).update({status, ...stampFor(status), ...extra, updatedAt:Date.now()}); }
  async acceptOrder(id){ await this.col("jobs").doc(id).update({acceptedAt:Date.now(), updatedAt:Date.now()}); }
  async declineOrder(id, reason){ await this.col("jobs").doc(id).update({declinedAt:Date.now(), declineReason:reason, updatedAt:Date.now()}); }
  // 発注を取り消して募集に戻す（辞退されたときなど）。発注書を消し、ほかの応募者は「応募中」に戻す
  async unassign(jobId){ S.ldCache = null;
    const F = firebase.firestore.FieldValue, ref = this.col("jobs").doc(jobId);
    const job = (await ref.get()).data() || {}, uid = job.assignedTo;
    const apps = await this.scoped(this.col("applications"), "applications").where("jobId", "==", jobId).get();
    if(tenant() && job.payId){ const p = await this.col("payments").doc(job.payId).get().catch(() => null); if(p?.exists && p.data().status === "held") await p.ref.update({status:"refund", refundAt:Date.now()}); }
    const b = this.db.batch();
    b.update(ref, {status:"open", assignedTo:null, assignedAt:F.delete(), acceptedAt:F.delete(), declinedAt:F.delete(), declineReason:F.delete(), craftStart:F.delete(), craftEnd:F.delete(), updatedAt:Date.now()});
    b.delete(this.col("documents").doc(`${jobId}_order`));
    apps.forEach(s => { const a = s.data();
      if(a.craftsmanId === uid && a.status === "selected") b.update(s.ref, {status:"declined", updatedAt:Date.now()});
      else if(a.status === "rejected") b.update(s.ref, {status:"applied", updatedAt:Date.now()}); });
    await b.commit();
  }
  async setCraftDates(id, d){ await this.col("jobs").doc(id).update({craftStart:d.craftStart, craftEnd:d.craftEnd, updatedAt:Date.now()}); }
  async getDocument(id){
    try { const s = await this.col("documents").doc(id).get(); return s.exists ? {id:s.id, ...s.data()} : null; }
    catch(e) { if(e.code === "permission-denied") return null; throw e; }
  }
  async saveDocument(doc){ await this.col("documents").doc(doc.id).set(doc); }
  async updateDocument(id, d){ await this.col("documents").doc(id).update(d); }
  // 現場情報（発注先と管理者が読める）。管理会社だけは admin/info（管理者だけが読める）に分けて保存し、管理者が読むときに合わせる
  async getJobPrivate(id){
    const j = this.col("jobs").doc(id);
    const s = await j.collection("private").doc("detail").get(), d = s.exists ? s.data() : {};
    if(myRole() === "admin"){
      try { const a = await j.collection("admin").doc("info").get(); if(a.exists && "manager" in a.data()) d.manager = a.data().manager; } catch(e) { console.error(e); }
    } else delete d.manager;
    return d;
  }
  // 以前の案件は発注先も読める detail に管理会社が入っているので、admin/info に移す（管理者が案件を開いたとき）
  async moveManager(id){
    const j = this.col("jobs").doc(id), s = await j.collection("private").doc("detail").get();
    if(!s.exists || !("manager" in s.data())) return;
    const a = await j.collection("admin").doc("info").get();
    if(!a.exists || !("manager" in a.data())) await j.collection("admin").doc("info").set({manager:s.data().manager || ""}, {merge:true});
    await j.collection("private").doc("detail").update({manager:firebase.firestore.FieldValue.delete()});
  }
  // 案件PDF（募集中は承認済みの業者全員、発注後は発注先が見られる）
  // files/pdf に目次、files/page_000… に各ページの画像、files/src_000… に元のPDFを分割して保存
  async getJobPdf(id, {withSrc = false} = {}){
    const files = this.col("jobs").doc(id).collection("files"), ID = firebase.firestore.FieldPath.documentId();
    let meta;
    try { const m = await files.doc("pdf").get(); meta = m.exists ? m.data() : null; }
    catch(e) { if(e.code === "permission-denied") return null; throw e; }
    if(!meta) return null;
    if(meta.pages) return {...meta, jobId:id};   // 以前の形式
    const range = async pre => (await files.where(ID, ">=", pre).where(ID, "<", pre + "~").get()).docs.sort((a, b) => a.id.localeCompare(b.id)).map(d => d.data().data);
    const key = `${id}_${meta.addedAt}`, cache = (S.pdfCache ||= {});
    const pages = cache[key]?.pages || await range("page_");
    let src = cache[key]?.src || null;
    if(withSrc && !src && meta.srcChunks){ const chunks = await range("src_"); if(chunks.length === meta.srcChunks) src = {name:meta.name, data:chunks.join("")}; }
    cache[key] = {pages, src};

  // 案件データの一括削除（協力業者・物件マスタは残す）
  async wipeJobData(progress){
    let total = 0, refs = [];
    const flush = async () => { while(refs.length){ const b = this.db.batch(); refs.splice(0, 400).forEach(r => b.delete(r)); await b.commit(); } };
    const jobs = await this.col("jobs").get();
    let i = 0;
    for(const j of jobs.docs){
      progress?.(`案件を削除しています… ${++i} / ${jobs.size}`);
      for(const sub of ["files", "private", "admin"]){ const s = await j.ref.collection(sub).get(); s.docs.forEach(d => refs.push(d.ref)); }
      refs.push(j.ref);
      if(refs.length > 300){ total += refs.length; await flush(); }
    }
    total += refs.length; await flush();
    const threads = await this.col("threads").get();
    for(const t of threads.docs){
      const m = await t.ref.collection("messages").get(); m.docs.forEach(d => refs.push(d.ref)); refs.push(t.ref);
      if(refs.length > 300){ total += refs.length; await flush(); }
    }
    progress?.("チャットを削除しています…"); total += refs.length; await flush();
    for(const c of ["applications", "reports", "documents", "invoices"]){
      progress?.(`${{applications:"応募", reports:"完了報告", documents:"発注書", invoices:"請求書"}[c]}を削除しています…`);
      const s = await this.col(c).get(); s.docs.forEach(d => refs.push(d.ref)); total += refs.length; await flush();
    }
    progress?.("削除が完了しました");
    return {jobs:jobs.size, total};
  }
  // 選んだ案件だけ削除（応募・完了報告・発注書・連絡も一緒に。請求書は記録として残す）
  async deleteJobs(ids, progress){ S.ldCache = null;
    let total = 0, refs = [], i = 0;
    const flush = async () => { while(refs.length){ const b = this.db.batch(); const part = refs.splice(0, 400); part.forEach(r => b.delete(r)); await b.commit(); total += part.length; } };
    for(const id of ids){
      progress?.(`案件を削除しています… ${++i} / ${ids.length}`);
      const ref = this.col("jobs").doc(id);
      for(const sub of ["files", "private", "admin"]){ const s = await ref.collection(sub).get(); s.docs.forEach(d => refs.push(d.ref)); }
      for(const c of ["applications", "reports"]){ const s = await this.scoped(this.col(c), c).where("jobId", "==", id).get(); s.docs.forEach(d => refs.push(d.ref)); }
      for(const k of ["order", "payment"]){ const s = await this.col("documents").doc(`${id}_${k}`).get().catch(() => null); if(s?.exists) refs.push(s.ref); }
      const th = await this.scoped(this.col("threads"), "threads").where("jobId", "==", id).get();
      for(const t of th.docs){ const m = await t.ref.collection("messages").get(); m.docs.forEach(d => refs.push(d.ref)); refs.push(t.ref); }
      refs.push(ref);
      if(refs.length > 300) await flush();
    }
    await flush();
    progress?.("削除が完了しました");
    return {jobs:ids.length, total};
  }

  watch(name, where, cb){
    const admin = myRole() === "admin";
    let q = admin ? this.scoped(this.col(name), name) : this.col(name);
    where.forEach(([f, op, v]) => { q = q.where(f, op, v); });
    const fix = l => admin && SCOPED_COLS.includes(name) ? scopeList(l) : l;
    // 職人の「募集中」：工務店が既存業者のみに出した案件も合わせる
    const isOpen = !admin && name === "jobs" && where.some(([f, op, v]) => f === "status" && v === "open");
    if(!isOpen) return q.onSnapshot(s => cb(fix(this.docs(s))), e => console.error("更新の受信に失敗：" + name, e));
    const me = S.user?.uid, got = [[], [], []];
    const out = () => { const m = new Map(); got.flat().filter(j => isRefJob(j) || j.audience !== "priority" || (j.priCrafts || []).includes(me)).forEach(j => m.set(j.id, j)); cb([...m.values()]); };
    const qs = [q, this.col("jobs").where("status", "==", "open").where("priCrafts", "array-contains", me)];
    if(!where.some(([f]) => f === "audience")) qs.push(this.col("jobs").where("status", "==", "open").where("audience", "==", "all"));
    const us = qs.map((x, i) => x.onSnapshot(s => { got[i] = this.docs(s); out(); }, e => console.warn("案件の受信に失敗：" + name, e)));
    return () => us.forEach(u => u());
  }

    const F = firebase.firestore.FieldValue, ref = this.col("jobs").doc(jobId), j = (await ref.get()).data() || {}, uid = j.selectedTo;
    const b = this.db.batch();
    if(j.payId){ const p = await this.col("payments").doc(j.payId).get().catch(() => null); if(p?.exists && p.data().status === "waiting") b.delete(p.ref); }
    b.delete(this.col("documents").doc(`${jobId}_order`));
    const a = await this.col("applications").doc(`${jobId}_${uid}`).get().catch(() => null);
    if(a?.exists && a.data().status === "waiting") b.update(a.ref, {status:"applied", updatedAt:Date.now()});
    b.update(ref, {status:"open", selectedTo:F.delete(), selectedAt:F.delete(), payId:F.delete(), updatedAt:Date.now()});
    await b.commit();
  }
  async confirmPrepay(payId){
    const F = firebase.firestore.FieldValue, p = (await this.col("payments").doc(payId).get()).data(), uid = p.craftsmanId;
    const apps = await this.col("applications").where("jobId", "==", p.jobId).get();
    const b = this.db.batch();
    b.update(this.col("jobs").doc(p.jobId), {status:"assigned", assignedTo:uid, assignedAt:Date.now(), selectedTo:F.delete(), selectedAt:F.delete(), updatedAt:Date.now()});
    b.update(this.col("documents").doc(`${p.jobId}_order`), {status:"issued", issuedAt:Date.now()});
    apps.forEach(s => { const a = s.data(); if(["applied", "waiting"].includes(a.status)) b.update(s.ref, {status:a.craftsmanId === uid ? "selected" : "rejected", updatedAt:Date.now()}); });
    b.update(this.col("payments").doc(payId), {status:"held", confirmedAt:Date.now()});
    await b.commit();
  }
}

function staffCanon(name){

  const full = (S.staff || []).map(p => p.name).filter(Boolean);
  const same = full.find(n => staffKey(n) === k); if(same) return same;

// CSV（Numbers の「表 1」「工事一覧表」を書き出したもの）を読む
function parseCsv(text){
  const rows = []; let row = [], cell = "", q = false;
  text = text.replace(/^﻿/, "");
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; continue; }
    if(ch === '"') q = true; else if(ch === ","){ row.push(cell); cell = ""; } else if(ch === "\n" || ch === "\r"){ if(ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; } else cell += ch;
  }
  if(cell || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
const yenNum = v => Number(String(v || "").replace(/[^\d.\-]/g, "")) || 0;
function ledgerFromCsv(text, company, ki){
  const rows = parseCsv(text), h = rows.findIndex(r => r.includes("物件名称"));
  if(h < 0) throw new Error("「物件名称」の見出しがある表のCSVを選んでください（Numbersの工事一覧の表を書き出したもの）");
  const head = rows[h].map(x => x.trim()), col = n => head.indexOf(n), months = kiMonths(ki);
  const sCol = head.indexOf("完了･雑工事"), netCol = head.findIndex(x => /^-\d+%$|^手数料後$/.test(x));
  const feeCols = head.map((x, i) => x === "作業金額" ? i : -1).filter(i => i >= 0);
  const num = v => /\d/.test(String(v || "")) ? yenNum(v) : undefined;
  const out = [];
  rows.slice(h + 1).forEach(r => {
    const g = n => (col(n) >= 0 ? String(r[col(n)] || "") : "").replace(/　/g, " ").trim();
    const name = g("物件名称"); if(!name) return;
    const vendors = [];
    for(let k = 1; k <= 10; k++){ const vn = g("発注業者" + k), va = yenNum(g("発注金額" + k)); if(vn || va) vendors.push({name:vn || "発注先", amount:va}); }
    const m = Math.round(Number(g("完了月"))), month = m >= 1 && m <= 12 ? months.find(x => Number(x.slice(5)) === m) : "";
    const cancel = /キャンセル/.test(g("請負金額"));
    // 完了月がある行（Numbersで完了済み）は請求済みとして扱う。完了月が空の行は進行中の案件
    const contract0 = cancel ? 0 : yenNum(g("請負金額"));
    out.push({id:"l_" + newId(), ord:out.length, manual:true, billedOutside:!!month, stage:month ? "" : (cancel ? "lost" : contract0 ? "won" : ""), ki, month:month || "", jobNo:g("工事番号"), name, company, contract:cancel ? 0 : yenNum(g("請負金額")), kind:g("工事種類"), staff:g("立会担当"),
      staff2:sCol >= 0 ? String(r[sCol] || "").replace(/　/g, " ").trim() : "", vendors, note:[cancel ? "キャンセル" : "", g("備考")].filter(Boolean).join(" "),
      arranged:/☑|✓|TRUE/i.test(g("手配")), done:/☑|✓|TRUE/i.test(g("完了")),
      ...(netCol >= 0 && num(r[netCol]) !== undefined ? {netOv:num(r[netCol])} : {}),
      // 作業金額の列がある表は、空欄も0円としてそのまま使う
      ...(feeCols[0] !== undefined ? {staffFeeOv:num(r[feeCols[0]]) || 0} : {}),
      // Numbers の Refore は「立会」と「完了･雑工事」の作業金額だけを引く（3つ目の作業金額の列は引かない）
      ...(feeCols.length > 1 ? {staff2FeeOv:num(r[feeCols[1]]) || 0} : {})});
  });
  return out;
}
function ledgerCsv(rows){
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const head = ["完了月", "工事番号", "物件名称", "管理会社", "請負金額", "手数料後", "利益", "利益率", "手配", "完了", "工事種類", "立会担当", "作業金額", "完了･雑工事", "作業金額", ...Array.from({length:10}, (_, k) => [`発注業者${k + 1}`, `発注金額${k + 1}`]).flat(), "Refore", "利益率", "備考"];
  const lines = rows.map(r => [r.month ? Number(r.month.slice(5)) : "", r.jobNo, r.name, r.coName || r.company, r.contract || "", r.net || "", r.profit, pct(r.rate), r.arranged ? "☑" : "☐", r.done ? "☑" : "☐", r.kind, r.staff, r.staffFee || "", r.staff2, r.staff2Fee || "",
    ...Array.from({length:10}, (_, k) => [r.vendors?.[k]?.name || "", r.vendors?.[k]?.amount ?? ""]).flat(), r.refore, pct(r.reforeRate), r.note]);
  return "﻿" + [head, ...lines].map(l => l.map(q).join(",")).join("\r\n");
}

const STATUS_STAMP = {draft:["下書", true], closed:["締切", true], selected:["支払待", false], assigned:["発注済", false], working:["作業中", false], finished:["完了", false], completed:["確認済", false], paid:["支払済", true]};
const statusStamp = j => STATUS_STAMP[j.status] ? stamp(STATUS_STAMP[j.status][0], STATUS_STAMP[j.status][1]) : "";
const STEPS = [["募集開始","publishedAt"],["発注","assignedAt"],["承諾","acceptedAt"],["作業開始","startedAt"],["作業完了","finishedAt"],["完了報告",null],["完了確認","completedAt"],["支払","paidAt"]];
const STAGE = {draft:-1, open:0, closed:0, selected:0, assigned:1, working:3, finished:4, completed:6, paid:7};
const stageOf = job => { const st = STAGE[job.status] ?? -1; return job.status === "assigned" && job.acceptedAt ? 2 : st; };
function progressTrack(job, reports = []){
  const rep = reports.filter(r => r.jobId === job.id && r.status !== "returned").sort((a, b) => b.createdAt - a.createdAt)[0];
  let stage = stageOf(job);
  if(stage === 4 && rep) stage = 5;
  const times = STEPS.map(([, k], i) => k ? job[k] : rep?.createdAt);
  if(!times[0]) times[0] = job.createdAt;
  return `<section class="panel"><h2>進捗</h2><ol class="track">${STEPS.map(([l], i) => {
    const cls = i <= stage ? "done" : i === stage + 1 ? "next" : "";
    const tm = i <= stage ? (fmtFull(times[i]) || "済") : i === stage + 1 ? "次はここ" : "";
    return `<li class="${cls}"><span class="dot" aria-hidden="true"></span><span class="lbl">${l}</span><span class="tm">${tm}</span></li>`;
  }).join("")}</ol></section>`;
}
function progressMini(job){
  const stage = stageOf(job);
  if(stage < 0) return "";
  return `<span class="mini" aria-hidden="true">${STEPS.map((_, i) => `<i class="${i <= stage ? "on" : ""}"></i>`).join("")}</span>`;
}

const dataUrlToBlob = u => { const [h, b] = u.split(","); const bin = atob(b); const a = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], {type:h.match(/data:([^;]+)/)?.[1] || "application/pdf"}); };

// 職人さん：自分が受けた工事の予定表（入る日が決まっていれば入る日、まだなら工期）
async function viewMySchedule(ym){
  const now = new Date(); let [y, m] = String(ym || "").split("-").map(Number);
  if(!y || !m){ y = now.getFullYear(); m = now.getMonth() + 1; }
  const all = (await api().listJobs({assignedTo:S.user.uid})).sort((a, b) => (a.startDate || "").localeCompare(b.startDate || ""));
  const jobs = all.filter(j => j.startDate && j.status !== "draft");
  const first = isoOf(new Date(y, m - 1, 1).getTime()), last = isoOf(new Date(y, m, 0).getTime());
  const gridStart = addDays(first, -new Date(y, m - 1, 1).getDay()), gridEnd = addDays(last, 6 - new Date(y, m, 0).getDay());
  const list = jobs.map(j => { const w = workDays(j); return {...j, startDate:w.start, endDate:w.end, fixed:!!j.craftStart || !!j.startedAt}; }).filter(j => j.startDate <= gridEnd && j.endDate >= gridStart);
  const today = todayIso(), mm = `${y}-${String(m).padStart(2, "0")}`, url = v => `#/schedule/${v}`;
  let weeks = "";
  for(let ws = gridStart; ws <= gridEnd; ws = addDays(ws, 7)){
    const we = addDays(ws, 6), lanes = [];
    const bars = list.filter(j => j.startDate <= we && j.endDate >= ws).sort((a, b) => a.startDate.localeCompare(b.startDate)).map(j => {
      const cs = Math.max(0, dayDiff(ws, j.startDate)) + 1, ce = Math.min(6, dayDiff(ws, j.endDate)) + 1;
      let lane = lanes.findIndex(end => end < cs); if(lane < 0){ lane = lanes.length; lanes.push(0); } lanes[lane] = ce;
      const isS = j.startDate >= ws, isE = j.endDate <= we, cls = !j.fixed ? "c-closed" : (CAL_CLASS[j.status] || "");

// 入る日（なければ工期の初日）の17時を過ぎても「作業を開始する」が押されていない案件
const startDayOf = j => j.craftStart || j.startDate || "";
function lateState(j){
  if(j.status !== "assigned" || j.startedAt || !j.acceptedAt) return "";
  const day = startDayOf(j), today = todayIso(); if(!day) return "";
  if(day < today || (day === today && new Date().getHours() >= 17)) return "late";
  if(day === today) return "today";
  return "";
}
function lateNotes(jobs, admin){
  const late = (jobs || []).filter(j => lateState(j) === "late"), soon = admin ? [] : (jobs || []).filter(j => lateState(j) === "today");
  const who = j => { const c = S.crafts?.get(j.assignedTo); return c ? `（${esc(c.tradeName || c.name)}）` : ""; };
  const link = j => `<a href="${admin ? "#/admin/job/" : "#/work/"}${esc(j.id)}">${esc(j.title)}</a>${admin ? who(j) : ""}　入る日 ${fmtDay(startDayOf(j))}`;
  return `${late.length ? `<div class="alert-box"><b>⚠ 作業開始が押されていません（${late.length}件）</b><p>${admin ? "入る日の17時を過ぎても、業者が「作業を開始する」を押していない案件です。業者に確認してください。" : "入る日の17時を過ぎています。作業を始めている場合は、受注のページで「作業を開始する」を押してください。"}</p><ul>${late.map(j => `<li>${link(j)}</li>`).join("")}</ul></div>` : ""}

}

function rpProgress(done, total, msg){
  const box = $("#rp-progress"); if(!box) return;
  box.hidden = false;
  box.querySelector("i").style.width = (total ? Math.round(done / total * 100) : 0) + "%";
  box.querySelector("p").textContent = msg || `写真を送っています… ${done} / ${total}枚（画面を閉じないでください）`;

async function uploadReportPhotos(jobId, files, label){
  const pad = n => String(n).padStart(3, "0"), stamp = todayIso().replace(/-/g, "");
  let done = 0, folderUrl = "", next = 0;
  const failed = [], base = S.reportSentBase || 0;
  rpProgress(0, files.length);
  const work = async () => {
    while(next < files.length){
      const i = next++, file = files[i];
      let ok = false, lastErr;
      for(let t = 0; t < 3 && !ok; t++){
        try {
          const blob = await resizeImage(file, PHOTO_PX, PHOTO_Q);
          const data = (await blobToDataURL(blob)).split(",")[1];
          const r = await api().uploadReportPhoto({idToken:await api().getIdToken(), jobId, folderLabel:label, fileName:`${stamp}_${pad(base + i + 1)}.jpg`, mime:"image/jpeg", data});
          folderUrl = r.folderUrl || folderUrl; ok = true;
        } catch(e) { lastErr = e; await new Promise(r => setTimeout(r, 800 * (t + 1))); }
      }
      if(ok) done++; else failed.push({file, err:lastErr});
      rpProgress(done, files.length);
    }
  };
  await Promise.all(Array.from({length:Math.min(PHOTO_PARALLEL, files.length)}, work));
  return {done, failed, folderUrl};
}

  const subject = `【完了報告】${job.title}（案件番号 ${job.id}）`;
  const body = [
    "株式会社Refore 御中", "",
    "下記案件の作業が完了しましたので報告します。", "",
    `案件番号：${job.id}`,
    `案件名：${job.title}`,
    `現場：${priv.address || (job.pref || "") + (job.city || "")} ${priv.building || ""}`.trim(),
    `作業日：${fmtRange(job.startDate, job.endDate)}`, "",
    "■ 報告内容（気になった箇所・追加で必要な補修など）", "", "", "",
    "■ 写真：施工前・施工後を添付しています", "",
    "――――――――――",
    `${p.name}${p.tradeName ? "（" + p.tradeName + "）" : ""}`,
    `電話：${p.phone || ""}`
  ].join("\n");
  return `mailto:${REPORT_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

const ADMIN_GROUPS = {open:["open"], active:["selected","assigned","working","finished"], unpaid:["completed"], paid:["paid"], other:["draft","closed"]};
async function viewAdminJobs(sf){
  if(sf !== "all" && !ADMIN_GROUPS[sf]) sf = "open";
  const [jobs, apps] = await Promise.all([api().listJobs({}), api().listApplications({})]);
  jobs.filter(j => !j.audience).forEach(j => { j.audience = "all"; api().saveJob(j.id, {audience:"all"}).catch(e => console.error(e)); });
  jobs.filter(j => j.status === "open" && j.audience === "priority" && j.autoAllAt && j.autoAllAt <= Date.now() && !apps.some(a => a.jobId === j.id && ["applied", "selected"].includes(a.status)))
    .forEach(j => { j.audience = "all"; j.autoAllAt = null; api().saveJob(j.id, {audience:"all", autoAllAt:null}).then(() => notifyNewJob(j.id, j)).catch(e => console.error(e)); });
  const cnt = {};
  apps.forEach(a => { if(a.status === "applied" || a.status === "selected") cnt[a.jobId] = (cnt[a.jobId] || 0) + 1; });
  const segs = [["open","募集中"],["active","進行中"],["unpaid","支払待ち"],["paid","支払済み"],["other","下書き・締切"],["all","すべて"]];
  const inSeg = (j, k) => k === "all" || ADMIN_GROUPS[k].includes(j.status);
  const list = jobs.filter(j => inSeg(j, sf));
  const posted = j => j.publishedAt || j.createdAt;
  const card = j => {
    const c = S.crafts.get(j.assignedTo);
    const before = ["draft","open","closed"].includes(j.status);
    const foot = before
      ? `<p class="foot">${j.jobNo ? `${esc(j.jobNo)}　` : ""}応募 <span class="count">${cnt[j.id] || 0}</span> 件　${j.status === "draft" ? "作成" : "掲載"} ${fmtTime(posted(j))}</p>`
      : `<p class="foot">${j.jobNo ? `${esc(j.jobNo)}　` : ""}${progressMini(j)}${esc(statusLabel(j))}${c ? `　${esc(c.name)}` : ""}</p>`;
    return jobCard(j, {href:`#/admin/job/${j.id}`, foot, showPrice:true, stampHtml:statusStamp(j)});
  };
  let body;
  if(!list.length){
    body = `<div class="empty">この状態の案件はありません。${sf === "open" ? `<br><a href="#/admin/new">新しい案件を作る</a>` : ""}</div>`;
  } else if(sf === "open"){
    // 募集中は時系列：作業日の近い順（または掲載の新しい順）に日付ごとにまとめる
    const byPosted = S.adminSort === "posted";
    const sorted = [...list].sort(byPosted ? (a, b) => posted(b) - posted(a)
      : (a, b) => (a.startDate || "9").localeCompare(b.startDate || "9") || posted(a) - posted(b));
    const groups = [];
    sorted.forEach(j => {
      const k = byPosted ? isoOf(posted(j)) : (j.startDate || "");
      const g = groups[groups.length - 1];
      if(g && g[0] === k) g[1].push(j); else groups.push([k, [j]]);
    });
    body = `<div class="filters"><select data-adminsort aria-label="並び順">
        <option value="work" ${!byPosted ? "selected" : ""}>作業日が近い順</option>
        <option value="posted" ${byPosted ? "selected" : ""}>掲載が新しい順</option></select></div>`
      + groups.map(([k, js]) => `<h2 class="day-head"><b>${k ? fmtDay(k) : "日程未定"}</b>${byPosted ? "に掲載" : "の作業"}　${js.length}件</h2>
        <div class="list grid">${js.map(card).join("")}</div>`).join("");
  } else {
    body = `<div class="list grid">${list.sort((a, b) => (a.startDate || "9").localeCompare(b.startDate || "9")).map(card).join("")}</div>`;
  }
  return `${lateNotes(jobs, true)}<div class="page-head"><div><h1>案件</h1><p class="lead">案件の作成、発注、進捗の確認を行います。</p></div><a class="btn" href="#/admin/new">新しい案件を作る</a></div>
    <nav class="seg" aria-label="状態で絞り込む">${segs.map(([k, l]) => `<a href="#/admin/list/${k}" ${sf === k ? 'aria-current="true"' : ""}>${l}（${jobs.filter(j => inSeg(j, k)).length}）</a>`).join("")}</nav>
    ${body}`;
}

const PROP_KEYS = new WeakMap();
const normKey = v => String(v || "").normalize("NFKC").toLowerCase()
  .replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60))
  .replace(/[\s・\-‐－ー_.,、。()（）「」〜~]/g, "");
function propKey(p){ let k = PROP_KEYS.get(p); if(!k){ k = {n:normKey(p.name), a:normKey(p.address), c:normKey(p.company)}; PROP_KEYS.set(p, k); } return k; }
function searchProps(q, list, limit = 8, company = ""){
  const k = normKey(q), res = [];
  for(const p of list || []){
    if(company && p.company !== company) continue;
    if(!k){ res.push([3, p]); continue; }

function parseCsv(text){
  const rows = []; let row = [], cell = "", q = false;
  text = text.replace(/^﻿/, "");
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if(c === '"') q = true;
    else if(c === ","){ row.push(cell); cell = ""; }
    else if(c === "\n" || c === "\r"){ if(c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if(cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
async function readCsvFile(file){
  const buf = await file.arrayBuffer();
  let t = new TextDecoder("utf-8").decode(buf);
  if((t.match(/�/g) || []).length > 3){ try { t = new TextDecoder("shift_jis").decode(buf); } catch(e) {} }
  return parseCsv(t);
}

// 発注書の「その他施行予定業者」：同じ案件（親子）で手配した職人さんと、外部の工事の発注先
async function orderExtra(jobId){
  const [all, seal] = await Promise.all([api().listJobs({}).catch(() => []), api().getSeal().catch(() => "")]);
  const job = all.find(j => j.id === jobId) || {}, root = job.parentId || jobId;
  const name = uid => { const c = S.crafts?.get(uid); return c ? (c.tradeName || c.name) : ""; };
  const cats = j => [...new Set(itemsWithId(j.items).map(i => i.cat).filter(c => c && c !== "その他"))].join("・");
  const others = all.filter(j => (j.id === root || j.parentId === root) && j.id !== jobId && j.assignedTo)
    .map(j => ({name:name(j.assignedTo), label:cats(j), when:j.craftStart ? pdfPeriod(j.craftStart, j.craftEnd) : pdfPeriod(j.startDate, j.endDate)}));
  return {seal, others};
}
// 分離発注した案件どうしの発注書の「その他施行予定業者」を、いまの入る日に合わせて更新する（手で直した発注書は変えない）
async function refreshFamilyOthers(jobId){
  const all = await api().listJobs({}), job = all.find(j => j.id === jobId) || {}, root = job.parentId || jobId;
  for(const j of all.filter(x => (x.id === root || x.parentId === root) && x.assignedTo)){
    const d = await api().getDocument(`${j.id}_order`).catch(() => null); if(!d || d.manual) continue;
    const {others} = await orderExtra(j.id);
    if(JSON.stringify(others) !== JSON.stringify(d.others || [])){ d.others = others; await api().saveDocument(d); }
  }
}
async function moDoc(jobId, oid){

  const o = orders.find(x => x.id === oid); if(!o) throw new Error("発注書が見つかりません");
  const sup = sups.find(x => x.id === o.supplierId) || {};
  const full = {...o, terms:o.terms || sup.terms || ""};
  return {o:full, sup, job, priv, orders, html:o.kind === "work" ? rfWorkHtml(full, job, priv, seal) : rfMaterialHtml(full, job, priv, seal),
    fname:pdfFileName({name:String(o.supplierName || "").replace(/株式会社|有限会社|（株）|\(株\)/g, "").trim()})};
}

function priceSellStash(){
  const co = S.priceCo || "";
  document.querySelectorAll("form[data-form=prices] .price-row").forEach(r => {
    const v = r.querySelector("[name=p_sell]").value;
    if(!co){ r.dataset.sell = v; return; }

  });
}

const normInvoice = v => { let t = String(v || "").normalize("NFKC").replace(/[\s-]/g, "").toUpperCase(); if(/^\d{13}$/.test(t)) t = "T" + t; return t; };

const invoiceVerified = c => !!(c?.invoiceNumber && c.invoiceVerified && c.invoiceVerified.number === normInvoice(c.invoiceNumber));

// お知らせの中身：{key:[{href, title, reasons:[{t, tone}]}]}（タブのバッジ・お知らせ欄・カードの目印に使う）
function buildNotices(seenJobs, seenApplied){
  const d = S.bw, out = {}, add = (k, href, title, t, tone, key = t) => {
    const list = out[k] ||= [], it = list.find(x => x.href === href);
    if(it) it.reasons.push({t, tone, key}); else list.push({href, title, reasons:[{t, tone, key}]});
  };
  if(isCoRole(S.profile?.role)){
    const jobs = new Map((d.jobs || []).map(j => [j.id, j])), napp = {};
    (d.apps || []).forEach(a => { const j = jobs.get(a.jobId); if(j && (j.status === "open" || j.status === "closed")) napp[a.jobId] = (napp[a.jobId] || 0) + 1; });
    Object.entries(napp).forEach(([id, n]) => add("jobs", `#/admin/job/${id}`, jobs.get(id).title, `応募 ${n}件・発注先を選んでください`, "blue", "応募あり（発注先の選定待ち）"));
    (d.jobs || []).filter(j => j.status === "finished").forEach(j => add("jobs", `#/admin/job/${j.id}`, j.title, "作業完了・完了確認をしてください", "orange"));
    (d.jobs || []).filter(j => j.status === "selected").forEach(j => add("jobs", `#/admin/job/${j.id}`, j.title, "先払い待ち・振込をお願いします", "orange", "先払い待ち"));
    (d.reports || []).forEach(r => add("jobs", `#/admin/job/${r.jobId}`, r.jobTitle || jobs.get(r.jobId)?.title || "案件", "完了報告が届きました", "orange"));
    (d.invoices || []).sort((a, b) => a.issuedAt - b.issuedAt).forEach(v => add("invoices", `#/admin/invoices/${v.month}`, `${v.from?.name || "業者"}　${fmtMonth(v.month)}分 ${yenFull(v.total)}`, "支払待ち", "orange"));
  } else {
    const appliedIds = new Set((d.myApps || []).map(a => a.jobId));
    (d.open || []).filter(j => (j.publishedAt || j.createdAt || 0) > seenJobs && !appliedIds.has(j.id))
      .forEach(j => add("jobs", `#/job/${j.id}`, j.title, "新着の募集", "blue"));
    (d.myApps || []).filter(a => (a.status === "selected" || a.status === "rejected") && (a.updatedAt || 0) > seenApplied)
      .forEach(a => add("applied", a.status === "selected" ? `#/work/${a.jobId}` : `#/job/${a.jobId}`, a.jobTitle, a.status === "selected" ? "採用されました" : "見送りになりました", a.status === "selected" ? "green" : "gray"));
    const reported = new Set((d.myReports || []).filter(r => r.status !== "returned").map(r => r.jobId));
    const returned = new Set((d.myReports || []).filter(r => r.status === "returned").map(r => r.jobId));
    (d.mine || []).forEach(j => {
      if(j.status === "assigned" && j.declinedAt) return;
      if(j.status === "assigned" && !j.acceptedAt) add("work", `#/work/${j.id}`, j.title, "発注内容を確認して、承諾してください", "orange", "承諾待ち");
      else if(j.status === "assigned" && !j.craftStart) add("work", `#/work/${j.id}`, j.title, "入る日を決めてください", "orange", "入る日待ち");
      else if(j.status === "assigned") add("work", `#/work/${j.id}`, j.title, `作業開始を押してください（${fmtDay(workDays(j).start)}〜）`, "blue", "作業開始待ち");
      else if(j.status === "working") add("work", `#/work/${j.id}`, j.title, "作業完了を押してください", "blue");
      else if(j.status === "finished" && !reported.has(j.id)) add("work", `#/work/${j.id}`, j.title, returned.has(j.id) ? "差し戻し・完了報告をやり直してください" : "完了報告をしてください", "orange");
    });
  }
  return out;
}
function computeBadges(){
  const n = buildNotices(getSeen("jobs"), getSeen("applied"));

// いま開いているタブの「お知らせ」：何についての通知かを一覧と目印で示す
function currentNoticeKey(){
  const h = location.hash || "#/";
  if(isCoRole(S.profile?.role)){
    if(/^#\/admin\/?$/.test(h) || h.startsWith("#/admin/list")) return "jobs";
    if(h.startsWith("#/admin/invoices")) return "invoices";
    return "";
  }
  const t = h.replace(/^#\/?/, "").split("/")[0] || "jobs";
  return ["jobs", "applied", "work"].includes(t) && !h.match(/^#\/(job|work)\/./) ? t : "";
}
function decorateNotices(){
  const main = $(".main"); if(!main) return;
  main.querySelectorAll(".notice-box, .flags").forEach(el => el.remove());
  const k = currentNoticeKey(); if(!k) return;
  // 新着・結果は「このタブを開く前に未読だったもの」を表示する
  const items = (k === "jobs" || k === "applied") && !isCoRole(S.profile?.role)
    ? (buildNotices(S.viewSeen?.jobs ?? getSeen("jobs"), S.viewSeen?.applied ?? getSeen("applied"))[k] || [])
    : (S.notices?.[k] || []);
  if(!items.length) return;
  const flag = r => `<span class="flag ${r.tone}">${esc(r.t)}</span>`;
  const box = document.createElement("section");
  box.className = "notice-box"; box.setAttribute("aria-label", "お知らせ");
  box.innerHTML = `<h2>お知らせ <span class="badge">${items.length}</span></h2><ul>${items.map(it => `<li><a href="${it.href}"><b>${esc(it.title)}</b><span class="flags-in">${it.reasons.map(flag).join("")}</span></a></li>`).join("")}</ul>`;
  const head = main.querySelector(".page-head") || main.querySelector(".lead") || main.querySelector("h1");
  if(head) head.after(box); else main.prepend(box);
  // 一覧のカードにも同じ目印を付ける
  items.forEach(it => main.querySelectorAll(`a.job[href="${it.href}"], a.row-item[href="${it.href}"]`).forEach(card => {
    if(card.closest(".notice-box")) return;
    const f = document.createElement("span"); f.className = "flags"; f.innerHTML = it.reasons.map(flag).join("");
    card.classList.contains("job") ? card.prepend(f) : card.querySelector(".row-main")?.prepend(f);
  }));
}

function incoming(t){

const isCloth = name => /クロス|壁紙/.test(name || "") && !/クリーニング|襖|洗浄/.test(name || "");
const r2 = n => Math.round(n * 100) / 100;
function memoDims(row){

    .filter(d => d.h > 0 && d.l > 0).map(d => ({...d, a:r2(d.h * d.l)}));
}

function memoRowState(row){
  const name = row.querySelector("[name=m_name]").value.trim(), pid = row.querySelector("[name=m_pid]").value;
  const inTable = !!estPrices().find(x => (pid && x.id === pid && x.name === name) || x.name === name);
  const dims = row.querySelector(".memo-dims"), nw = row.querySelector(".memo-new"), cloth = isCloth(name);

  dims.querySelectorAll("[name=d_l]").forEach(i => { i.placeholder = ceil ? "横" : "長さ"; });
  if(cloth) memoDimCalc(row);
}
function memoDimCalc(row){
  const ds = memoDims(row), main = r2(ds.filter(d => !d.acc).reduce((a, d) => a + d.a, 0)), acc = r2(ds.filter(d => d.acc).reduce((a, d) => a + d.a, 0));
  row.querySelectorAll(".md-row").forEach(d => { const h = Number(d.querySelector("[name=d_h]").value) || 0, l = Number(d.querySelector("[name=d_l]").value) || 0;
    d.querySelector(".md-a").textContent = h > 0 && l > 0 ? `${r2(h * l)}㎡` : "—"; d.classList.toggle("acc", d.querySelector("[name=d_acc]").checked); });
  row.querySelector(".md-acc").hidden = !acc;
  row.querySelector(".md-sum").innerHTML = ds.length ? `数量 <b>${main}㎡</b>${acc ? `　＋ アクセント <b class="acc">${acc}㎡</b>（別の行になります）` : ""}` : "";

}
